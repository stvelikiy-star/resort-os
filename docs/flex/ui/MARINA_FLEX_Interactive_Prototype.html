ia-hidden=\"true\" viewBox=\"0 0 24 24\"><path d=\"M12 3a9 9 0 100 18 9 9 0 000-18zM12 7v5l3 2\"><\/path><\/svg>Подписки<\/a>\n<a class=\"nav\" href=\"#\"><svg aria-hidden=\"true\" viewBox=\"0 0 24 24\"><path d=\"M4 20V10M10 20V4M16 20v-7M22 20H2\"><\/path><\/svg>Аналитика<\/a>\n<a class=\"nav\" href=\"#\"><svg aria-hidden=\"true\" viewBox=\"0 0 24 24\"><path d=\"M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z\"><\/path><\/svg>Аудит<\/a>\n<div class=\"sidefoot\"><b style=\"color:#fff\">Режим: OFF · DEMO<\/b><br/>Связь с гостиничной PMS и блокировки не включены.<\/div>\n<\/aside><main aria-label=\"Обзор коммерческой платформы\" class=\"main\">\n<header class=\"top\"><div><h1>Центр управления MARINA FLEX<\/h1><p>Контроль гостиниц, подписок, партнёров и финансов платформы<\/p><\/div><span class=\"demo\">Демо-данные · Backend QA, Production OFF<\/span><\/header>\n<section class=\"grid g4\">\n<div class=\"card kpi cy\"><small>Коммерческих гостиниц<\/small><b>—<\/b><span class=\"note\">Нет подключённого LIVE-реестра<\/span><\/div>\n<div class=\"card kpi\"><small>Подписочная выручка (MRR)<\/small><b>— KGS<\/b><span class=\"note\">Не подтверждено банком<\/span><\/div>\n<div class=\"card kpi gold\"><small>Комиссии агентам<\/small><b>— KGS<\/b><span class=\"note\">Начисления пока QA-only<\/span><\/div>\n<div class=\"card kpi\"><small>Инвесторские выплаты<\/small><b>— KGS<\/b><span class=\"note\">Реестр выплат не подключён<\/span><\/div>\n<\/section>\n<section class=\"grid g2\">\n<div class=\"card\"><h3>Реестр гостиниц <span class=\"chip cy\">Демо<\/span><\/h3><p class=\"note\">Коммерческая регистрация PENDING и проверка привязки реализованы в изолированном QA backend. Здесь показаны только макеты, не реальные клиенты.<\/p>\n<div class=\"scroll\"><table class=\"tbl\"><thead><tr><th>Пример<\/th><th>Подписка<\/th><th>Учёт<\/th><\/tr><\/thead><tbody><tr><td>Отель A<\/td><td><span class=\"chip ok\">Демо: активна<\/span><\/td><td>Синтетические данные<\/td><\/tr><tr><td>Отель B · Каракол<\/td><td><span class=\"chip warn\">Демо: льготный период<\/span><\/td><td>Синтетические данные<\/td><\/tr><\/tbody><\/table><\/div>\n<button class=\"btn\" data-demo-nav=\"hotel\" style=\"margin-top:14px\" type=\"button\">Открыть карточку гостиницы →<\/button>\n<\/div>\n<div class=\"card\"><h3>Состояние разработки <span class=\"chip gold\">GitHub · 22.11.2026<\/span><\/h3>\n<div class=\"tl\"><div><time>База<\/time><span>10 preview SQL-миграций, изолированная PostgreSQL QA<\/span><\/div><div><time>API<\/time><span>JWT/RLS, каталог, onboarding, расчёт подписок, партнёрские начисления<\/span><\/div><div><time>UI<\/time><span>6 макетов объединены в интерактивный демонстрационный прототип<\/span><\/div><div><time>Production<\/time><span><b style=\"color:var(--warn)\">Не развёрнута — NO-GO<\/b><\/span><\/div><\/div>\n<\/div>\n<\/section>\n<section class=\"card\"><h3>Финансовый контур — готовность интерфейса<\/h3><div class=\"grid g3\"><div><div class=\"chip cy\">Счёт → платёж<\/div><p class=\"note\">QR и финансы только как схема; реальный банковский callback не подключён.<\/p><\/div><div><div class=\"chip gold\">Начисления агентов<\/div><p class=\"note\">Ролевой API доступен в QA, фактические выплаты ещё не внедрены.<\/p><\/div><div><div class=\"chip ok\">Инвесторский контроль<\/div><p class=\"note\">Персональная изоляция и расчёт QA-only. Выплаты требуют подтверждённых банковских данных.<\/p><\/div><\/div><\/section>\n<\/main>\n<\/div>\n<\/x-dc>\n\n<div class=\"flex-watermark\">DEMO • НЕ БАНКОВСКИЕ ДАННЫЕ<\/div><script>(function(){\n      const nav={\"Обзор\":\"admin\",\"Гостиницы\":\"hotel\",\"Мои отели\":\"agent\",\"Агенты\":\"agent\",\"Инвесторы\":\"investor\",\"Подписка и счета\":\"owner\",\"← Все гостиницы\":\"admin\"};\n      const say=(kind,label)=>parent.postMessage({kind,label,source:document.title},'*');\n      document.addEventListener('click',e=>{\n        const item=e.target.closest('a,button'); if(!item)return;\n        const label=(item.textContent||'').trim().replace(/\\s+/g,' ');\n        if(item.matches('a')&&(item.getAttribute('href')||'').startsWith('http'))return;\n        e.preventDefault();\n        if(item.dataset.demoNav){say('navigate',item.dataset.demoNav);return;}\n        if(item.matches('a')&&nav[label]){say('navigate',nav[label]);return;}\n        const l=label.toLowerCase();\n        if(['день','неделя','месяц','год','нед.','мес.'].includes(l)){\n          const group=item.closest('.seg')||item.parentElement;\n          for(const el of group.querySelectorAll('button')) el.classList.toggle('on',el===item);\n          say('period',label);return;\n        }\n        if(label.includes('Тёмная / светлая')){document.documentElement.classList.toggle('light-mode');say('theme',label);return;}\n        say(item.matches('button')?'action':'section',label);\n      });\n    })();<\/script><\/body><\/html>", "hotel": "<!DOCTYPE html>\n\n<html lang=\"ru\"><head>\n<meta charset=\"utf-8\"/>\n<title>Super Admin — карточка отеля<\/title>\n\n<style>/* MARINA FLEX — Future Luxury 2.0 (макет). Палитра из админки MARINA: navy, cyan, champagne. */\n:root{\n  --bg:#031d33; --bg2:#042846; --panel:#07335a; --panel2:#0a3f6d; --line:rgba(120,205,235,.20);\n  --ink:#f2faff; --mut:#a9c6d8; --cy:#00d8ff; --cy2:#6fe9ff; --gold:#e6bd70; --ok:#5fe3a8; --warn:#ffcf6b; --bad:#ff8a8a;\n  --r:20px;\n}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}\na{color:var(--cy2);text-decoration:none}\nbutton{font:inherit;cursor:pointer}\n.shell{min-height:100%;display:flex;flex-wrap:wrap;background:radial-gradient(1200px 600px at 85% -10%,rgba(0,216,255,.14),transparent 60%),radial-gradient(900px 500px at 0% 110%,rgba(230,189,112,.10),transparent 60%),var(--bg)}\n.side{flex:0 0 248px;padding:28px 20px;border-right:1px solid var(--line);background:rgba(4,40,70,.6);display:flex;flex-direction:column;gap:6px}\n.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.14em;font-size:15px;padding:0 10px 22px}\n.logo i{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--cy),#1c7bd6);display:block;box-shadow:0 0 24px rgba(0,216,255,.45)}\n.logo small{display:block;font-weight:500;letter-spacing:.04em;color:var(--gold);font-size:11px}\n.nav{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;color:var(--mut);font-size:14px;font-weight:500;min-height:44px}\n.nav.on{background:linear-gradient(90deg,rgba(0,216,255,.20),rgba(0,216,255,.04));color:#fff;box-shadow:inset 0 0 0 1px rgba(0,216,255,.35)}\n.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}\n.sidefoot{margin-top:auto;padding:14px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.03);font-size:12px;color:var(--mut)}\n.main{flex:999 1 640px;min-width:0;padding:28px 36px 48px;display:flex;flex-direction:column;gap:22px}\n.top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}\n.top h1{margin:0;font-size:30px;letter-spacing:-.02em;font-weight:700}\n.top p{margin:4px 0 0;color:var(--mut);font-size:14px}\n.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}\n.seg{display:flex;padding:4px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line)}\n.seg button{border:0;background:none;color:var(--mut);padding:9px 14px;border-radius:10px;font-size:13px;min-height:36px}\n.seg button.on{background:var(--cy);color:#022a44;font-weight:700}\n.btn{border:0;border-radius:14px;padding:12px 20px;min-height:44px;font-weight:700;font-size:14px;background:linear-gradient(135deg,var(--cy),#32a8ff);color:#022a44;box-shadow:0 10px 30px rgba(0,216,255,.28)}\n.btn.gh{background:rgba(255,255,255,.06);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}\n.btn.gold{background:linear-gradient(135deg,#f3d58f,var(--gold));color:#3a2a08;box-shadow:0 10px 30px rgba(230,189,112,.25)}\n.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:600;background:rgba(255,255,255,.07);color:var(--mut)}\n.chip.ok{background:rgba(95,227,168,.14);color:var(--ok)}.chip.warn{background:rgba(255,207,107,.14);color:var(--warn)}.chip.bad{background:rgba(255,138,138,.14);color:var(--bad)}.chip.cy{background:rgba(0,216,255,.14);color:var(--cy2)}.chip.gold{background:rgba(230,189,112,.16);color:var(--gold)}\n.demo{display:inline-flex;gap:8px;align-items:center;font-size:12px;color:var(--gold);padding:6px 12px;border:1px dashed rgba(230,189,112,.5);border-radius:999px}\n.grid{display:grid;gap:16px}\n.g6{grid-template-columns:repeat(6,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}\n.card{border-radius:var(--r);padding:20px;background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid var(--line);backdrop-filter:blur(8px)}\n.card h3{margin:0 0 14px;font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px}\n.kpi small{display:block;color:var(--mut);font-size:12px;margin-bottom:8px}\n.kpi b{display:block;font-size:26px;letter-spacing:-.02em;font-weight:700}\n.kpi em{font-style:normal;font-size:12px;color:var(--ok)}\n.kpi.gold b{color:var(--gold)}.kpi.cy b{color:var(--cy2)}\n.tbl{width:100%;border-collapse:collapse;font-size:13.5px}\n.tbl th{text-align:left;font-weight:600;color:var(--mut);font-size:12px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}\n.tbl td{padding:14px 12px;border-bottom:1px solid rgba(120,205,235,.10);white-space:nowrap}\n.tbl tr:last-child td{border:0}\n.scroll{overflow-x:auto}\n.num{text-align:right;font-variant-numeric:tabular-nums}\n.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}\n.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--cy),var(--gold))}\n.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mut)}\n.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}\n.tl{display:flex;flex-direction:column;gap:0}\n.tl div{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid rgba(120,205,235,.10);font-size:13px}\n.tl div:last-child{border:0}\n.tl time{flex:0 0 92px;color:var(--mut);font-variant-numeric:tabular-nums}\n.states{display:flex;flex-wrap:wrap;gap:8px;align-items:center}\n.st{padding:9px 14px;border-radius:12px;font-size:12.5px;font-weight:700;background:rgba(255,255,255,.06);color:var(--mut);border:1px solid var(--line)}\n.st.on{background:rgba(0,216,255,.18);color:#fff;border-color:var(--cy)}\n.st.warn{background:rgba(255,207,107,.16);color:var(--warn);border-color:rgba(255,207,107,.5)}\n.arrow{color:var(--mut)}\n.qr{width:168px;height:168px;border-radius:16px;background:#fff;padding:12px;display:grid;grid-template-columns:repeat(11,1fr);gap:2px;flex:none}\n.qr i{background:#031d33;border-radius:1px}.qr i.o{background:transparent}\n.lock{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;background:rgba(255,207,107,.10);border:1px solid rgba(255,207,107,.35);font-size:13px;color:#ffe3a3}\n.note{color:var(--mut);font-size:12.5px;line-height:1.55}\n.ring{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--gold) 0 62%,rgba(255,255,255,.10) 0);position:relative;flex:none}\n.ring::after{content:\"\";position:absolute;inset:12px;border-radius:50%;background:var(--bg2)}\n.ring b{position:relative;z-index:1;font-size:26px}\n.phone{width:390px;min-height:844px;background:radial-gradient(500px 300px at 90% -5%,rgba(0,216,255,.16),transparent 60%),var(--bg);padding:22px 18px 96px;display:flex;flex-direction:column;gap:14px;position:relative}\n.tabbar{position:absolute;left:12px;right:12px;bottom:14px;display:grid;grid-template-columns:repeat(4,1fr);padding:8px;border-radius:22px;background:rgba(7,51,90,.92);border:1px solid var(--line)}\n.tabbar a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;font-size:11px;color:var(--mut);min-height:44px;border-radius:14px}\n.tabbar a.on{color:#fff;background:rgba(0,216,255,.18)}\n.tabbar svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}\n@media (max-width:1100px){.g6{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}}\n@media (max-width:820px){.side{flex:1 0 100%;flex-direction:row;overflow-x:auto;padding:14px}.logo{padding:0 10px 0 0}.sidefoot{display:none}.main{padding:20px 16px 40px}.g2{grid-template-columns:1fr}}\n@media (max-width:560px){.g6,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}\n<\/style>\n<style>\n    .flex-watermark{position:fixed;right:14px;bottom:14px;background:#071c2f;color:#f9d694;\n      font:700 11px/1.4 system-ui,sans-serif;letter-spacing:.04em;padding:8px 12px;\n      border:1px solid rgba(230,189,112,.55);border-radius:100px;z-index:9000;pointer-events:none}\n    a[href=\"#\"],button{transition:filter .2s,transform .2s}a[href=\"#\"]:hover,button:hover{filter:brightness(1.18)}\n    @media(max-width:600px){.flex-watermark{display:none}}\n    a:focus-visible,button:focus-visible{outline:3px solid #e6bd70;outline-offset:2px}\n    <\/style><\/head>\n<body>\n<x-dc>\n\n<div class=\"shell\">\n<aside aria-label=\"Меню платформы\" class=\"side\">\n<div class=\"logo\"><i><\/i><span>MARINA<small>FLEX · Super Admin<\/small><\/span><\/div>\n<a class=\"nav\" href=\"#\"><svg aria-hidden=\"true\" viewBox=\"0 0 24 24\"><path d=\"M4 13h6V4H4zM14 20h6v-9h-6zM14 4h6v4h-6zM4 20h6v-3H4z\"><\/path><\/svg>Обзор<\/a>\n<a class=\"nav on\" href=\"#\"><svg aria-hidden=\"true\" viewBox=\"0 0 24 24\"><path d=\"M3 21V9l9-6 9 /i><i><\/i><i class=\"o\"><\/i><i><\/i><i><\/i>\n<i class=\"o\"><\/i><i><\/i><i><\/i><i><\/i><i class=\"o\"><\/i><i><\/i><i><\/i><i><\/i><i><\/i><i class=\"o\"><\/i><i><\/i>\n<\/div>\n<div style=\"flex:1 1 150px;display:flex;flex-direction:column;gap:10px\">\n<button class=\"btn\">Скачать счёт (PDF)<\/button>\n<button class=\"btn gh\">Открыть в банковском приложении<\/button>\n<span class=\"note\">Статус изменится после подтверждения банком.<\/span>\n<\/div>\n<\/div>\n<\/div>\n<\/section>\n<section class=\"card\">\n<h3>Ваши функции <span class=\"note\">Новые функции подключаются по запросу — их включает платформа<\/span><\/h3>\n<div class=\"grid g3\">\n<div class=\"card\" style=\"padding:16px\"><div style=\"display:flex;justify-content:space-between;align-items:center\"><b>Шахматка и брони<\/b><span class=\"chip\">Базовая<\/span><\/div><p class=\"note\">Входит в базовый тариф. Не отключается.<\/p><\/div>\n<div class=\"card\" style=\"padding:16px\"><div style=\"display:flex;justify-content:space-between;align-items:center\"><b>ИИ-ассистент<\/b><span class=\"chip ok\">Подключена<\/span><\/div><p class=\"note\">До дд.мм.гггг · использовано 000 из 500<\/p><button class=\"btn gh\" style=\"min-height:40px;padding:8px 14px\">Продлить<\/button><\/div>\n<div class=\"card\" style=\"padding:16px\"><div style=\"display:flex;justify-content:space-between;align-items:center\"><b>Кухня и склад<\/b><span class=\"chip gold\">Доступна<\/span><\/div><p class=\"note\">Цена: 00 000 KGS / мес. Требует функцию «Ресторан».<\/p><button class=\"btn\" style=\"min-height:40px;padding:8px 14px\">Запросить подключение<\/button><\/div>\n<div class=\"card\" style=\"padding:16px\"><div style=\"display:flex;justify-content:space-between;align-items:center\"><b>Channel Manager<\/b><span class=\"chip\">В разработке<\/span><\/div><p class=\"note\">Подключение к Booking.com пока недоступно.<\/p><\/div>\n<div class=\"card\" style=\"padding:16px\"><div style=\"display:flex;justify-content:space-between;align-items:center\"><b>Маркетинг<\/b><span class=\"chip cy\">Пробный период<\/span><\/div><p class=\"note\">Осталось 00 дней.<\/p><button class=\"btn gh\" style=\"min-height:40px;padding:8px 14px\">Сезонное подключение<\/button><\/div>\n<div class=\"card\" style=\"padding:16px\"><div style=\"display:flex;justify-content:space-between;align-items:center\"><b>Аналитика+<\/b><span class=\"chip gold\">Доступна<\/span><\/div><p class=\"note\">Цена: 00 000 KGS / мес.<\/p><button class=\"btn\" style=\"min-height:40px;padding:8px 14px\">Запросить подключение<\/button><\/div>\n<\/div>\n<\/section>\n<section class=\"card\">\n<h3>История счетов и платежей<\/h3>\n<div class=\"scroll\"><table class=\"tbl\"><thead><tr><th>Счёт<\/th><th>Период<\/th><th class=\"num\">Сумма<\/th><th class=\"num\">Оплачено<\/th><th>Статус<\/th><th><\/th><\/tr><\/thead><tbody>\n<tr><td>№ 0000<\/td><td>дд.мм – дд.мм<\/td><td class=\"num\">00 000<\/td><td class=\"num\">0<\/td><td><span class=\"chip warn\">Ожидает оплаты<\/span><\/td><td><a href=\"#\">PDF<\/a><\/td><\/tr>\n<tr><td>№ 0000<\/td><td>дд.мм – дд.мм<\/td><td class=\"num\">00 000<\/td><td class=\"num\">00 000<\/td><td><span class=\"chip ok\">Оплачен<\/span><\/td><td><a href=\"#\">PDF<\/a><\/td><\/tr>\n<tr><td>№ 0000<\/td><td>дд.мм – дд.мм<\/td><td class=\"num\">00 000<\/td><td class=\"num\">00 000<\/td><td><span class=\"chip ok\">Оплачен частями<\/span><\/td><td><a href=\"#\">PDF<\/a><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<\/section>\n<section class=\"card\">\n<h3>Если оплата задерживается<\/h3>\n<p class=\"note\" style=\"margin:0\">Сначала платные функции переходят в режим «только чтение»: история видна. Заселённые гости, действующие брони и платежи гостей продолжают работать. Вход, раздел оплаты, счета и экспорт данных всегда доступны владельцу. После подтверждённой оплаты доступ восстанавливается автоматически.<\/p>\n<\/section>\n<\/main>\n<\/div>\n<\/x-dc>\n\n<div class=\"flex-watermark\">DEMO • НЕ БАНКОВСКИЕ ДАННЫЕ<\/div><script>(function >\n\n<div class=\"shell\">\n<aside aria-label=\"Меню агента\" class=\"side\">\n<div class=\"logo\"><i><\/i><span>MARINA<small>FLEX · Агент<\/small><\/span><\/div>\n<a class=\"nav on\" href=\"#\"><svg aria-hidden=\"true\" viewBox=\"0 0 24 24\"><path d=\"M4 13h6V4H4zM14 20h6v-9h-6zM14 4h6v4h-6zM4 20h6v-3H4z\"><\/path><\/svg>Обзор<\/a>\n<a class=\"nav\" href=\"#\"><svg aria-hidden=\"true\" viewBox=\"0 0 24 24\"><path d=\"M3 21V9l9-6 9 6v12M9 21v-6h6v6\"><\/path><\/svg>Мои отели<\/a>\n<a class=\"nav\" href=\"#\"><svg aria-hidden=\"true\" viewBox=\"0 0 24 24\"><path d=\"M4 7h16M4 12h16M4 17h10\"><\/path><\/svg>Продажи функций<\/a>\n<a class=\"nav\" href=\"#\"><svg aria-hidden=\"true\" viewBox=\"0 0 24 24\"><path d=\"M12 3v18M16 7.5c0-1.7-1.8-2.5-4-2.5s-4 .9-4 2.5 1.8 2.3 4 2.5 4 .9 4 2.5-1.8 2.5-4 2.5-4-.8-4-2.5\"><\/path><\/svg>Комиссии<\/a>\n<a class=\"nav\" href=\"#\"><svg aria-hidden=\"true\" viewBox=\"0 0 24 24\"><path d=\"M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z\"><\/path><\/svg>Выплаты<\/a>\n<a class=\"nav\" href=\"#\"><svg aria-hidden=\"true\" viewBox=\"0 0 24 24\"><path d=\"M4 20V10M10 20V4M16 20v-7M22 20H2\"><\/path><\/svg>Рейтинг и KPI<\/a>\n<div class=\"sidefoot\">Вы видите только свои отели и свои комиссии. Данные гостей, броней и финансов отелей недоступны.<\/div>\n<\/aside>\n<main class=\"main\">\n<div class=\"top\">\n<div><h1>Кабинет агента<\/h1><p>Подключённые отели, функции и комиссии по подтверждённым платежам<\/p><\/div>\n<div class=\"tools\"><span class=\"demo\">Демо-данные макета<\/span><div aria-label=\"Период\" class=\"seg\" role=\"group\"><button>Неделя<\/button><button class=\"on\">Месяц<\/button><button>Год<\/button><\/div><button class=\"btn gh\">RU · KG · EN<\/button><\/div>\n<\/div>\n<section class=\"grid g4\">\n<div class=\"card kpi\"><small>Мои отели (активные)<\/small><b>00<\/b><em style=\"color:var(--mut)\">всего 00<\/em><\/div>\n<div class=\"card kpi cy\"><small>MRR моих отелей<\/small><b>000 000<\/b><em>KGS / мес<\/em><\/div>\n<div class=\"card kpi gold\"><small>Комиссии начислено<\/small><b>00 000<\/b><em style=\"color:var(--mut)\">по подтверждённым оплатам<\/em><\/div>\n<div class=\"card kpi\"><small>К выплате / выплачено<\/small><b>00 000 <span style=\"font-size:16px;color:var(--mut)\">/ 00 000<\/span><\/b><em style=\"color:var(--mut)\">баланс<\/em><\/div>\n<\/section>\n<section class=\"grid g2\" style=\"grid-template-columns:minmax(0,2fr) minmax(0,1fr)\">\n<div class=\"card\">\n<h3>Мои отели<\/h3>\n<div class=\"scroll\"><table class=\"tbl\"><thead><tr><th>Отель<\/th><th>Статус подписки<\/th><th>Подключённые функции<\/th><th>Кто подключил<\/th><th class=\"num\">Моя комиссия<\/th><\/tr><\/thead><tbody>\n<tr><td><b>Отель A<\/b><\/td><td><span class=\"chip ok\">Активна<\/span><\/td><td>База, ИИ, Кухня<\/td><td>Я<\/td><td class=\"num\">00 000<\/td><\/tr>\n<tr><td><b>Отель B<\/b><\/td><td><span class=\"chip warn\">Льготный период<\/span><\/td><td>База, ИИ<\/td><td>Я<\/td><td class=\"num\">00 000<\/td><\/tr>\n<tr><td><b>Отель E<\/b><\/td><td><span class=\"chip bad\">Приостановлена<\/span><\/td><td>База<\/td><td>Я<\/td><td class=\"num\">0<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p class=\"note\" style=\"margin:14px 0 0\">Агент не видит брони, гостей, платежи гостей и финансы отеля — только статус подписки и свои суммы.<\/p>\n<\/div>\n<div class=\"card\">\n<h3>Баланс комиссий<\/h3>\n<div style=\"display:flex;flex-direction:column;gap:12px;font-size:13.5px\">\n<div style=\"display:flex;justify-content:space-between\"><span>Начислено<\/span><b>00 000<\/b><\/div>\n<div style=\"display:flex;justify-content:space-between\"><span>Утверждено к выплате<\/span><b style=\"color:var(--cy2)\">00 000<\/b><\/div>\n<div style=\"display:flex;justify-content:space-between\"><span>Выплачено<\/span><b style=\"color:var(--ok)\">00 000<\/b><\/div>\n<div style=\"display:flex;justify-content:space-between\"><span>Удержано (возвраты)<\/span><b style=\"color:var(--bad)\">− 0 000<\/b><\/div>\n<div class=\"bar\"><i style=\"width:55 {kind,label,source:document.title},'*');\n      document.addEventListener('click',e=>{\n        const item=e.target.closest('a,button'); if(!item)return;\n        const label=(item.textContent||'').trim().replace(/\\s+/g,' ');\n        if(item.matches('a')&&(item.getAttribute('href')||'').startsWith('http'))return;\n        e.preventDefault();\n        if(item.dataset.demoNav){say('navigate',item.dataset.demoNav);return;}\n        if(item.matches('a')&&nav[label]){say('navigate',nav[label]);return;}\n        const l=label.toLowerCase();\n        if(['день','неделя','месяц','год','нед.','мес.'].includes(l)){\n          const group=item.closest('.seg')||item.parentElement;\n          for(const el of group.querySelectorAll('button')) el.classList.toggle('on',el===item);\n          say('period',label);return;\n        }\n        if(label.includes('Тёмная / светлая')){document.documentElement.classList.toggle('light-mode');say('theme',label);return;}\n        say(item.matches('button')?'action':'section',label);\n      });\n    })();<\/script><\/body><\/html>", "investor": "<!DOCTYPE html>\n\n<html lang=\"ru\"><head>\n<meta charset=\"utf-8\"/>\n<title>Кабинет инвестора<\/title>\n\n<style>/* MARINA FLEX — Future Luxury 2.0 (макет). Палитра из админки MARINA: navy, cyan, champagne. */\n:root{\n  --bg:#031d33; --bg2:#042846; --panel:#07335a; --panel2:#0a3f6d; --line:rgba(120,205,235,.20);\n  --ink:#f2faff; --mut:#a9c6d8; --cy:#00d8ff; --cy2:#6fe9ff; --gold:#e6bd70; --ok:#5fe3a8; --warn:#ffcf6b; --bad:#ff8a8a;\n  --r:20px;\n}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}\na{color:var(--cy2);text-decoration:none}\nbutton{font:inherit;cursor:pointer}\n.shell{min-height:100%;display:flex;flex-wrap:wrap;background:radial-gradient(1200px 600px at 85% -10%,rgba(0,216,255,.14),transparent 60%),radial-gradient(900px 500px at 0% 110%,rgba(230,189,112,.10),transparent 60%),var(- 216,255,.28)}\n.btn.gh{background:rgba(255,255,255,.06);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}\n.btn.gold{background:linear-gradient(135deg,#f3d58f,var(--gold));color:#3a2a08;box-shadow:0 10px 30px rgba(230,189,112,.25)}\n.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:600;background:rgba(255,255,255,.07);color:var(--mut)}\n.chip.ok{background:rgba(95,227,168,.14);color:var(--ok)}.chip.warn{background:rgba(255,207,107,.14);color:var(--warn)}.chip.bad{background:rgba(255,138,138,.14);color:var(--bad)}.chip.cy{background:rgba(0,216,255,.14);color:var(--cy2)}.chip.gold{background:rgba(230,189,112,.16);color:var(--gold)}\n.demo{display:inline-flex;gap:8px;align-items:center;font-size:12px;color:var(--gold);padding:6px 12px;border:1px dashed rgba(230,189,112,.5);border-radius:999px}\n.grid{display:grid;gap:16px}\n.g6{grid-template-columns:repeat(6,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}\n.card{border-radius:var(--r);padding:20px;background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid var(--line);backdrop-filter:blur(8px)}\n.card h3{margin:0 0 14px;font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px}\n.kpi small{display:block;color:var(--mut);font-size:12px;margin-bottom:8px}\n.kpi b{display:block;font-size:26px;letter-spacing:-.02em;font-weight:700}\n.kpi em{font-style:normal;font-size:12px;color:var(--ok)}\n.kpi.gold b{color:var(--gold)}.kpi.cy b{color:var(--cy2)}\n.tbl{width:100%;border-collapse:collapse;font-size:13.5px}\n.tbl th{text-align:left;font-weight:600;color:var(--mut);font-size:12px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}\n.tbl td{padding:14px 12px;border-bottom:1px solid rgba(120,205,235,.10);white-space:nowrap}\n.tbl tr:last- adient(500px 300px at 90% -5%,rgba(0,216,255,.16),transparent 60%),var(--bg);padding:22px 18px 96px;display:flex;flex-direction:column;gap:14px;position:relative}\n.tabbar{position:absolute;left:12px;right:12px;bottom:14px;display:grid;grid-template-columns:repeat(4,1fr);padding:8px;border-radius:22px;background:rgba(7,51,90,.92);border:1px solid var(--line)}\n.tabbar a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;font-size:11px;color:var(--mut);min-height:44px;border-radius:14px}\n.tabbar a.on{color:#fff;background:rgba(0,216,255,.18)}\n.tabbar svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}\n@media (max-width:1100px){.g6{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}}\n@media (max-width:820px){.side{flex:1 0 100%;flex-direction:row;overflow-x:auto;padding:14px}.logo{padding:0 10px 0 0}.sidefoot{display:none}.main{padding:20px 16px 40px}.g2{grid-template-columns:1fr}}\n@media (max-width:560px){.g6,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}\n<\/style>\n<style>\n    .flex-watermark{position:fixed;right:14px;bottom:14px;background:#071c2f;color:#f9d694;\n      font:700 11px/1.4 system-ui,sans-serif;letter-spacing:.04em;padding:8px 12px;\n      border:1px solid rgba(230,189,112,.55);border-radius:100px;z-index:9000;pointer-events:none}\n    a[href=\"#\"],button{transition:filter .2s,transform .2s}a[href=\"#\"]:hover,button:hover{filter:brightness(1.18)}\n    @media(max-width:600px){.flex-watermark{display:none}}\n    a:focus-visible,button:focus-visible{outline:3px solid #e6bd70;outline-offset:2px}\n    <\/style><\/head>\n<body>\n<x-dc>\n\n<div class=\"shell\">\n<aside aria-label=\"Меню инвестора\" class=\"side\">\n<div class=\"logo\"><i><\/i><span>MARINA<small>FLEX · Инвестор<\/small><\/span><\/div>\n<a class=\"nav on\" href=\"#\"><svg aria-hidden=\"true\" viewBox=\"0 0 24 24\"><path d=\"M4 13h6V4H4zM14 20h6v-9h-6zM14 4h6v4h-6zM4 20h6v-3H4z\"><\/path><\/svg>Обзор<\/a>\n<a class=\"nav\" href=\"#\"><svg aria-hidden=\"true\" viewBox=\"0 0 24 24\"><path d=\"M5 3h14v18H5zM9 8h6M9 12h6M9 16h3\"><\/path><\/svg>Мой договор<\/a>\n<a class=\"nav\" href=\"#\"><svg aria-hidden=\"true\" viewBox=\"0 0 24 24\"><path d=\"M4 20V10M10 20V4M16 20v-7M22 20H2\"><\/path><\/svg>Начисления<\/a>\n<a class=\"nav\" href=\"#\"><svg aria-hidden=\"true\" viewBox=\"0 0 24 24\"><path d=\"M12 3v18M16 7.5c0-1.7-1.8-2.5-4-2.5s-4 .9-4 2.5 1.8 2.3 4 2.5 4 .9 4 2.5-1.8 2.5-4 2.5-4-.8-4-2.5\"><\/path><\/svg>Выплаты<\/a>\n<a class=\"nav\" href=\"#\"><svg aria-hidden=\"true\" viewBox=\"0 0 24 24\"><path d=\"M6 3h9l4 4v14H6zM14 3v5h5\"><\/path><\/svg>Документы<\/a>\n<a class=\"nav\" href=\"#\"><svg aria-hidden=\"true\" viewBox=\"0 0 24 24\"><path d=\"M6 17V11a6 6 0 1112 0v6l2 2H4zM10 21h4\"><\/path><\/svg>Уведомления<\/a>\n<div class=\"sidefoot\">Вы видите только свой договор и разрешённую общую статистику. Данные гостей и отдельных отелей недоступны.<\/div>\n<\/aside>\n<main class=\"main\">\n<div class=\"top\">\n<div><h1>Мои инвестиции<\/h1><p>Договор № 000 · начисления по фактически полученной выручке<\/p><\/div>\n<div class=\"tools\"><span class=\"demo\">Демо-данные макета<\/span><button class=\"btn gh\">RU · KG · EN<\/button><button class=\"btn gh\">Тёмная / светлая<\/button><\/div>\n<\/div>\n<section aria-label=\"Заработок\" class=\"grid g4\">\n<div class=\"card kpi cy\"><small>Сегодня<\/small><b>0 000<\/b><em style=\"color:var(--mut)\">KGS<\/em><\/div>\n<div class=\"card kpi\"><small>За неделю<\/small><b>00 000<\/b><em style=\"color:var(--mut)\">KGS<\/em><\/div>\n<div class=\"card kpi\"><small>За месяц<\/small><b>000 000<\/b><em style=\"color:var(--mut)\">KGS<\/em><\/div>\n<div class=\"card kpi gold\"><small>За весь период<\/small><b>0 000 000<\/b><em style=\"color:var(--mut)\">KGS<\/em><\/div>\n<\/section>\n<section class=\"grid g2\" style=\"grid-template-columns:minmax(0,1fr) minmax(0,2fr)\">\n<div class=\"card\">\n<h3>Возврат вклада<\/h3>\n<div style=\"display:flex;gap:20px;align-items:center;flex-wrap:wrap\">\n<div aria-label=\"Возвращено 62 процента\" class=\"ring\" role=\"img\"><b>62%<\/b><\/div>\n<div style=\"flex:1 1 150px;display:flex;flex-direction:column;gap:10px;font-size:13.5px\">\n<div style=\"display:flex;justify-content:space-between\"><span>Вложено<\/span><b>0 000 000<\/b><\/div>\n<div style=\"display:flex;justify-content:space-between\"><span>Возвращено<\/span><b style=\"color:var(--gold)\">0 000 000<\/b><\/div>\n<div style=\"display:flex;justify-content:space-between\"><span>Осталось до возврата<\/span><b>000 000<\/b><\/div>\n<\/div>\n<\/div>\n<div class=\"states\" style=\"margin-top:18px\"><span class=\"st on\">Возврат вклада<\/span><span class=\"arrow\">→<\/span><span class=\"st\">Дополнительные выплаты до дд.мм.гггг<\/span><\/div>\n<\/div>\n<div class=\"card\">\n<h3>Динамика <span aria-label=\"Группировка\" class=\"seg\" role=\"group\"><button>День<\/button><button>Неделя<\/button><button class=\"on\">Месяц<\/button><button>Год<\/button><\/span><\/h3>\n<svg aria-label=\"График: начислено, доступно к выплате, выплачено\" role=\"img\" style=\"display:block\" viewBox=\"0 0 760 230\" width=\"100%\">\n<g stroke=\"rgba(120,205,235,.14)\"><path d=\"M40 20H750M40 75H750M40 130H750M40 185H750\"><\/path><\/g>\n<g fill=\"#a9c6d8\" font-family=\"Inter\" font-size=\"11\"><text x=\"40\" y=\"215\">Янв<\/text><text x=\"150\" y=\"215\">Фев<\/text><text x=\"260\" y=\"215\">Мар<\/text><text x=\"370\" y=\"215\">Апр<\/text><text x=\"480\" y=\"215\">Май<\/text><text x=\"590\" y=\"215\">Июн<\/text><text x=\"700\" y=\"215\">Июл<\/text><\/g>\n<path d=\"M40 170 L150 150 L260 130 L370 108 L480 90 L590 70 L700 50\" fill=\"none\" stroke=\"#00d8ff\" stroke-width=\"3\"><\/path>\n<path d=\"M40 176 L150 160 L260 140 L370 120 L480 104 L590 86 L700 66\" fill=\"none\" stroke=\"#e6bd70\" stroke-width=\"3\"><\/path>\n<path d=\"M40 184 L150 172 L260 156 L $('#close-dialog').addEventListener('click',closeDialog);
$('#dialog').addEventListener('click',e=>{if(e.target.id==='dialog')closeDialog()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#dialog').hidden)closeDialog()});
$('#save-demo').addEventListener('click',()=>{if(!pending)return;const rows=safeStore.get('marina_flex_demo_requests',[]);rows.push({action:pending,from:viewTitles[current],note:$('#demo-note').value.slice(0,250),demo:true,created:new Date().toISOString()});const ok=safeStore.put('marina_flex_demo_requests',rows.slice(-100));closeDialog();toast(ok?'Демо-заявка сохранена локально. Финансовых операций не выполнялось.':'Локальное сохранение недоступно в этом браузере.')});
const controlled=/продлить|разблок|выставить|добавить|запросить|сезонное|отключить|подключить|оплатить|платеж|создать|скачать/i;
window.addEventListener('message',e=>{if(e.source!==V.contentWindow||!e.data||typeof e.data!=='object')return;const {kind,label}=e.data;
 if(kind==='navigate'){switchView(label);return}
 if(kind==='period'){toast('Период «'+label+'» выбран в макете. Показатели пока демонстрационные, пересчёт по API не подключён.');return}
 if(kind==='theme'){toast('Тема в исходном макете не реализована полностью. Задача внесена в план фронтенда.');return}
 if(kind==='section'){openDialog(label,'Раздел указан в существующем дизайне, но отдельный экран или рабочий API к данному прототипу ещё не подключены. Никаких данных отеля, агента или инвестора не запрошено.');return}
 if(kind==='action'&&controlled.test(label)){openDialog('Демо: '+formatAction(label),'Для настоящего действия потребуется проверка роли и прав, договорных условий, подтверждение пользователя, серверная запись и аудит. Сейчас можно сохранить только локальную тестовую заявку.',true);return}
 if(kind==='action'){openDialog('Демо: '+formatAction(label),'Элемент присутствует в исходном макете. Он пока не связан с настоящими учётными записями или финансовыми операциями.');return}
});
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>switchView(b.dataset.view)));
switchView(safeStore.get('marina_flex_demo_last_view','admin'));
</script></body></html>
