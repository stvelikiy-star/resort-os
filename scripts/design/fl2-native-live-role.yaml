# This is an opt-in LIVE QA test, NOT production acceptance.
# Compile a separate native build with EXACT EXPO_PUBLIC_MARINA_TRUSTED_API_ORIGINS.
# Use synthetic MARINA_FINAL_QA staff only. No real accounts.
appId: kg.go.ms.staff
---
- launchApp:
    clearState: true
    clearKeychain: true
# A slow GitHub Android emulator can show an OS-level Pixel Launcher ANR
# over a healthy app. Dismiss ONLY this system dialog; never suppress app errors.
- runFlow:
    when:
      platform: Android
      visible: "Pixel Launcher isn't responding"
    commands:
      - tapOn:
          text: "Wait"
- assertNotVisible:
    text: "Pixel Launcher isn't responding"
- extendedWaitUntil:
    visible:
      id: "login-username"
    timeout: 90000
- tapOn:
    id: "login-username"
# iOS Simulator occasionally loses most characters when Maestro types
# a long synthetic username key-by-key. Clipboard insertion is atomic.
# Fail closed if the actual field differs; never proceed to password.
- runFlow:
    when:
      platform: iOS
    commands:
      - evalScript: ${maestro.copiedText = MAESTRO_QA_USERNAME}
      - pasteText
      - copyTextFrom:
          id: "login-username"
      - assertTrue:
          condition: ${maestro.copiedText === MAESTRO_QA_USERNAME}
          label: "Complete synthetic QA username present before password"
- runFlow:
    when:
      platform: Android
    commands:
      - inputText: ${MAESTRO_QA_USERNAME}
- tapOn:
    id: "login-password"
- inputText: ${MAESTRO_QA_PASSWORD}
- extendedWaitUntil:
    visible:
      id: "login-submit"
    timeout: 60000
- tapOn:
    id: "login-submit"
# iOS shows an OS Password AutoFill offer after an otherwise successful
# login. Dismiss only this system prompt; never dismiss app auth errors.
- runFlow:
    when:
      platform: iOS
    commands:
      - waitForAnimationToEnd
      - runFlow:
          when:
            visible: "Save Password?"
          commands:
            - tapOn: "Not Now"
- extendedWaitUntil:
    visible:
      id: "${MAESTRO_QA_EXPECTED_TAB}"
    timeout: 60000
- assertNotVisible:
    id: "login-error"
