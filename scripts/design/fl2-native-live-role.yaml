# This is an opt-in LIVE QA test, NOT production acceptance.
# Compile a separate native build with EXACT EXPO_PUBLIC_MARINA_TRUSTED_API_ORIGINS.
# Use synthetic MARINA_FINAL_QA staff only. No real accounts.
appId: kg.go.ms.staff
---
- launchApp:
    clearState: true
    clearKeychain: true
# A slow GitHub Android emulator can show an OS-level Pixel Launcher ANR
# over a healthy app. Dismiss ONLY this system dialog; never suppress app errors.
- runFlow:
    when:
      platform: Android
      visible: "Pixel Launcher isn't responding"
    commands:
      - tapOn:
          text: "Wait"
- assertNotVisible:
    text: "Pixel Launcher isn't responding"
- extendedWaitUntil:
    visible:
      id: "login-username"
    timeout: 90000
- tapOn:
    id: "login-username"
# Use supported Maestro setClipboard and pasteText. Retry only the
# username field, then require exact full value before password.
- runFlow:
    when:
      platform: iOS
    commands:
      - retry:
          maxRetries: 2
          commands:
            - tapOn:
                id: "login-username"
            - eraseText
            - setClipboard: ${MAESTRO_QA_USERNAME}
            - pasteText
            - copyTextFrom:
                id: "login-username"
            - assertTrue:
                condition: ${maestro.copiedText === MAESTRO_QA_USERNAME}
                label: "Full synthetic QA username must be present before password"
- runFlow:
    when:
      platform: Android
    commands:
      - inputText: ${MAESTRO_QA_USERNAME}
- tapOn:
    id: "login-password"
- inputText: ${MAESTRO_QA_PASSWORD}
- extendedWaitUntil:
    visible:
      id: "login-submit"
    timeout: 60000
- tapOn:
    id: "login-submit"
# Phase 1: authentication/navigation transition. The native iOS Save Password
# overlay is handled independently in the role-dashboard verification phase.
# Never claim role UI PASS merely because the sign-in screen disappeared.
- extendedWaitUntil:
    notVisible:
      id: "login-username"
    timeout: 60000
- assertNotVisible:
    id: "login-error"
