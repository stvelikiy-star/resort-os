<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>MARINA SMART FLEX | Commercial Control</title>
<link rel="stylesheet" href="/styles.css">
<script src="/app.js" defer></script>
</head>
<body>
<div class="shell">
  <aside class="side">
    <a class="brand" href="/" aria-label="MARINA SMART FLEX"><img class="brand-logo" src="/marina-smart-logo.webp" width="40" height="40" alt="" decoding="async"><span>MARINA<span class="brand-sub">SMART FLEX</span></span></a>
    <div class="side-label" data-i18n="commercial">КОММЕРЧЕСКАЯ ПЛАТФОРМА</div>
    <nav id="nav" aria-label="FLEX navigation"></nav>
    <div class="side-foot"><span class="live-dot"></span><strong data-i18n="qaDemo">Тестовая среда</strong><p class="frozen-badge" data-i18n="frozen">Заморожено</p><p data-i18n="warning">Нет реальных платежей и выплат. Доступ к гостиничной PMS не изменяется.</p></div>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <div class="crumb"><span>MARINA SMART</span><b> / FLEX</b></div>
      <div class="top-actions">
        <span class="badge" data-i18n="qaReadonly">Только чтение</span>
        <label class="accessible-label" for="lang" data-i18n="lang">Язык</label><select id="lang" aria-label="Language"><option value="ru">RU</option><option value="kg">KG</option><option value="en">EN</option></select>
        <button id="theme" type="button" class="icon-button" title="Theme" aria-label="Theme">◐</button>
        <button id="session-button" type="button" class="outline">Войти</button>
      </div>
    </header>
    <main id="content" class="content" aria-live="polite"><div class="skeleton"></div></main>
    <footer><span data-i18n="footerBrand">MARINA SMART FLEX · Коммерческое управление</span><span data-i18n="footerFrozen">Платежи, QR и выплаты отключены</span></footer>
  </div>
</div>
</body>
</html>
