services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: resort_os
      POSTGRES_USER: resort
      POSTGRES_PASSWORD: resort
    ports:
      - "5432:5432"
    volumes:
      - resort_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resort -d resort_os"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  resort_pgdata:
