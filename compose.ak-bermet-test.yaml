name: marina-smart-ak-bermet-test

services:
  postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ak_bermet_marina_test
      POSTGRES_USER: marina_test
      POSTGRES_PASSWORD: "${AKB_TEST_DB_PASSWORD:?set AKB_TEST_DB_PASSWORD}"
    volumes:
      - marina_smart_ak_bermet_test_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marina_test -d ak_bermet_marina_test"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:15434:5432"
    networks: [ak-bermet-test]

  api:
    build:
      context: .
      dockerfile: deploy/ak-bermet-test-api.Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: staging
      MARINA_ALLOW_DEMO_RESET: "false"
      DATABASE_URL: "postgresql://marina_test:${AKB_TEST_DB_PASSWORD}@postgres:5432/ak_bermet_marina_test?schema=public"
      PROPERTY_CODE: AK_BERMET_TEST
      MARINA_PROPERTY_NAME: AK BERMET · MARINA SMART TEST
      RATE_PLAN_CODE: AKB_DIRECT_2026
      CORS_ORIGINS: http://127.0.0.1:13201,http://localhost:13201,http://127.0.0.1:13202,http://localhost:13202
      GUEST_OS_PUBLIC_BASE_URL: http://127.0.0.1:18200
      EXPECTED_GUEST_BASE_URL: http://127.0.0.1:18200
      SERVICE_POINT_PUBLIC_BASE_URL: http://127.0.0.1:18200
      SESSION_TTL_HOURS: "24"
      COOKIE_SECURE: "false"
      REQUIRE_COOKIE_DOMAIN: "false"
      COOKIE_DOMAIN: ""
      REQUIRE_AUTOMATION_SERVICE: "false"
      AUTOMATION_SERVICE_KEY: "${AKB_TEST_AUTOMATION_KEY:?set AKB_TEST_AUTOMATION_KEY}"
      AUTOMATION_SERVICE_NAME: ak-bermet-local-test
      REQUIRE_MIGRATION_HISTORY: "false"
      REQUIRE_RECENT_BACKUP: "false"
      ENABLE_PAYMENT_OPERATIONS: "false"
      ENABLE_SERVICE_POINT_QR: "false"
      ENABLE_MKASSA: "false"
      BOOTSTRAP_OWNER_USERNAME: marina
      BOOTSTRAP_OWNER_PASSWORD: "${AKB_TEST_STAFF_PASSWORD:?set AKB_TEST_STAFF_PASSWORD}"
      BOOTSTRAP_OWNER_DISPLAY_NAME: MARINA SMART Owner
      RECEPTION_USERNAME: admin
      RECEPTION_PASSWORD: "${AKB_TEST_STAFF_PASSWORD}"
      RECEPTION_DISPLAY_NAME: Administrator
      DINING_STAFF_USERNAME: kitchen
      DINING_STAFF_PASSWORD: "${AKB_TEST_STAFF_PASSWORD}"
      DINING_STAFF_DISPLAY_NAME: Kitchen
      MAID_USERNAME: housemaid
      MAID_PASSWORD: "${AKB_TEST_STAFF_PASSWORD}"
      MAID_DISPLAY_NAME: Housemaid
      KITCHEN_USERNAME: kitchen
      KITCHEN_PASSWORD: "${AKB_TEST_STAFF_PASSWORD}"
      WAITER_USERNAME: waiter
      WAITER_PASSWORD: "${AKB_TEST_STAFF_PASSWORD}"
      WAITER_DISPLAY_NAME: Waiter
      TECHNICIAN_USERNAME: technician
      TECHNICIAN_PASSWORD: "${AKB_TEST_STAFF_PASSWORD}"
      TECHNICIAN_DISPLAY_NAME: Technician
      AGENT_USERNAME: agent
      AGENT_PASSWORD: "${AKB_TEST_STAFF_PASSWORD}"
      AGENT_DISPLAY_NAME: Demo Agent
      BOOKING_AGENT_NAME: AK BERMET Demo Agency
      TEST_GUEST_FIXED_PIN: "${AKB_TEST_GUEST_PIN:-306306}"
      TTLOCK_CLIENT_ID: ""
      TTHOTEL_CLIENT_SECRET: ""
      TTHOTEL_ACCOUNT: ""
      TTHOTEL_PASSWORD: ""
      MKASSA_API_KEY: ""
      OPENAI_API_KEY: ""
      TELEGRAM_BOT_TOKEN: ""
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1:18200:8000"
    networks: [ak-bermet-test]

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        CORE_API_URL: http://api:8000
        NEXT_PUBLIC_CORE_WS_URL: ""
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1:13201:3001"
    networks: [ak-bermet-test]

  staff:
    build:
      context: .
      dockerfile: apps/staff/Dockerfile
      args:
        CORE_API_URL: http://api:8000
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1:13202:3002"
    networks: [ak-bermet-test]

networks:
  ak-bermet-test:
    driver: bridge

volumes:
  marina_smart_ak_bermet_test_pgdata:
