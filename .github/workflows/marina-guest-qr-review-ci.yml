name: MARINA QR Guest Review CI

on:
  pull_request:
    paths:
      - 'services/api/app/guest_stay_reviews.py'
      - 'services/api/app/guest_crm.py'
      - 'services/api/app/growth_control.py'
      - 'apps/web/components/GuestStayReview.tsx'
      - 'apps/web/components/GuestConciergeRuntime.tsx'
      - 'apps/web/app/g/**'
      - 'apps/admin/components/GuestCrmEnrichmentPanel.tsx'
      - 'scripts/test_marina_guest_qr_reputation.py'
      - '.github/workflows/marina-guest-qr-review-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qr-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m py_compile services/api/app/guest_stay_reviews.py services/api/app/guest_crm.py services/api/app/growth_control.py
          python scripts/test_marina_guest_qr_reputation.py -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - run: npm run typecheck --prefix apps/web
