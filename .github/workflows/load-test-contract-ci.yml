name: Load Test Contract CI

on:
  pull_request:
    paths:
      - 'tests/load/**'
      - 'scripts/run_load_test.sh'
      - 'docs/LOAD_TESTING.md'
      - '.github/workflows/load-test-contract-ci.yml'
      - '.github/workflows/fulltest-load-baseline-ci.yml'
      - 'scripts/release_rc_truth_guard.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-load-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell runner syntax
        run: bash -n scripts/run_load_test.sh

      - name: Verify production hostname is fail-closed before Docker execution
        run: |
          set +e
          LOAD_TEST_ENV=staging \
          LOAD_BASE_URL=https://3korony.com \
          LOAD_EXPLICIT_TEST_HOST=3korony.com \
          bash scripts/run_load_test.sh >/tmp/load-prod.out 2>&1
          code=$?
          set -e
          test "$code" = "2"
          grep -q 'public production hostname is forbidden' /tmp/load-prod.out

      - name: Verify production hostname cannot be allowlisted
        run: |
          set +e
          LOAD_TEST_ENV=staging \
          LOAD_BASE_URL=https://not-production.example \
          LOAD_EXPLICIT_TEST_HOST=www.3korony.com \
          bash scripts/run_load_test.sh >/tmp/load-prod-allow.out 2>&1
          code=$?
          set -e
          test "$code" = "2"
          grep -q 'public production hostname cannot be allowlisted' /tmp/load-prod-allow.out

      - name: Verify unknown environment is fail-closed
        run: |
          set +e
          LOAD_TEST_ENV=production LOAD_BASE_URL=http://127.0.0.1:8000 bash scripts/run_load_test.sh >/tmp/load-env.out 2>&1
          code=$?
          set -e
          test "$code" = "2"
          grep -q 'LOAD_TEST_ENV must be ci, test, or staging' /tmp/load-env.out

      - name: Pull pinned k6 image with bounded retry
        run: |
          for attempt in 1 2 3; do
            if docker pull grafana/k6:0.54.0; then
              exit 0
            fi
            if test "$attempt" = "3"; then
              echo 'k6 image pull failed after 3 attempts' >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done

      - name: Validate k6 script syntax and options without sending traffic
        run: |
          docker run --rm \
            -v "$PWD/tests/load:/tests/load:ro" \
            grafana/k6:0.54.0 inspect \
            -e LOAD_BASE_URL=http://127.0.0.1:8000 \
            -e LOAD_TEST_ENV=ci \
            /tests/load/resort_core_read.k6.js >/tmp/k6-inspect.txt
          grep -q 'ramping-vus' /tmp/k6-inspect.txt

      - name: Verify mismatched exact external test host is blocked
        run: |
          set +e
          docker run --rm \
            -v "$PWD/tests/load:/tests/load:ro" \
            grafana/k6:0.54.0 inspect \
            -e LOAD_BASE_URL=https://api-production-f1171.up.railway.app \
            -e LOAD_TEST_ENV=test \
            -e LOAD_EXPLICIT_TEST_HOST=another-test.example \
            /tests/load/resort_core_read.k6.js >/tmp/k6-mismatch.out 2>&1
          code=$?
          set -e
          test "$code" != "0"
          grep -q 'exactly match LOAD_EXPLICIT_TEST_HOST' /tmp/k6-mismatch.out

      - name: Verify exact Full Test host can be explicitly authorized without sending traffic
        run: |
          docker run --rm \
            -v "$PWD/tests/load:/tests/load:ro" \
            grafana/k6:0.54.0 inspect \
            -e LOAD_BASE_URL=https://api-production-f1171.up.railway.app \
            -e LOAD_TEST_ENV=test \
            -e LOAD_EXPLICIT_TEST_HOST=api-production-f1171.up.railway.app \
            /tests/load/resort_core_read.k6.js >/tmp/k6-fulltest-inspect.txt
          grep -q 'ramping-vus' /tmp/k6-fulltest-inspect.txt

      - name: Assert non-mutating route surface
        run: |
          ! grep -E '/confirm-payment|/check-in|/check-out|POST.+booking/requests|PATCH|DELETE' tests/load/resort_core_read.k6.js
          grep -q '/ready' tests/load/resort_core_read.k6.js
          grep -q '/api/v1/booking/check-availability' tests/load/resort_core_read.k6.js
          grep -q '/api/v1/pms/grid' tests/load/resort_core_read.k6.js
