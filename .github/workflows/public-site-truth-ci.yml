name: Public Site Truth CI

on:
  pull_request:
    paths:
      - "apps/web/app/**"
      - "apps/web/components/**"
      - "apps/web/lib/**"
      - "apps/web/public/**"
      - "apps/web/middleware.ts"
      - "apps/web/next.config.mjs"
      - "apps/web/postcss.config.mjs"
      - "apps/web/tailwind.config.ts"
      - "apps/web/tsconfig.json"
      - "services/api/app/site_content.py"
      - "services/api/data/site_content_defaults.json"
      - "scripts/public_site_truth_guard.py"
      - "scripts/public_i18n_guard.py"
      - "scripts/external_public_truth_probe.py"
      - "scripts/external_public_truth_probe_test.py"
      - "scripts/owner_guest_facts_guard.py"
      - "scripts/guest_os_truth_guard.py"
      - "scripts/public_media_integrity_guard.py"
  push:
    branches: [main]
    paths:
      - "apps/web/app/**"
      - "apps/web/components/**"
      - "apps/web/lib/**"
      - "apps/web/public/**"
      - "apps/web/middleware.ts"
      - "apps/web/next.config.mjs"
      - "apps/web/postcss.config.mjs"
      - "apps/web/tailwind.config.ts"
      - "apps/web/tsconfig.json"
      - "services/api/app/site_content.py"
      - "services/api/data/site_content_defaults.json"
      - "scripts/public_site_truth_guard.py"
      - "scripts/public_i18n_guard.py"
      - "scripts/external_public_truth_probe.py"
      - "scripts/external_public_truth_probe_test.py"
      - "scripts/owner_guest_facts_guard.py"
      - "scripts/guest_os_truth_guard.py"
      - "scripts/public_media_integrity_guard.py"

permissions:
  contents: read

jobs:
  public-truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enforce canonical public sales boundary
        if: ${{ github.event_name != 'pull_request' || !(startsWith(github.head_ref, 'marina-smart/') || startsWith(github.head_ref, 'railway/marina-') || startsWith(github.head_ref, 'fix/marina-smart-') || startsWith(github.head_ref, 'fix/marina-staging-')) }}
        run: python3 scripts/public_site_truth_guard.py
      - name: Enforce owner-approved guest service facts
        if: ${{ github.event_name != 'pull_request' || !(startsWith(github.head_ref, 'marina-smart/') || startsWith(github.head_ref, 'railway/marina-') || startsWith(github.head_ref, 'fix/marina-smart-') || startsWith(github.head_ref, 'fix/marina-staging-')) }}
        run: python3 scripts/owner_guest_facts_guard.py
      - name: Enforce implemented Guest OS request truth
        run: python3 scripts/guest_os_truth_guard.py

      - name: Verify MARINA SMART guest-web isolation
        if: ${{ github.event_name == 'pull_request' && (startsWith(github.head_ref, 'marina-smart/') || startsWith(github.head_ref, 'railway/marina-') || startsWith(github.head_ref, 'fix/marina-smart-') || startsWith(github.head_ref, 'fix/marina-staging-')) }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          public_page = Path("apps/web/app/page.tsx").read_text(encoding="utf-8")
          layout = Path("apps/web/app/layout.tsx").read_text(encoding="utf-8")
          guest_page = Path("apps/web/app/guest/page.tsx").read_text(encoding="utf-8")
          guest_landing = Path("apps/web/components/GuestLanding.tsx").read_text(encoding="utf-8")
          public_runtime = Path("apps/web/components/PublicSiteRuntime.tsx").read_text(encoding="utf-8")
          assert "Три Короны" in public_page and "3korony.com" in public_page
          assert "3korony.com" in layout
          joined_guest = guest_page + "\n" + guest_landing
          assert "AK BERMET" in joined_guest and "MARINA SMART" in joined_guest
          for forbidden in ("Три Короны", "Three Crowns", "3korony.com"):
              assert forbidden not in joined_guest, forbidden
          assert 'pathname === "/guest"' in public_runtime
          assert 'pathname.startsWith("/g/")' in public_runtime
          assert 'pathname.startsWith("/p/")' in public_runtime
          print("PASS: Three Crowns public root and isolated MARINA guest/QR route ownership")
          PY
      - name: Enforce public media integrity
        if: ${{ github.event_name != 'pull_request' || !(startsWith(github.head_ref, 'marina-smart/') || startsWith(github.head_ref, 'railway/marina-') || startsWith(github.head_ref, 'fix/marina-smart-') || startsWith(github.head_ref, 'fix/marina-staging-')) }}
        run: python3 scripts/public_media_integrity_guard.py
      - name: Test external rendered-site truth probe
        if: ${{ github.event_name != 'pull_request' || !(startsWith(github.head_ref, 'marina-smart/') || startsWith(github.head_ref, 'railway/marina-') || startsWith(github.head_ref, 'fix/marina-smart-') || startsWith(github.head_ref, 'fix/marina-staging-')) }}
        run: python3 scripts/external_public_truth_probe_test.py
      - name: Enforce RU KG KZ EN public locale contract
        if: ${{ github.event_name != 'pull_request' || !(startsWith(github.head_ref, 'marina-smart/') || startsWith(github.head_ref, 'railway/marina-') || startsWith(github.head_ref, 'fix/marina-smart-') || startsWith(github.head_ref, 'fix/marina-staging-')) }}
        run: python3 scripts/public_i18n_guard.py
