name: Public Site Truth CI

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "scripts/public_site_truth_guard.py"
      - "scripts/public_i18n_guard.py"
      - ".github/workflows/public-site-truth-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "scripts/public_site_truth_guard.py"
      - "scripts/public_i18n_guard.py"
      - ".github/workflows/public-site-truth-ci.yml"

permissions:
  contents: read

jobs:
  public-truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enforce canonical public sales boundary
        run: python3 scripts/public_site_truth_guard.py
      - name: Enforce RU KG EN public locale contract
        run: python3 scripts/public_i18n_guard.py
