name: Owner Growth Control CI

on:
  pull_request:
    paths:
      - 'services/api/app/growth_control.py'
      - 'services/api/app/app_entry.py'
      - 'packages/database/prisma/schema.prisma'
      - 'packages/database/prisma/migrations/4_guest_engagements/**'
      - 'packages/database/prisma/migrations/5_my_stay/**'
      - 'packages/database/prisma/migrations/6_public_access/**'
      - 'apps/admin/components/GrowthControlBoard.tsx'
      - 'apps/admin/components/AdminShell.tsx'
      - 'apps/admin/app/growth-control.css'
      - 'apps/admin/app/layout.tsx'
      - 'scripts/verify_owner_growth_control.py'
      - '.github/workflows/owner-growth-control-ci.yml'
  push:
    branches: [main]
    paths:
      - 'services/api/app/growth_control.py'
      - 'services/api/app/app_entry.py'
      - 'packages/database/prisma/schema.prisma'
      - 'packages/database/prisma/migrations/4_guest_engagements/**'
      - 'packages/database/prisma/migrations/5_my_stay/**'
      - 'packages/database/prisma/migrations/6_public_access/**'
      - 'apps/admin/components/GrowthControlBoard.tsx'
      - 'apps/admin/components/AdminShell.tsx'
      - 'apps/admin/app/growth-control.css'
      - 'apps/admin/app/layout.tsx'
      - 'scripts/verify_owner_growth_control.py'
      - '.github/workflows/owner-growth-control-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owner-growth-control:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: resort_os
          POSTGRES_USER: resort
          POSTGRES_PASSWORD: resort
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resort -d resort_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://resort:resort@localhost:5432/resort_os?schema=public
      PROPERTY_CODE: THREE_CROWNS
      RATE_PLAN_CODE: DIRECT_2026_27
      COOKIE_SECURE: false
      BOOTSTRAP_OWNER_USERNAME: ci-owner
      BOOTSTRAP_OWNER_PASSWORD: CI-Owner-Strong-Password-2026
      BOOTSTRAP_OWNER_DISPLAY_NAME: CI Owner

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate current database migration chain
        working-directory: packages/database
        run: |
          npm install --no-audit --no-fund
          npx prisma validate
          npx prisma migrate deploy
          npx prisma migrate status
          test -s prisma/migrations/4_guest_engagements/migration.sql
          test -s prisma/migrations/5_my_stay/migration.sql
          test -s prisma/migrations/6_public_access/migration.sql

      - name: Verify Growth persistence invariants
        env:
          PGPASSWORD: resort
        run: |
          migration_count="$(psql -h 127.0.0.1 -U resort -d resort_os -Atc "select count(*) from _prisma_migrations where finished_at is not null and rolled_back_at is null")"
          migration_names="$(psql -h 127.0.0.1 -U resort -d resort_os -Atc "select string_agg(migration_name,',' order by started_at) from _prisma_migrations where finished_at is not null and rolled_back_at is null")"
          table_name="$(psql -h 127.0.0.1 -U resort -d resort_os -Atc "select to_regclass('public.guest_engagements')::text")"
          constraint_count="$(psql -h 127.0.0.1 -U resort -d resort_os -Atc "select count(*) from pg_constraint where conname in ('guest_engagements_property_fkey','guest_engagements_guest_fkey','guest_engagements_reservation_fkey','guest_engagements_kind_check','guest_engagements_status_check','guest_engagements_score_check','guest_engagements_score_kind_check','guest_engagements_feedback_reservation_check')")"
          feedback_unique="$(psql -h 127.0.0.1 -U resort -d resort_os -Atc "select count(*) from pg_indexes where schemaname='public' and tablename='guest_engagements' and indexname='guest_engagements_feedback_reservation_key'")"
          test "$migration_count" = '7'
          test "$migration_names" = '0_init,1_site_content,2_guest_service_tasks,3_owner_analytics_snapshots,4_guest_engagements,5_my_stay,6_public_access'
          test "$table_name" = 'guest_engagements'
          test "$constraint_count" = '8'
          test "$feedback_unique" = '1'

      - name: Typecheck and build Growth admin UI
        working-directory: apps/admin
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: services/api/requirements.txt

      - name: Install and compile Core
        run: |
          pip install -r services/api/requirements.txt
          python -m compileall services/api/app scripts/verify_owner_growth_control.py

      - name: Seed Three Crowns and bootstrap OWNER
        run: |
          python scripts/seed_from_intake.py
          python scripts/bootstrap_owner.py

      - name: Start Resort Core
        run: |
          python -m uvicorn app.app_entry:app --app-dir services/api --host 127.0.0.1 --port 8000 > /tmp/owner-growth-api.log 2>&1 &
          for i in {1..30}; do
            curl --fail -sS http://127.0.0.1:8000/health/ready >/tmp/ready.json 2>/dev/null && break
            if [ "$i" = "30" ]; then cat /tmp/owner-growth-api.log; exit 1; fi
            sleep 1
          done

      - name: Run Owner Growth Control E2E
        run: python scripts/verify_owner_growth_control.py

      - name: Show Core logs on failure
        if: failure()
        run: cat /tmp/owner-growth-api.log || true
