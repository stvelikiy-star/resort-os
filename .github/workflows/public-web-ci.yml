name: Public Web CI

on:
  push:
    branches: [feat/public-site-action-pass]
    paths:
      - 'apps/web/**'
      - '.github/workflows/public-web-ci.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/public-web-ci.yml'

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: Build
        working-directory: apps/web
        run: npm run build
      - name: Assert action homepage contract
        run: |
          grep -q 'ActionRuntime' apps/web/app/page.tsx
          grep -q 'action-room-rail' apps/web/app/page.tsx
          grep -q 'prefers-reduced-motion' apps/web/app/action-v3.css
