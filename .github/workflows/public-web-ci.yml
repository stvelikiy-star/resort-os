name: Public Web CI

on:
  workflow_dispatch:
  push:
    branches: [main, feat/public-site-action-pass]
    paths:
      - 'apps/web/**'
      - 'scripts/public_site_truth_guard.py'
      - '.github/workflows/public-web-ci.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'scripts/public_site_truth_guard.py'
      - '.github/workflows/public-web-ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Assert exact public-web toolchain pins
        run: |
          node - <<'NODE'
          const p=require('./apps/web/package.json');
          const expected={
            next:'15.5.24',
            react:'19.2.8',
            'react-dom':'19.2.8',
            typescript:'5.7.2',
          };
          const actual={...p.dependencies,...p.devDependencies};
          for (const [name,version] of Object.entries(expected)) {
            if (actual[name] !== version) {
              console.error(`unexpected ${name}: ${actual[name]} (expected ${version})`);
              process.exit(1);
            }
          }
          NODE

      - name: Install current pinned web dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck

      - name: Build
        working-directory: apps/web
        run: npm run build

      - name: Enforce canonical public truth
        run: python3 scripts/public_site_truth_guard.py

      - name: Assert action homepage contract
        run: |
          grep -q 'ActionRuntime' apps/web/app/page.tsx
          grep -q 'action-room-rail' apps/web/app/page.tsx
          grep -q 'prefers-reduced-motion' apps/web/app/action-v3.css
          grep -Fq '.action-room-card:hover{transform:none}' apps/web/app/action-motion.css
          grep -Fq '.action-room-card:hover .action-room-card-link b{transform:none}' apps/web/app/action-motion.css
          grep -Fq 'Пирс длиной 150 метров' apps/web/app/page.tsx
          grep -Fq 'Открытый бассейн 15×8 м' apps/web/app/page.tsx
          grep -Fq 'Номер автоматически не блокируется' apps/web/app/page.tsx
          grep -Fq '/core/api/v1/booking/check-availability' apps/web/components/BookingWidget.tsx
          grep -Fq '/core/api/v1/booking/requests' apps/web/components/BookingWidget.tsx
