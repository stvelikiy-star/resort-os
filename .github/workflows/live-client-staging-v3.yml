name: Live Client Staging V3

on:
  push:
    branches: [ops/live-client-staging]
    paths:
      - 'scripts/live_client_staging_v3.sh'
      - '.github/workflows/live-client-staging-v3.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: live-client-staging-v3
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: resort_os
          POSTGRES_USER: resort
          POSTGRES_PASSWORD: resort
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resort -d resort_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: development
      DATABASE_URL: postgresql://resort:resort@localhost:5432/resort_os?schema=public
      PROPERTY_CODE: THREE_CROWNS
      RATE_PLAN_CODE: DIRECT_2026_27
      CORE_API_URL: http://127.0.0.1:8000
      COOKIE_SECURE: false
      BOOTSTRAP_OWNER_USERNAME: client-demo
      BOOTSTRAP_OWNER_PASSWORD: ThreeCrownsDemo!2026
      BOOTSTRAP_OWNER_DISPLAY_NAME: Three Crowns Demo Owner
      DEMO_OWNER_USERNAME: client-demo
      DEMO_OWNER_PASSWORD: ThreeCrownsDemo!2026
      DEMO_SHOWCASE_OUTPUT: /tmp/three-crowns-demo-showcase.json
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - name: Launch connected Three Crowns staging
        run: bash scripts/live_client_staging_v3.sh
      - name: Diagnostics on failure
        if: failure()
        run: |
          echo '=== CORE ==='; tail -200 /tmp/resort-api.log || true
          echo '=== WEB ==='; tail -200 /tmp/web.log || true
          echo '=== ADMIN ==='; tail -200 /tmp/admin.log || true
          echo '=== STAFF ==='; tail -200 /tmp/staff.log || true
          echo '=== TUNNELS ==='; cat /tmp/tunnel-*.log || true
