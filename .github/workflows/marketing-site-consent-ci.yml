name: Marketing Site Consent CI

on:
  pull_request:
    branches:
      - feat/three-crowns-marketing
    paths:
      - 'apps/web/**'
      - '.github/workflows/marketing-site-consent-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-consent:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build public site
        run: npm run build
      - name: Verify consent contract is explicit and optional
        run: |
          grep -q 'marketing_opt_in: marketingOptIn' components/BookingWidget.tsx
          grep -q 'marketing_channels: marketingOptIn ? \["WHATSAPP"\] : \[\]' components/BookingWidget.tsx
          grep -q 'type="checkbox"' components/BookingWidget.tsx
          grep -q 'href="/privacy"' components/BookingWidget.tsx
          grep -q 'href="/marketing-consent"' components/BookingWidget.tsx
          test -f app/privacy/page.tsx
          test -f app/marketing-consent/page.tsx
