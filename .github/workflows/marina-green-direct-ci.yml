name: MARINA Direct WhatsApp Adapter CI

on:
  pull_request:
    paths:
      - 'scripts/marina_green_poll.py'
      - 'scripts/marina_green_poll_test.py'
      - 'deploy/marina-fleet-api.Dockerfile'
      - '.github/workflows/marina-green-direct-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  green-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'httpx==0.28.1'
      - name: Compile direct adapter and run synthetic offline tests
        run: |
          python -m py_compile scripts/marina_green_poll.py scripts/marina_green_poll_test.py
          python scripts/marina_green_poll_test.py -v
