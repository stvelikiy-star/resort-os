name: MARINA zz113 Isolated Rollback Rehearsal

on:
  pull_request:
    paths:
      - 'release/marina-smart-current-candidate.json'
      - '.github/workflows/marina-zz113-rollback-ci.yml'
      - 'packages/database/prisma/migrations/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: marina_before
          POSTGRES_USER: marina_ci
          POSTGRES_PASSWORD: marina_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marina_ci -d marina_before"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: marina_ci_only
      DATABASE_URL: postgresql://marina_ci:marina_ci_only@localhost:5432/marina_before?schema=public
    steps:
      - uses: actions/checkout@v4
      - name: Select PostgreSQL 16 clients for the PostgreSQL 16 restore target
        shell: bash
        run: |
          set -euo pipefail
          if ! test -x /usr/lib/postgresql/16/bin/pg_dump; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client-16
          fi
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
          /usr/lib/postgresql/16/bin/pg_dump --version | grep -E ' 16\.'
          /usr/lib/postgresql/16/bin/pg_restore --version | grep -E ' 16\.'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install committed database tooling
        working-directory: packages/database
        run: npm ci --no-audit --no-fund
      - name: Restore original pre-zz113 migration boundary
        shell: bash
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/marina-prisma-before"
          mkdir -p "$baseline"
          cp -a packages/database/prisma/. "$baseline/"
          # Reconstruct the exact historical pre-zz113 boundary, not every
          # later migration carried by the current integration checkout.
          rm -rf "$baseline/migrations/zz113_marina_housekeeping_schedule_date_20261027"
          rm -rf "$baseline/migrations/zz114_marina_60minute_holds_20261029"
          rm -rf "$baseline/migrations/zz115_marina_chef_production_targets_20261110"
          rm -rf "$baseline/migrations/zz116_marina_kitchen_recipes_20261111"
          rm -rf "$baseline/migrations/zz117_marina_kitchen_stock_20261111"
          rm -rf "$baseline/migrations/zz118_marina_kitchen_waste_spoilage_20261115"
          rm -rf "$baseline/migrations/zz119_marina_kitchen_procurement_20261115"
          rm -rf "$baseline/migrations/zz120_marina_owner_expenses_20261115"
          rm -rf "$baseline/migrations/zz121_marina_supplier_documents_20261116"
          rm -rf "$baseline/migrations/zz122_marina_supplier_returns_20261116"
          rm -rf "$baseline/migrations/zz123_marina_owner_revenue_source_events_20261116"
          rm -rf "$baseline/migrations/zz124_marina_owner_revenue_corrections_20261116"
          rm -rf "$baseline/migrations/zz125_marina_owner_revenue_evidence_bytes_20261116"
          rm -rf "$baseline/migrations/zz126_marina_owner_accounting_journal_proposals_20261116"
          rm -rf "$baseline/migrations/zz127_marina_served_batch_allocation_20261124"
          rm -rf "$baseline/migrations/zz128_marina_owner_accounting_decision_evidence_20261124"
          rm -rf "$baseline/migrations/zz129_marina_owner_accounting_postings_20261125"
          rm -rf "$baseline/migrations/zz130_marina_owner_revenue_accounting_certification_20261125"
          rm -rf "$baseline/migrations/zz131_marina_owner_source_reversal_integrity_20261125"
          rm -rf "$baseline/migrations/zz132_marina_owner_revenue_period_integrity_20261125"
          rm -rf "$baseline/migrations/zz133_marina_owner_guest_service_revenue_20261125"
          rm -rf "$baseline/migrations/zz134_marina_owner_guest_service_posting_lifecycle_20261125"
          rm -rf "$baseline/migrations/zz135_marina_owner_certified_tax_correction_20261125"
          rm -rf "$baseline/migrations/zz136_marina_owner_certified_revenue_reductions_20261125"
          rm -rf "$baseline/migrations/zz137_marina_owner_certified_refund_cash_evidence_20261125"
          rm -rf "$baseline/migrations/zz138_marina_owner_full_cancellation_certificate_20261125"
          rm -rf "$baseline/migrations/zz139_marina_partial_refund_evidence_foundation_20261125"
          (cd packages/database && npx prisma migrate deploy --schema "$baseline/schema.prisma")
          test "$(psql -h 127.0.0.1 -U marina_ci -d marina_before -Atc "select count(*) from _prisma_migrations where finished_at is not null and rolled_back_at is null")" = 37
          test "$(psql -h 127.0.0.1 -U marina_ci -d marina_before -Atc "select count(*) from information_schema.columns where table_name='operational_tasks' and column_name='scheduledFor'")" = 0
          pg_dump -h 127.0.0.1 -U marina_ci -d marina_before -Fc -f "$RUNNER_TEMP/pre-zz113.dump"
          pg_restore --list "$RUNNER_TEMP/pre-zz113.dump" >/dev/null
      - name: Simulate migration and fail-close recovery on disposable databases
        shell: bash
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U marina_ci -d marina_before -v ON_ERROR_STOP=1 -1 -f packages/database/prisma/migrations/zz113_marina_housekeeping_schedule_date_20261027/migration.sql
          test "$(psql -h 127.0.0.1 -U marina_ci -d marina_before -Atc "select count(*) from information_schema.columns where table_name='operational_tasks' and column_name='scheduledFor'")" = 1
          psql -h 127.0.0.1 -U marina_ci -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE marina_rollback;'
          pg_restore -h 127.0.0.1 -U marina_ci -d marina_rollback --no-owner --no-acl --exit-on-error "$RUNNER_TEMP/pre-zz113.dump"
          test "$(psql -h 127.0.0.1 -U marina_ci -d marina_rollback -Atc "select count(*) from information_schema.columns where table_name='operational_tasks' and column_name='scheduledFor'")" = 0
          test "$(psql -h 127.0.0.1 -U marina_ci -d marina_rollback -Atc "select count(*) from _prisma_migrations where finished_at is not null and rolled_back_at is null")" = 37
          test "$(psql -h 127.0.0.1 -U marina_ci -d marina_rollback -Atc "select count(*) from pg_constraint where conname='operational_tasks_service_context_type_check'")" = 1
          echo 'MARINA_ZZ113_DISPOSABLE_DB_ROLLBACK_PASS'
