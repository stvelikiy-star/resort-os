name: Guest OS Core CI

on:
  pull_request:
    paths:
      - 'services/api/app/stays.py'
      - 'services/api/app/pms_chessboard.py'
      - 'services/api/app/app_entry.py'
      - 'packages/database/prisma/schema.prisma'
      - 'packages/database/prisma/migrations/5_guest_os_core/**'
      - 'scripts/verify_guest_os_core.py'
      - '.github/workflows/guest-os-core-ci.yml'
  push:
    branches: [main]
    paths:
      - 'services/api/app/stays.py'
      - 'services/api/app/pms_chessboard.py'
      - 'services/api/app/app_entry.py'
      - 'packages/database/prisma/schema.prisma'
      - 'packages/database/prisma/migrations/5_guest_os_core/**'
      - 'scripts/verify_guest_os_core.py'
      - '.github/workflows/guest-os-core-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guest-os-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: resort_os
          POSTGRES_USER: resort
          POSTGRES_PASSWORD: resort
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resort -d resort_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://resort:resort@localhost:5432/resort_os?schema=public
      PROPERTY_CODE: THREE_CROWNS
      RATE_PLAN_CODE: DIRECT_2026_27
      COOKIE_SECURE: 'false'
      BOOTSTRAP_OWNER_USERNAME: guest-os-ci-owner
      BOOTSTRAP_OWNER_PASSWORD: Guest-OS-CI-Owner-Password-2026
      BOOTSTRAP_OWNER_DISPLAY_NAME: Guest OS CI Owner

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate and apply Guest OS migration chain
        working-directory: packages/database
        run: |
          npm install --no-audit --no-fund
          npx prisma validate
          test -s prisma/migrations/5_guest_os_core/migration.sql
          npx prisma migrate deploy
          npx prisma migrate status

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/requirements.txt

      - name: Install and compile Core
        run: |
          pip install -r services/api/requirements.txt
          python -m compileall services/api/app scripts/verify_guest_os_core.py

      - name: Seed canonical hotel and bootstrap owner
        run: |
          python scripts/seed_from_intake.py
          python scripts/bootstrap_owner.py

      - name: Start Resort Core
        run: |
          python -m uvicorn app.app_entry:app --app-dir services/api --host 127.0.0.1 --port 8000 > /tmp/guest-os-core-api.log 2>&1 &
          for i in {1..30}; do
            curl --fail -sS http://127.0.0.1:8000/health/ready >/tmp/ready.json 2>/dev/null && break
            if [ "$i" = "30" ]; then cat /tmp/guest-os-core-api.log; exit 1; fi
            sleep 1
          done

      - name: Run Guest OS stay lifecycle E2E
        run: python scripts/verify_guest_os_core.py

      - name: Show Core logs on failure
        if: failure()
        run: cat /tmp/guest-os-core-api.log || true
