name: MARINA Mobile Expo Patch Alignment One Shot
on:
  push:
    branches:
      - 'fix/marina-mobile-expo-security-deps-20261103'
    paths:
      - '.github/workflows/marina-mobile-expo-patch-align.yml'
permissions:
  contents: read
jobs:
  align-expo-patches:
    name: Align and validate Expo SDK 58 patch versions on mobile-only branch
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - name: Start from immutable current lockfile
        run: npm ci --no-audit --no-fund
      - name: Align SDK 58 patches using official Expo resolver
        env:
          CI: '1'
        run: |
          npx expo install --fix
          npx expo install --check
      - name: Restrict package changes to seven confirmed patch families
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const cp=require('node:child_process');
          const before=JSON.parse(cp.execFileSync('git',['show','HEAD:apps/mobile/package.json'],{encoding:'utf8'}));
          const after=JSON.parse(fs.readFileSync('package.json','utf8'));
          const allow=new Set(['@expo/metro-runtime','expo','expo-constants','expo-linking','expo-router','react-native-safe-area-context','jest-expo']);
          for (const kind of ['dependencies','devDependencies']) {
            const a=before[kind]||{},b=after[kind]||{};
            for(const name of new Set([...Object.keys(a),...Object.keys(b)])) {
              if(a[name]!==b[name] && !allow.has(name))throw Error('Unexpected version update: '+kind+':'+name+' '+a[name]+' -> '+b[name]);
              if(a[name]!==b[name] && !/^(~|\^)\d+\.\d+\.\d+$/.test(b[name]))throw Error('Unpinned version: '+name);
            }
          }
          if(JSON.stringify(before.overrides)!==JSON.stringify(after.overrides))throw Error('Security overrides unexpectedly changed');
          if(before.dependencies.react!==after.dependencies.react || before.dependencies['react-native']!==after.dependencies['react-native'])throw Error('React/RN base changed');
          console.log('EXPO_SDK_PATCH_DIFF_VALIDATED');
          NODE
      - name: Verify all mobile contracts and generated code
        run: |
          node scripts/verify-backend-contract.mjs
          node --test scripts/audit-provenance.test.mjs
          npm run typecheck
          npm run lint
          npm test -- --ci --runInBand
          npm run web:export
      - name: Commit only validated mobile lockfile and package manifest
        run: |
          set -euo pipefail
          git diff --stat -- package.json package-lock.json
          if git diff --quiet -- package.json package-lock.json; then
            echo 'No Expo patch alignment needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'chore(mobile): align Expo SDK 58 patch versions after compatibility tests'
          git push origin HEAD:"${GITHUB_REF_NAME}"
