name: Production Migration Baseline CI

on:
  pull_request:
    paths:
      - 'packages/database/prisma/schema.prisma'
      - 'packages/database/prisma/migrations/**'
      - 'packages/database/sql/**'
      - 'scripts/generate_migration_baseline.sh'
      - 'scripts/seed_from_intake.py'
      - 'scripts/production_preflight.py'
      - 'scripts/release_contract.py'
      - 'scripts/release_contract_test.py'
      - '.github/workflows/migration-baseline-ci.yml'
  push:
    branches: [main]
    paths:
      - 'packages/database/prisma/schema.prisma'
      - 'packages/database/sql/**'
      - 'packages/database/prisma/migrations/**'
      - 'scripts/generate_migration_baseline.sh'
      - 'scripts/seed_from_intake.py'
      - 'scripts/production_preflight.py'
      - 'scripts/release_contract.py'
      - 'scripts/release_contract_test.py'
      - '.github/workflows/migration-baseline-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: resort_os_migration_test
          POSTGRES_USER: resort
          POSTGRES_PASSWORD: resort
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resort -d resort_os_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://resort:resort@localhost:5432/resort_os_migration_test?schema=public
      PROPERTY_CODE: THREE_CROWNS
      RATE_PLAN_CODE: DIRECT_2026_27

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prove baseline generator refuses production mode
        run: |
          if APP_ENV=production bash scripts/generate_migration_baseline.sh >/tmp/generator-prod.out 2>/tmp/generator-prod.err; then
            echo 'ERROR: baseline generator unexpectedly ran in production mode' >&2
            exit 1
          fi
          grep -q 'baseline generation is disabled' /tmp/generator-prod.err

      - name: Prepare baseline candidate or validate committed baseline inputs
        run: |
          if test -s packages/database/prisma/migrations/0_init/migration.sql; then
            echo 'Using committed 0_init baseline plus forward migrations.'
            cd packages/database
            npm install --no-audit --no-fund
            npx prisma format
            npx prisma validate
          else
            echo 'Generating 0_init baseline candidate.'
            bash scripts/generate_migration_baseline.sh
          fi

      - name: Verify baseline and forward migrations
        run: |
          test -s packages/database/prisma/migrations/0_init/migration.sql
          test -s packages/database/prisma/migrations/0_init/migration.sql.sha256
          test -s packages/database/prisma/migrations/1_site_content/migration.sql
          test -s packages/database/prisma/migrations/2_guest_service_tasks/migration.sql
          test -s packages/database/prisma/migrations/3_owner_analytics_snapshots/migration.sql
          test -s packages/database/prisma/migrations/4_guest_engagements/migration.sql
          test -s packages/database/prisma/migrations/5_guest_os_core/migration.sql
          test -s packages/database/prisma/migrations/6_service_point_qr_operations/migration.sql
          grep -q 'no_overlapping_active_room_blocks' packages/database/prisma/migrations/0_init/migration.sql
          grep -q 'reservation_nonnegative_total' packages/database/prisma/migrations/0_init/migration.sql
          grep -q 'inventory_block_valid_dates' packages/database/prisma/migrations/0_init/migration.sql
          grep -q 'payment_positive_amount' packages/database/prisma/migrations/0_init/migration.sql
          grep -q 'payment_has_context' packages/database/prisma/migrations/0_init/migration.sql
          grep -q 'site_content_documents' packages/database/prisma/migrations/1_site_content/migration.sql
          grep -q 'reservationId' packages/database/prisma/migrations/2_guest_service_tasks/migration.sql
          grep -q 'serviceCode' packages/database/prisma/migrations/2_guest_service_tasks/migration.sql
          grep -q 'operational_tasks_service_context_type_check' packages/database/prisma/migrations/2_guest_service_tasks/migration.sql
          grep -q 'owner_analytics_snapshots' packages/database/prisma/migrations/3_owner_analytics_snapshots/migration.sql
          grep -q 'owner_analytics_snapshots_horizon_check' packages/database/prisma/migrations/3_owner_analytics_snapshots/migration.sql
          grep -q 'owner_analytics_snapshots_payload_object_check' packages/database/prisma/migrations/3_owner_analytics_snapshots/migration.sql
          grep -q 'owner_analytics_snapshots_property_date_key' packages/database/prisma/migrations/3_owner_analytics_snapshots/migration.sql
          grep -q 'guest_engagements' packages/database/prisma/migrations/4_guest_engagements/migration.sql
          grep -q 'guest_engagements_kind_check' packages/database/prisma/migrations/4_guest_engagements/migration.sql
          grep -q 'guest_engagements_status_check' packages/database/prisma/migrations/4_guest_engagements/migration.sql
          grep -q 'guest_engagements_score_check' packages/database/prisma/migrations/4_guest_engagements/migration.sql
          grep -q 'guest_engagements_feedback_reservation_key' packages/database/prisma/migrations/4_guest_engagements/migration.sql
          grep -q 'CREATE TABLE "stays"' packages/database/prisma/migrations/5_guest_os_core/migration.sql
          grep -q 'CREATE TABLE "room_assignments"' packages/database/prisma/migrations/5_guest_os_core/migration.sql
          grep -q 'CREATE TABLE "room_qrs"' packages/database/prisma/migrations/5_guest_os_core/migration.sql
          grep -q 'CREATE TABLE "guest_sessions"' packages/database/prisma/migrations/5_guest_os_core/migration.sql
          grep -q 'guestAccessPinHash' packages/database/prisma/migrations/5_guest_os_core/migration.sql
          grep -q 'operational_tasks_stayId_fkey' packages/database/prisma/migrations/5_guest_os_core/migration.sql
          grep -q 'CREATE TABLE "service_points"' packages/database/prisma/migrations/6_service_point_qr_operations/migration.sql
          grep -q 'CREATE TABLE "service_point_request_options"' packages/database/prisma/migrations/6_service_point_qr_operations/migration.sql
          grep -q 'CREATE TABLE "service_point_qrs"' packages/database/prisma/migrations/6_service_point_qr_operations/migration.sql
          grep -q 'service_point_qrs_one_active_per_point' packages/database/prisma/migrations/6_service_point_qr_operations/migration.sql
          grep -q 'operational_tasks_servicePointId_fkey' packages/database/prisma/migrations/6_service_point_qr_operations/migration.sql
          grep -q 'service_points_category_check' packages/database/prisma/migrations/6_service_point_qr_operations/migration.sql
          grep -q 'service_point_qrs_revocation_check' packages/database/prisma/migrations/6_service_point_qr_operations/migration.sql
          grep -q 'operational_tasks_service_point_context_check' packages/database/prisma/migrations/6_service_point_qr_operations/migration.sql
          cd packages/database/prisma/migrations/0_init
          sha256sum -c migration.sql.sha256

      - name: Apply migration chain to clean PostgreSQL with Prisma migration history
        working-directory: packages/database
        run: |
          npx prisma migrate deploy
          npx prisma migrate status

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: services/api/requirements.txt

      - name: Install API dependencies
        run: pip install -r services/api/requirements.txt

      - name: Verify shared release contract unit invariants
        run: python scripts/release_contract_test.py

      - name: Seed canonical Three Crowns development intake
        run: python scripts/seed_from_intake.py

      - name: Verify migration history and production database invariants
        env:
          APP_ENV: production
          COOKIE_SECURE: 'true'
          REQUIRE_RECENT_BACKUP: 'false'
          CORS_ORIGINS: https://release-check.3korony.invalid
          AUTOMATION_SERVICE_KEY: resort-core-automation-release-validation-key-00000001
          EXPECTED_ROOM_COUNT: '84'
          EXPECTED_ROOM_TYPE_COUNT: '12'
        run: |
          python scripts/production_preflight.py | tee /tmp/production-preflight.txt
          grep -q '^FACT: migration_history_present=True$' /tmp/production-preflight.txt
          grep -q '^FACT: applied_migrations=7$' /tmp/production-preflight.txt
          grep -q "^FACT: migration_names=\['0_init', '1_site_content', '2_guest_service_tasks', '3_owner_analytics_snapshots', '4_guest_engagements', '5_guest_os_core', '6_service_point_qr_operations'\]$" /tmp/production-preflight.txt
          grep -q '^FACT: critical_constraint_count=27$' /tmp/production-preflight.txt
          grep -q '^FACT: rooms=84$' /tmp/production-preflight.txt
          grep -q '^FACT: room_types=12$' /tmp/production-preflight.txt
          grep -q '^FACT: distinct_room_codes=84$' /tmp/production-preflight.txt
          grep -q '^RESULT: READY FOR NEXT DEPLOYMENT GATE$' /tmp/production-preflight.txt

      - name: Verify database migration ledger directly
        env:
          PGPASSWORD: resort
        run: |
          migration_count="$(psql -h 127.0.0.1 -U resort -d resort_os_migration_test -Atc "select count(*) from _prisma_migrations where finished_at is not null and rolled_back_at is null")"
          migration_names="$(psql -h 127.0.0.1 -U resort -d resort_os_migration_test -Atc "select string_agg(migration_name,',' order by started_at) from _prisma_migrations where finished_at is not null and rolled_back_at is null")"
          core_constraint_count="$(psql -h 127.0.0.1 -U resort -d resort_os_migration_test -Atc "select count(*) from pg_constraint where conname = any(array['rate_period_valid_dates','rate_period_nonnegative_price','reservation_request_valid_dates','reservation_request_positive_adults','reservation_request_nonnegative_children','reservation_valid_dates','reservation_positive_adults','reservation_nonnegative_children','reservation_nonnegative_total','inventory_block_valid_dates','no_overlapping_active_room_blocks','payment_positive_amount','payment_has_context'])")"
          site_content_table="$(psql -h 127.0.0.1 -U resort -d resort_os_migration_test -Atc "select to_regclass('public.site_content_documents')::text")"
          guest_service_columns="$(psql -h 127.0.0.1 -U resort -d resort_os_migration_test -Atc "select count(*) from information_schema.columns where table_schema='public' and table_name='operational_tasks' and column_name in ('reservationId','serviceCode','serviceDate','serviceTime')")"
          guest_service_constraints="$(psql -h 127.0.0.1 -U resort -d resort_os_migration_test -Atc "select count(*) from pg_constraint where conname in ('operational_tasks_service_context_type_check','operational_tasks_service_time_check','operational_tasks_reservationId_fkey')")"
          owner_snapshot_table="$(psql -h 127.0.0.1 -U resort -d resort_os_migration_test -Atc "select to_regclass('public.owner_analytics_snapshots')::text")"
          owner_snapshot_constraints="$(psql -h 127.0.0.1 -U resort -d resort_os_migration_test -Atc "select count(*) from pg_constraint where conname in ('owner_analytics_snapshots_property_fkey','owner_analytics_snapshots_horizon_check','owner_analytics_snapshots_payload_object_check')")"
          owner_snapshot_unique="$(psql -h 127.0.0.1 -U resort -d resort_os_migration_test -Atc "select count(*) from pg_indexes where schemaname='public' and tablename='owner_analytics_snapshots' and indexname='owner_analytics_snapshots_property_date_key'")"
          guest_engagement_table="$(psql -h 127.0.0.1 -U resort -d resort_os_migration_test -Atc "select to_regclass('public.guest_engagements')::text")"
          guest_engagement_constraints="$(psql -h 127.0.0.1 -U resort -d resort_os_migration_test -Atc "select count(*) from pg_constraint where conname in ('guest_engagements_property_fkey','guest_engagements_guest_fkey','guest_engagements_reservation_fkey','guest_engagements_kind_check','guest_engagements_status_check','guest_engagements_score_check','guest_engagements_score_kind_check','guest_engagements_feedback_reservation_check')")"
          guest_engagement_unique="$(psql -h 127.0.0.1 -U resort -d resort_os_migration_test -Atc "select count(*) from pg_indexes where schemaname='public' and tablename='guest_engagements' and indexname='guest_engagements_feedback_reservation_key'")"
          guest_os_tables="$(psql -h 127.0.0.1 -U resort -d resort_os_migration_test -Atc "select count(*) from information_schema.tables where table_schema='public' and table_name in ('stays','room_assignments','room_qrs','guest_sessions','guest_history_events','guest_preferences')")"
          guest_os_task_stay_column="$(psql -h 127.0.0.1 -U resort -d resort_os_migration_test -Atc "select count(*) from information_schema.columns where table_schema='public' and table_name='operational_tasks' and column_name='stayId'")"
          guest_os_task_stay_fk="$(psql -h 127.0.0.1 -U resort -d resort_os_migration_test -Atc "select count(*) from pg_constraint where conname='operational_tasks_stayId_fkey'")"
          service_point_tables="$(psql -h 127.0.0.1 -U resort -d resort_os_migration_test -Atc "select count(*) from information_schema.tables where table_schema='public' and table_name in ('service_points','service_point_request_options','service_point_qrs')")"
          service_point_task_column="$(psql -h 127.0.0.1 -U resort -d resort_os_migration_test -Atc "select count(*) from information_schema.columns where table_schema='public' and table_name='operational_tasks' and column_name='servicePointId'")"
          service_point_fk_count="$(psql -h 127.0.0.1 -U resort -d resort_os_migration_test -Atc "select count(*) from pg_constraint where conname in ('service_points_propertyId_fkey','service_point_request_options_servicePointId_fkey','service_point_qrs_propertyId_fkey','service_point_qrs_servicePointId_fkey','operational_tasks_servicePointId_fkey')")"
          service_point_check_count="$(psql -h 127.0.0.1 -U resort -d resort_os_migration_test -Atc "select count(*) from pg_constraint where conname in ('service_points_category_check','service_point_qrs_revocation_check','operational_tasks_service_point_context_check')")"
          service_point_active_qr_unique="$(psql -h 127.0.0.1 -U resort -d resort_os_migration_test -Atc "select count(*) from pg_indexes where schemaname='public' and tablename='service_point_qrs' and indexname='service_point_qrs_one_active_per_point'")"
          test "$migration_count" = '7'
          test "$migration_names" = '0_init,1_site_content,2_guest_service_tasks,3_owner_analytics_snapshots,4_guest_engagements,5_guest_os_core,6_service_point_qr_operations'
          test "$core_constraint_count" = '13'
          test "$site_content_table" = 'site_content_documents'
          test "$guest_service_columns" = '4'
          test "$guest_service_constraints" = '3'
          test "$owner_snapshot_table" = 'owner_analytics_snapshots'
          test "$owner_snapshot_constraints" = '3'
          test "$owner_snapshot_unique" = '1'
          test "$guest_engagement_table" = 'guest_engagements'
          test "$guest_engagement_constraints" = '8'
          test "$guest_engagement_unique" = '1'
          test "$guest_os_tables" = '6'
          test "$guest_os_task_stay_column" = '1'
          test "$guest_os_task_stay_fk" = '1'
          test "$service_point_tables" = '3'
          test "$service_point_task_column" = '1'
          test "$service_point_fk_count" = '5'
          test "$service_point_check_count" = '3'
          test "$service_point_active_qr_unique" = '1'

      - name: Upload migration chain for explicit review
        uses: actions/upload-artifact@v4
        with:
          name: three-crowns-migration-chain-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            packages/database/prisma/migrations/**/migration.sql
            packages/database/prisma/migrations/0_init/migration.sql.sha256
          if-no-files-found: error
          retention-days: 7
