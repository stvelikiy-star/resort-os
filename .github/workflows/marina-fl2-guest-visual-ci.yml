name: MARINA FL2 Guest C12 Visual QA
on:
  pull_request:
    paths:
      - 'apps/web/app/guest-concierge.css'
      - 'apps/web/app/guest-owner-corrections.css'
      - 'apps/web/components/GuestConciergeRuntime.tsx'
      - 'apps/web/public/marina-smart-approved.png'
      - 'scripts/design/fl2-guest-c12-browser.mjs'
      - '.github/workflows/marina-fl2-guest-visual-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: marina-fl2-guest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  guest-c12-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Verify Guest contract and production build
        env:
          CORE_API_URL: http://127.0.0.1:8000
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          node scripts/guest_concierge_v2_browser_contract.mjs
          npm ci --prefix apps/web --no-audit --no-fund
          npm --prefix apps/web run typecheck
          npm --prefix apps/web run build
      - name: Install Chromium
        run: |
          npm install --prefix /tmp/marina-guest-browser playwright@1.58.2 --no-audit --no-fund
          /tmp/marina-guest-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Start actual compiled Guest OS with synthetic Core interceptions
        run: |
          (cd apps/web && NEXT_TELEMETRY_DISABLED=1 ./node_modules/.bin/next start -p 3000 --hostname 127.0.0.1) > /tmp/guest-qa-next.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/g/qa-room > /dev/null; then exit 0; fi
            sleep 2
          done
          tail -100 /tmp/guest-qa-next.log
          exit 1
      - name: Verify PIN, original logo, service modal, mobile overflow and focus
        env:
          PLAYWRIGHT_PACKAGE: /tmp/marina-guest-browser/package.json
        run: node scripts/design/fl2-guest-c12-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marina-fl2-guest-c12-browser-evidence
          path: |
            guest-c12-evidence/
          if-no-files-found: warn
      - name: Preserve browser server log
        if: failure()
        run: tail -100 /tmp/guest-qa-next.log || true
