name: Public AI Abuse Protection CI

on:
  pull_request:
    paths:
      - 'services/api/app/public_ai_admin.py'
      - 'scripts/verify_public_ai_rate_limit_e2e.py'
      - '.github/workflows/public-ai-abuse-protection-ci.yml'
      - 'services/api/app/auth.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-ai-abuse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: resort_os
          POSTGRES_USER: resort
          POSTGRES_PASSWORD: resort
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resort -d resort_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      MARINA_PUBLIC_AI_DISPOSABLE_CI: '1'
      DATABASE_URL: postgresql://resort:resort@localhost:5432/resort_os?schema=public
      PROPERTY_CODE: THREE_CROWNS
      RATE_PLAN_CODE: DIRECT_2026_27
      COOKIE_SECURE: 'false'
      OPENAI_API_KEY: ''
      OPENAI_PUBLIC_ASSISTANT_MODEL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/database/package-lock.json
      - name: Migrate disposable PostgreSQL
        working-directory: packages/database
        run: |
          npm ci --no-audit --no-fund
          npx prisma migrate deploy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - name: Install Core dependencies
        run: |
          pip install -r services/api/requirements.txt
          python -m compileall services/api/app/public_ai_admin.py scripts/verify_public_ai_rate_limit_e2e.py
      - name: Seed isolated hotel
        run: python scripts/seed_from_intake.py
      - name: Verify spoof resistance and atomic minute/day quotas in PostgreSQL
        run: PYTHONPATH=. python scripts/verify_public_ai_rate_limit_e2e.py
