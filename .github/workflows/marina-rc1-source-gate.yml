name: MARINA RC1 Source Lock and Regression CI

on:
  pull_request:
    paths:
      - 'release/marina-smart-current-candidate.json'
      - 'scripts/marina_candidate_truth_guard.py'
      - 'scripts/test_marina_rc1_source_lock.py'
      - '.github/workflows/marina-rc1-source-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned API test dependencies
        run: python -m pip install -r services/api/requirements.txt
      - name: Verify exact candidate identity, migration hashes and required gates
        run: python scripts/marina_candidate_truth_guard.py
      - name: Run MARINA offline regression and source-lock negative tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          MARINA_SHARED_BROWSER_CI_PASSWORD: synthetic-ci-only-restore-guard
        run: |
          # RC3 restore-test source is immutable. Supply the disposable CI-only
          # fixture it requires without changing its reviewed security guard.
          printf '{}' > /tmp/marina_shared_browser_receipts.json
          python -m unittest discover -s scripts -p 'test_marina_*.py' -v
