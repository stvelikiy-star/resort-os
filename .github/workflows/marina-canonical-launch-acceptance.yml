name: MARINA Canonical Shared Launch Acceptance
on:
  pull_request:
    paths:
      - 'scripts/marina_canonical_launch_audit.py'
      - '.github/workflows/marina-canonical-launch-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canonical-launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: marina_launch_acceptance_ci
          POSTGRES_USER: marina_ci
          POSTGRES_PASSWORD: synthetic_canonical_audit_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U marina_ci -d marina_launch_acceptance_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://marina_ci:synthetic_canonical_audit_only@127.0.0.1:5432/marina_launch_acceptance_ci
      MARINA_CANONICAL_AUDIT_CONFIRM: LOCAL_SYNTHETIC_EMPTY_DB_ONLY
      APP_ENV: staging
      PROPERTY_CODE: MARINA_CANONICAL_AUDIT
      MARINA_TENANT_CONTEXT_ENABLED: 'true'
      MARINA_SHARED_AUTH_PREVIEW_ENABLED: 'true'
      COOKIE_SECURE: 'false'
      WS_ENFORCE_SAME_ORIGIN: 'true'
      ENABLE_PAYMENT_OPERATIONS: 'false'
      ENABLE_MKASSA: 'false'
      ENABLE_SERVICE_POINT_QR: 'false'
      OPENAI_API_KEY: ''
      MARINA_AI_API_KEY: ''
      MARINA_CANONICAL_AUDIT_OUTPUT: /tmp/marina-canonical-launch-audit.json
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reviewed migrations to a new disposable database
        working-directory: packages/database
        run: |
          npm ci --no-audit --no-fund
          npx prisma migrate deploy
      - name: Install pinned API dependencies
        run: python -m pip install -r services/api/requirements.txt
      - name: Verify canonical shared application over real HTTP and WebSocket
        run: timeout 180s python scripts/marina_canonical_launch_audit.py
      - name: Preserve acceptance evidence even when launch is blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marina-canonical-launch-acceptance
          path: /tmp/marina-canonical-launch-audit.json
          if-no-files-found: error
