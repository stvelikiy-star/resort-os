name: Three Crowns Dependency Security Inspection

on:
  pull_request:
  push:
    branches:
      - integration/site-pms-cms-20260827
      - main

permissions:
  contents: read

jobs:
  inspect-next-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify committed lockfiles exist
        run: test -s apps/web/package-lock.json && test -s apps/admin/package-lock.json && test -s apps/staff/package-lock.json

      - name: Verify all three Next apps declare the same runtime dependency versions
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const paths=['apps/web/package.json','apps/admin/package.json','apps/staff/package.json'];
          const pkgs=paths.map(p=>JSON.parse(fs.readFileSync(p,'utf8')));
          const keys=['next','react','react-dom'];
          for (const key of keys) {
            const vals=pkgs.map(p=>p.dependencies?.[key]);
            if (new Set(vals).size !== 1) throw new Error(`${key} differs across apps: ${vals.join(', ')}`);
            console.log(`${key}=${vals[0]}`);
          }
          const postcss=pkgs.map(p=>p.overrides?.postcss);
          if (new Set(postcss).size !== 1 || !postcss[0]) throw new Error(`postcss override differs/missing: ${postcss.join(', ')}`);
          console.log(`postcss_override=${postcss[0]}`);
          NODE

      - name: Prove lockfiles match package manifests
        run: |
          for app in web admin staff; do
            (cd "apps/$app" && npm ci --ignore-scripts --no-audit)
          done

      - name: Capture exact audit report
        working-directory: apps/web
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit.json
          set -e
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('npm-audit.json','utf8'));
          const vulns = report.vulnerabilities || {};
          const rows = Object.entries(vulns).map(([name, v]) => ({
            name,
            severity: v.severity,
            direct: Boolean(v.isDirect),
            range: v.range,
            fixAvailable: v.fixAvailable,
            via: (v.via || []).map(x => typeof x === 'string' ? x : ({
              source: x.source,
              name: x.name,
              severity: x.severity,
              title: x.title,
              url: x.url,
              range: x.range
            }))
          }));
          console.log(JSON.stringify({metadata: report.metadata, vulnerabilities: rows}, null, 2));
          fs.writeFileSync('npm-audit-summary.json', JSON.stringify({metadata: report.metadata, vulnerabilities: rows}, null, 2));
          NODE

      - name: Gate high and critical vulnerabilities
        working-directory: apps/web
        run: |
          node - <<'NODE'
          const r=require('./npm-audit.json');
          const counts=r.metadata?.vulnerabilities || {};
          console.log('audit_counts='+JSON.stringify(counts));
          if ((counts.high || 0) > 0 || (counts.critical || 0) > 0) {
            console.error('High/critical npm vulnerability detected.');
            process.exit(1);
          }
          NODE

      - name: Upload dependency evidence
        uses: actions/upload-artifact@v4
        with:
          name: three-crowns-next-dependency-evidence
          path: |
            apps/web/package-lock.json
            apps/admin/package-lock.json
            apps/staff/package-lock.json
            apps/web/npm-audit.json
            apps/web/npm-audit-summary.json
          retention-days: 7
