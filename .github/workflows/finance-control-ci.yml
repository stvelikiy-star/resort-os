name: Finance Control CI

on:
  pull_request:
    paths:
      - 'services/api/app/hotel_finance.py'
      - 'services/api/app/reservation_payments.py'
      - 'services/api/app/booking_admin.py'
      - 'services/api/app/payment_idempotency.py'
      - 'services/api/app/stays.py'
      - 'services/api/app/app_entry.py'
      - 'apps/admin/components/HotelFinanceBoard.tsx'
      - 'apps/admin/components/RequestsBoard.tsx'
      - 'packages/database/prisma/schema.prisma'
      - 'packages/database/prisma/migrations/**'
      - 'scripts/verify_finance_control.py'
      - 'scripts/upsert_staff_user.py'
      - '.github/workflows/finance-control-ci.yml'
  push:
    branches: [main]
    paths:
      - 'services/api/app/hotel_finance.py'
      - 'services/api/app/reservation_payments.py'
      - 'services/api/app/booking_admin.py'
      - 'services/api/app/payment_idempotency.py'
      - 'services/api/app/stays.py'
      - 'services/api/app/app_entry.py'
      - 'apps/admin/components/HotelFinanceBoard.tsx'
      - 'apps/admin/components/RequestsBoard.tsx'
      - 'packages/database/prisma/schema.prisma'
      - 'packages/database/prisma/migrations/**'
      - 'scripts/verify_finance_control.py'
      - 'scripts/upsert_staff_user.py'
      - '.github/workflows/finance-control-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finance-control:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: resort_os
          POSTGRES_USER: resort
          POSTGRES_PASSWORD: resort
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resort -d resort_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://resort:resort@localhost:5432/resort_os?schema=public
      PROPERTY_CODE: THREE_CROWNS
      RATE_PLAN_CODE: DIRECT_2026_27
      CORE_API_URL: http://127.0.0.1:8000
      COOKIE_SECURE: false
      BOOTSTRAP_OWNER_USERNAME: finance-ci-owner
      BOOTSTRAP_OWNER_PASSWORD: Finance-CI-Owner-Strong-2026
      BOOTSTRAP_OWNER_DISPLAY_NAME: Finance CI Owner
      FINANCE_RECEPTION_USERNAME: finance-ci-reception
      FINANCE_RECEPTION_PASSWORD: Finance-Reception-CI-2026

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Prisma schema and migration chain
        working-directory: packages/database
        run: |
          npm install --no-audit --no-fund
          npx prisma validate
          npx prisma migrate deploy

      - name: Typecheck and build finance/admin surfaces
        working-directory: apps/admin
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: services/api/requirements.txt

      - name: Install and compile Resort Core and Finance verifier
        run: |
          pip install -r services/api/requirements.txt
          python -m compileall services/api/app scripts/verify_finance_control.py scripts/upsert_staff_user.py

      - name: Seed Three Crowns and bootstrap finance roles
        run: |
          python scripts/seed_from_intake.py
          python scripts/bootstrap_owner.py
          STAFF_USERNAME="$FINANCE_RECEPTION_USERNAME" STAFF_PASSWORD="$FINANCE_RECEPTION_PASSWORD" STAFF_DISPLAY_NAME='Finance CI Reception' STAFF_ROLE=RECEPTION python scripts/upsert_staff_user.py

      - name: Start Resort Core
        run: |
          python -m uvicorn app.app_entry:app --app-dir services/api --host 127.0.0.1 --port 8000 > /tmp/finance-control-api.log 2>&1 &
          echo $! > /tmp/finance-control-api.pid
          for i in {1..30}; do
            if curl --fail -sS http://127.0.0.1:8000/health/ready >/tmp/finance-control-ready.json 2>/dev/null; then break; fi
            if [ "$i" = "30" ]; then cat /tmp/finance-control-api.log; exit 1; fi
            sleep 1
          done

      - name: Run Finance Control reconciliation E2E
        run: python scripts/verify_finance_control.py

      - name: Show Resort Core logs on failure
        if: failure()
        run: cat /tmp/finance-control-api.log || true

      - name: Stop Resort Core
        if: always()
        run: |
          if [ -f /tmp/finance-control-api.pid ]; then kill "$(cat /tmp/finance-control-api.pid)" || true; fi
