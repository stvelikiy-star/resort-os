name: Three Crowns Single Server Production Package CI

on:
  pull_request:
  push:
    branches:
      - integration/site-pms-cms-20260827
      - main

permissions:
  contents: read

jobs:
  validate-production-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare non-secret CI environment
        run: |
          cp .env.production.example .env.production.ci
          sed -i 's/CHANGE_ME_STRONG_DATABASE_PASSWORD/ci-db-password-not-secret/' .env.production.ci
          sed -i 's/CHANGE_ME_LONG_RANDOM_SERVICE_KEY_AT_LEAST_32_CHARS/ci-automation-key-abcdefghijklmnopqrstuvwxyz012345/' .env.production.ci
          sed -i 's/CHANGE_ME_DIFFERENT_LONG_RANDOM_ENCRYPTION_KEY/ci-n8n-encryption-abcdefghijklmnopqrstuvwxyz012345/' .env.production.ci
          sed -i 's/CHANGE_ME_OWNER_EMAIL/ops@example.invalid/' .env.production.ci
          sed -i 's#HOST_DATA_DIR=/srv/three-crowns/data#HOST_DATA_DIR=./.ci-data#' .env.production.ci
          mkdir -p .ci-data/postgres .ci-data/n8n .ci-data/media/public

      - name: Validate Docker Compose production graph and same-origin WSS wiring
        run: |
          docker compose --env-file .env.production.ci -f compose.production.yaml config > .production-compose.rendered.yml
          grep -F 'NEXT_PUBLIC_CORE_WS_URL: wss://admin.3korony.com' .production-compose.rendered.yml
          if grep -F 'NEXT_PUBLIC_CORE_WS_URL: wss://api.3korony.com' .production-compose.rendered.yml; then
            echo 'Admin WebSocket must remain same-origin so host-only session cookies are sent.' >&2
            exit 1
          fi
          grep -F 'image: n8nio/n8n:2.37.10' .production-compose.rendered.yml
          grep -F 'image: postgres:16.15-alpine' .production-compose.rendered.yml
          grep -F 'image: caddy:2.11.4-alpine' .production-compose.rendered.yml
          grep -F '@core_ws path /ws/*' deploy/Caddyfile
          test "$(grep -c '@core_ws path /ws/\*' deploy/Caddyfile)" -eq 2
          if grep -Eq '(^|[^0-9])5432:5432' .production-compose.rendered.yml; then
            echo 'PostgreSQL must not publish 5432 to the host.' >&2
            exit 1
          fi
          if grep -F 'n8nio/n8n:2.36.2' .production-compose.rendered.yml; then
            echo 'Vulnerable/stale n8n 2.36.2 must not appear in production graph.' >&2
            exit 1
          fi

      - name: Validate Caddy configuration
        run: |
          docker run --rm \
            -e TLS_EMAIL=ops@example.invalid \
            -e PUBLIC_HOST=3korony.example.invalid \
            -e ADMIN_HOST=admin.3korony.example.invalid \
            -e STAFF_HOST=staff.3korony.example.invalid \
            -e API_HOST=api.3korony.example.invalid \
            -e AUTOMATION_HOST=automation.3korony.example.invalid \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Validate operational shell scripts
        run: |
          bash -n scripts/production_backup.sh
          bash -n scripts/host_preflight.sh

      - name: Pull pinned production infrastructure images
        run: |
          docker pull n8nio/n8n:2.37.10
          docker pull postgres:16.15-alpine
          docker pull caddy:2.11.4-alpine

      - name: Build deterministic Resort OS application images
        run: docker compose --env-file .env.production.ci -f compose.production.yaml build api web admin staff
