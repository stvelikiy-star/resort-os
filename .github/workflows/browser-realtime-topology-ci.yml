name: Browser Realtime Topology CI

on:
  pull_request:
    paths:
      - 'deploy/Caddyfile'
      - 'compose.production.yaml'
      - 'compose.beget.yaml'
      - '.env.production.example'
      - '.env.beget.example'
      - 'scripts/verify_browser_realtime_topology.py'
      - 'scripts/beget_deployment_guard.py'
      - '.github/workflows/browser-realtime-topology-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'deploy/Caddyfile'
      - 'compose.production.yaml'
      - 'compose.beget.yaml'
      - '.env.production.example'
      - '.env.beget.example'
      - 'scripts/verify_browser_realtime_topology.py'
      - 'scripts/beget_deployment_guard.py'
      - '.github/workflows/browser-realtime-topology-ci.yml'

permissions:
  contents: read

jobs:
  topology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify same-origin browser realtime contract
        run: python scripts/verify_browser_realtime_topology.py
      - name: Verify Beget deployment contract remains fail closed
        run: python scripts/beget_deployment_guard.py
      - name: Validate Caddy syntax with exact production image
        run: |
          docker run --rm \
            -e TLS_EMAIL=ops@example.invalid \
            -e PUBLIC_HOST=3korony.example.invalid \
            -e ADMIN_HOST=admin.3korony.example.invalid \
            -e STAFF_HOST=staff.3korony.example.invalid \
            -e API_HOST=api.3korony.example.invalid \
            -e AUTOMATION_HOST=automation.3korony.example.invalid \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine caddy validate --config /etc/caddy/Caddyfile
