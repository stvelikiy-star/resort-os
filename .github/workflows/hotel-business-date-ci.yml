name: Hotel Business Date CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hotel-date-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Asia/Bishkek business-date contract
        run: python scripts/hotel_business_date_contract_test.py
