name: Hotel Operations CI

on:
  push:
    branches: [main]
    paths:
      - 'services/api/**'
      - 'packages/database/**'
      - 'scripts/**'
      - 'apps/admin/**'
      - 'apps/staff/**'
      - '.github/workflows/hotel-operations-ci.yml'
  pull_request:
    paths:
      - 'services/api/**'
      - 'packages/database/**'
      - 'scripts/**'
      - 'apps/admin/**'
      - 'apps/staff/**'
      - '.github/workflows/hotel-operations-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hotel-operations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: resort_os
          POSTGRES_USER: resort
          POSTGRES_PASSWORD: resort
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resort -d resort_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://resort:resort@localhost:5432/resort_os?schema=public
      PROPERTY_CODE: THREE_CROWNS
      RATE_PLAN_CODE: DIRECT_2026_27
      COOKIE_SECURE: false
      BOOTSTRAP_OWNER_USERNAME: ci-owner
      BOOTSTRAP_OWNER_PASSWORD: CI-Owner-Strong-Password-2026
      BOOTSTRAP_OWNER_DISPLAY_NAME: CI Owner

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Create database schema
        working-directory: packages/database
        run: |
          npm install --no-audit --no-fund
          npx prisma validate
          npx prisma db push

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: services/api/requirements.txt

      - name: Install API dependencies
        run: pip install -r services/api/requirements.txt

      - name: Compile Core and enforce active release scope
        run: |
          python -m compileall services/api/app scripts
          python scripts/release_scope_guard.py

      - name: Apply constraints and seed hotel
        run: |
          python scripts/apply_core_constraints.py
          python scripts/seed_from_intake.py
          python scripts/bootstrap_owner.py

      - name: Create maid and technician users
        run: |
          STAFF_USERNAME=ci-maid STAFF_PASSWORD='CI-Maid-Strong-Password-2026' STAFF_DISPLAY_NAME='CI Maid' STAFF_ROLE=MAID python scripts/upsert_staff_user.py
          STAFF_USERNAME=ci-tech STAFF_PASSWORD='CI-Tech-Strong-Password-2026' STAFF_DISPLAY_NAME='CI Technician' STAFF_ROLE=TECHNICIAN python scripts/upsert_staff_user.py

      - name: Start Resort Core
        run: |
          python -m uvicorn app.app_entry:app --app-dir services/api --host 127.0.0.1 --port 8000 > /tmp/hotel-ops-api.log 2>&1 &
          echo $! > /tmp/hotel-ops-api.pid
          for i in {1..30}; do
            if curl --fail -sS http://127.0.0.1:8000/health/ready > /tmp/ready.json 2>/dev/null; then break; fi
            if [ "$i" = "30" ]; then cat /tmp/hotel-ops-api.log; exit 1; fi
            sleep 1
          done

      - name: Login owner and line staff
        run: |
          curl --fail -sS -c /tmp/owner-cookies.txt -X POST http://127.0.0.1:8000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci-owner","password":"CI-Owner-Strong-Password-2026"}' > /tmp/owner-login.json
          curl --fail -sS -c /tmp/maid-cookies.txt -X POST http://127.0.0.1:8000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci-maid","password":"CI-Maid-Strong-Password-2026"}' > /tmp/maid-login.json
          curl --fail -sS -c /tmp/tech-cookies.txt -X POST http://127.0.0.1:8000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci-tech","password":"CI-Tech-Strong-Password-2026"}' > /tmp/tech-login.json

      - name: Load staff overview
        run: |
          curl --fail -sS -b /tmp/owner-cookies.txt http://127.0.0.1:8000/api/v1/admin/staff/overview > /tmp/staff.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/staff.json'))
          staff={x['username']:x for x in d['staff']}
          assert staff['ci-maid']['role']=='MAID'
          assert staff['ci-tech']['role']=='TECHNICIAN'
          open('/tmp/maid-id','w').write(staff['ci-maid']['id'])
          open('/tmp/tech-id','w').write(staff['ci-tech']['id'])
          PY

      - name: Resolve test rooms from PMS grid
        run: |
          python - <<'PY'
          from datetime import date,timedelta
          open('/tmp/grid-start','w').write(date.today().isoformat())
          open('/tmp/grid-end','w').write((date.today()+timedelta(days=1)).isoformat())
          PY
          START=$(cat /tmp/grid-start)
          END=$(cat /tmp/grid-end)
          curl --fail -sS -b /tmp/owner-cookies.txt "http://127.0.0.1:8000/api/v1/pms/grid?start=$START&end=$END" > /tmp/grid.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/grid.json'))
          assert len(d['rooms']) == 84
          r101=next(x for x in d['rooms'] if x['code']=='101')
          r102=next(x for x in d['rooms'] if x['code']=='102')
          open('/tmp/room-101-id','w').write(r101['id'])
          open('/tmp/room-102-id','w').write(r102['id'])
          PY

      - name: Create and assign housekeeping task
        run: |
          ROOM_ID=$(cat /tmp/room-101-id)
          cat > /tmp/create-task.json <<JSON
          {"type":"HOUSEKEEPING","room_id":"$ROOM_ID","priority":"NORMAL","title":"CI уборка 101","source":"CI"}
          JSON
          curl --fail -sS -b /tmp/owner-cookies.txt -X POST http://127.0.0.1:8000/api/v1/ops/tasks \
            -H 'Content-Type: application/json' --data-binary @/tmp/create-task.json > /tmp/task.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/task.json'))
          assert d['status']=='OPEN'
          open('/tmp/task-id','w').write(d['id'])
          PY
          TASK_ID=$(cat /tmp/task-id)
          TECH_ID=$(cat /tmp/tech-id)
          MAID_ID=$(cat /tmp/maid-id)
          CODE=$(curl -sS -o /tmp/wrong-role.json -w '%{http_code}' -b /tmp/owner-cookies.txt \
            -X PATCH "http://127.0.0.1:8000/api/v1/ops/tasks/$TASK_ID/assignee" \
            -H 'Content-Type: application/json' -d "{\"assigned_to_id\":\"$TECH_ID\"}")
          test "$CODE" = "422"
          curl --fail -sS -b /tmp/owner-cookies.txt \
            -X PATCH "http://127.0.0.1:8000/api/v1/ops/tasks/$TASK_ID/assignee" \
            -H 'Content-Type: application/json' -d "{\"assigned_to_id\":\"$MAID_ID\"}" > /tmp/assigned.json

      - name: Reject skipped housekeeping transition
        run: |
          TASK_ID=$(cat /tmp/task-id)
          CODE=$(curl -sS -o /tmp/skip.json -w '%{http_code}' -b /tmp/maid-cookies.txt \
            -X PATCH "http://127.0.0.1:8000/api/v1/ops/tasks/$TASK_ID/status" \
            -H 'Content-Type: application/json' -d '{"status":"IN_INSPECTION"}')
          test "$CODE" = "409"
          python - <<'PY'
          import json
          d=json.load(open('/tmp/skip.json'))
          assert d['detail']['code']=='INVALID_TASK_TRANSITION'
          assert d['detail']['from_status']=='OPEN'
          assert d['detail']['to_status']=='IN_INSPECTION'
          PY

      - name: Maid claim and send room to inspection
        run: |
          TASK_ID=$(cat /tmp/task-id)
          ROOM_ID=$(cat /tmp/room-101-id)
          curl --fail -sS -b /tmp/maid-cookies.txt -X POST \
            "http://127.0.0.1:8000/api/v1/ops/tasks/$TASK_ID/claim" > /tmp/claim.json
          curl --fail -sS -b /tmp/maid-cookies.txt -X PATCH \
            "http://127.0.0.1:8000/api/v1/ops/tasks/$TASK_ID/status" \
            -H 'Content-Type: application/json' -d '{"status":"IN_INSPECTION"}' > /tmp/inspection-1.json
          curl --fail -sS -b /tmp/owner-cookies.txt \
            "http://127.0.0.1:8000/api/v1/admin/rooms/$ROOM_ID" > /tmp/room-inspection.json
          python - <<'PY'
          import json
          assert json.load(open('/tmp/claim.json'))['status']=='IN_PROGRESS'
          assert json.load(open('/tmp/inspection-1.json'))['status']=='IN_INSPECTION'
          room=json.load(open('/tmp/room-inspection.json'))
          assert room['room']['operational_state']=='IN_INSPECTION'
          PY

      - name: Manager returns inspection to rework
        run: |
          TASK_ID=$(cat /tmp/task-id)
          ROOM_ID=$(cat /tmp/room-101-id)
          curl --fail -sS -b /tmp/owner-cookies.txt -X PATCH \
            "http://127.0.0.1:8000/api/v1/ops/tasks/$TASK_ID/status" \
            -H 'Content-Type: application/json' -d '{"status":"IN_PROGRESS"}' > /tmp/rework.json
          curl --fail -sS -b /tmp/owner-cookies.txt \
            "http://127.0.0.1:8000/api/v1/admin/rooms/$ROOM_ID" > /tmp/room-rework.json
          python - <<'PY'
          import json
          assert json.load(open('/tmp/rework.json'))['status']=='IN_PROGRESS'
          room=json.load(open('/tmp/room-rework.json'))
          assert room['room']['operational_state']=='DIRTY'
          PY

      - name: Maid resubmits and manager accepts room CLEAN
        run: |
          TASK_ID=$(cat /tmp/task-id)
          ROOM_ID=$(cat /tmp/room-101-id)
          curl --fail -sS -b /tmp/maid-cookies.txt -X PATCH \
            "http://127.0.0.1:8000/api/v1/ops/tasks/$TASK_ID/status" \
            -H 'Content-Type: application/json' -d '{"status":"IN_INSPECTION"}' > /tmp/inspection-2.json
          curl --fail -sS -b /tmp/owner-cookies.txt -X PATCH \
            "http://127.0.0.1:8000/api/v1/ops/tasks/$TASK_ID/status" \
            -H 'Content-Type: application/json' -d '{"status":"DONE"}' > /tmp/done.json
          curl --fail -sS -b /tmp/owner-cookies.txt \
            "http://127.0.0.1:8000/api/v1/admin/rooms/$ROOM_ID" > /tmp/room-clean.json
          python - <<'PY'
          import json
          assert json.load(open('/tmp/done.json'))['status']=='DONE'
          room=json.load(open('/tmp/room-clean.json'))
          assert room['room']['operational_state']=='CLEAN'
          PY

      - name: Verify TECH_BLOCK cannot be silently cleaned by housekeeping
        run: |
          ROOM_ID=$(cat /tmp/room-102-id)
          MAID_ID=$(cat /tmp/maid-id)
          cat > /tmp/maintenance.json <<JSON
          {"type":"MAINTENANCE","room_id":"$ROOM_ID","priority":"HIGH","title":"CI tech block 102","source":"CI"}
          JSON
          curl --fail -sS -b /tmp/owner-cookies.txt -X POST http://127.0.0.1:8000/api/v1/ops/tasks \
            -H 'Content-Type: application/json' --data-binary @/tmp/maintenance.json > /tmp/maintenance-created.json
          cat > /tmp/housekeeping-blocked.json <<JSON
          {"type":"HOUSEKEEPING","room_id":"$ROOM_ID","priority":"NORMAL","title":"CI уборка поверх ремонта 102","source":"CI","assigned_to_id":"$MAID_ID"}
          JSON
          curl --fail -sS -b /tmp/owner-cookies.txt -X POST http://127.0.0.1:8000/api/v1/ops/tasks \
            -H 'Content-Type: application/json' --data-binary @/tmp/housekeeping-blocked.json > /tmp/housekeeping-created.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/housekeeping-created.json'))
          open('/tmp/blocked-housekeeping-id','w').write(d['id'])
          PY
          TASK_ID=$(cat /tmp/blocked-housekeeping-id)
          curl --fail -sS -b /tmp/maid-cookies.txt -X POST \
            "http://127.0.0.1:8000/api/v1/ops/tasks/$TASK_ID/claim" > /tmp/blocked-claim.json
          curl --fail -sS -b /tmp/maid-cookies.txt -X PATCH \
            "http://127.0.0.1:8000/api/v1/ops/tasks/$TASK_ID/status" \
            -H 'Content-Type: application/json' -d '{"status":"IN_INSPECTION"}' > /tmp/blocked-inspection.json
          curl --fail -sS -b /tmp/owner-cookies.txt \
            "http://127.0.0.1:8000/api/v1/admin/rooms/$ROOM_ID" > /tmp/room-tech-block.json
          CODE=$(curl -sS -o /tmp/blocked-done.json -w '%{http_code}' -b /tmp/owner-cookies.txt -X PATCH \
            "http://127.0.0.1:8000/api/v1/ops/tasks/$TASK_ID/status" \
            -H 'Content-Type: application/json' -d '{"status":"DONE"}')
          test "$CODE" = "409"
          python - <<'PY'
          import json
          room=json.load(open('/tmp/room-tech-block.json'))
          assert room['room']['operational_state']=='TECH_BLOCK'
          rejected=json.load(open('/tmp/blocked-done.json'))
          assert rejected['detail']['code']=='HOUSEKEEPING_ROOM_NOT_IN_INSPECTION'
          assert rejected['detail']['room_state']=='TECH_BLOCK'
          PY

      - name: Verify assignment history and workload
        run: |
          TASK_ID=$(cat /tmp/task-id)
          curl --fail -sS -b /tmp/owner-cookies.txt "http://127.0.0.1:8000/api/v1/ops/tasks/$TASK_ID/history" > /tmp/history.json
          curl --fail -sS -b /tmp/owner-cookies.txt http://127.0.0.1:8000/api/v1/admin/staff/overview > /tmp/staff-after.json
          python - <<'PY'
          import json
          h=json.load(open('/tmp/history.json'))
          assert any(x['action']=='ASSIGN' and x['actor_name']=='CI Owner' for x in h['history'])
          transitions=[x for x in h['history'] if x['action']=='STATUS_CHANGE']
          assert len(transitions) >= 4
          staff=json.load(open('/tmp/staff-after.json'))
          maid=next(x for x in staff['staff'] if x['username']=='ci-maid')
          # Main room 101 task is DONE; blocked room 102 housekeeping remains active.
          assert maid['active_tasks'] >= 1
          assert maid['housekeeping_active'] >= 1
          PY

      - name: Typecheck and build PMS and Staff PWA
        run: |
          cd apps/admin
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build
          cd ../staff
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Show Core logs on failure
        if: failure()
        run: cat /tmp/hotel-ops-api.log || true
