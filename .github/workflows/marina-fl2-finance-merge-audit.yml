name: MARINA FL2 Finance Integration Conflict Audit

on:
  push:
    branches:
      - integration/marina-fl2-finance-design-candidate-20261116

permissions:
  contents: read

jobs:
  audit-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout isolated integration base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Attempt conflict-only non-committing merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MARINA integration auditor"
          git config user.email "marina-audit@users.noreply.github.com"
          git fetch --no-tags origin refs/heads/fix/marina-owner-finance-refresh-fl2-20261116:refs/remotes/origin/finance-audit
          set +e
          git merge --no-commit --no-ff origin/finance-audit > merge-output.txt 2>&1
          result=$?
          set -e
          {
            echo "# MARINA FL2 + Finance merge conflict audit"
            echo "Base: $(git rev-parse HEAD)"
            echo "Finance: $(git rev-parse origin/finance-audit)"
            echo "Git merge exit code: $result"
            echo "## Unmerged files"
            git diff --name-only --diff-filter=U || true
            echo "## Merge summary"
            cat merge-output.txt
          } | tee merge-audit.txt
          if [ "$result" -ne 0 ]; then
            echo "Conflicts require manual review. No code was committed." >> merge-audit.txt
            exit 1
          fi
          echo "Dry-run tree merged cleanly, but has not been committed, deployed or accepted." >> merge-audit.txt
      - name: Upload conflict audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marina-fl2-finance-conflict-audit
          path: |
            merge-output.txt
            merge-audit.txt
          if-no-files-found: warn
