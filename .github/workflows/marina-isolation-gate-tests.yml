name: MARINA Isolation Gate Regression Tests

on:
  pull_request:
    paths:
      - 'scripts/verify_marina_multitenant_isolation.py'
      - 'scripts/test_marina_isolation_gate.py'
      - 'scripts/test_marina_grid_property.py'
      - 'services/api/app/main.py'
      - '.github/workflows/marina-isolation-gate-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check httpx==0.28.1
      - run: python scripts/test_marina_isolation_gate.py
      - run: python scripts/test_marina_grid_property.py
