name: MARINA FLEX Subscription State Contracts

on:
  pull_request:
    paths:
      - "services/api/app/flex_subscriptions.py"
      - "scripts/marina_flex_subscription_*"
      - "docs/flex/sql/0006_flex_agreements_subscription_preview.sql"
      - ".github/workflows/marina-flex-subscription-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle-pure:
    name: FLEX payment-gated subscription state machine
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify no-I/O subscription calculations
        run: |
          python -m py_compile services/api/app/flex_subscriptions.py scripts/marina_flex_subscription_contract_test.py
          python scripts/marina_flex_subscription_contract_test.py

  agreement-db:
    name: FLEX isolated agreement and invoice preview constraints
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: flex_ci
          POSTGRES_USER: flex_ci
          POSTGRES_PASSWORD: flex_ci_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flex_ci -d flex_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: flex_ci
      PGPASSWORD: flex_ci_ci_only
      PGDATABASE: flex_ci
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Bootstrap disposable FLEX DB and two-hotel fixture
        run: |
          psql -X -v ON_ERROR_STOP=1 -f docs/flex/sql/0001_flex_control_plane_preview.sql
          psql -X -v ON_ERROR_STOP=1 -f docs/flex/sql/0002_flex_platform_identity_rls_preview.sql
          psql -X -v ON_ERROR_STOP=1 -f docs/flex/sql/0003_flex_price_version_guard_preview.sql
          psql -X -v ON_ERROR_STOP=1 -f docs/flex/sql/0004_flex_hotel_onboarding_preview.sql
          psql -X -v ON_ERROR_STOP=1 -f docs/flex/sql/0005_flex_deployment_attestation_preview.sql
          psql -X -v ON_ERROR_STOP=1 -f docs/flex/sql/0006_flex_agreements_subscription_preview.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/marina_flex_rls_isolation_contract.sql
      - name: Prove preview and lifecycle evidence cannot masquerade as payments
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/marina_flex_subscription_sql_contract.sql
