name: Admin Guest PIN and i18n CI

on:
  pull_request:
    paths:
      - "apps/admin/**"
      - "services/api/app/guest_pin_admin.py"
      - "services/api/app/app_entry.py"
      - "services/api/app/stays.py"
      - "scripts/admin_experience_contract_test.py"
      - ".github/workflows/admin-guest-pin-i18n-ci.yml"
  push:
    branches:
      - "fix/guest-pin-admin-i18n-20260902"
    paths:
      - "apps/admin/**"
      - "services/api/app/guest_pin_admin.py"
      - "services/api/app/app_entry.py"
      - "services/api/app/stays.py"
      - "scripts/admin_experience_contract_test.py"
      - ".github/workflows/admin-guest-pin-i18n-ci.yml"

jobs:
  contract-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile PIN router
        run: python -m py_compile services/api/app/guest_pin_admin.py services/api/app/app_entry.py
      - name: Run adversarial admin experience contract
        run: python scripts/admin_experience_contract_test.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - name: Install admin dependencies
        working-directory: apps/admin
        run: npm ci
      - name: Typecheck admin
        working-directory: apps/admin
        run: npm run typecheck
      - name: Build admin
        working-directory: apps/admin
        env:
          CORE_API_URL: http://127.0.0.1:8000
        run: npm run build
