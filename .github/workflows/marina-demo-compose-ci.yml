name: MARINA Local Demo Docker Compose CI

on:
  pull_request:
    paths:
      - 'compose.marina-demo.yaml'
      - 'deploy/marina-demo-api.Dockerfile'
      - 'deploy/marina-demo-migrate.Dockerfile'
      - 'scripts/marina_demo_seed.py'
      - 'scripts/marina_demo_start.sh'
      - 'scripts/marina_grid_browser_smoke.mjs'
      - 'scripts/marina_ordinary_booking_e2e.py'
      - '.github/workflows/marina-demo-compose-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marina-demo-compose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-local-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MARINA_DEMO_DB_PASSWORD: local_ci_synthetic_password_only
      MARINA_DEMO_OWNER_USERNAME: demo-owner
      MARINA_DEMO_OWNER_PASSWORD: Local-CI-Only-Synthetic-Owner-2026!
    steps:
      - uses: actions/checkout@v4
      - name: Verify shell and Python
        run: |
          bash -n scripts/marina_demo_start.sh
          python -m py_compile scripts/marina_demo_seed.py
      - name: Validate complete Compose deployment graph
        run: docker compose -f compose.marina-demo.yaml config --quiet
      - name: Build disposable demo services and start database, migrations, seed, API
        run: |
          docker compose -f compose.marina-demo.yaml up --build -d --wait
      - name: Verify synthetic API on compose network
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..45}; do
            if docker compose -f compose.marina-demo.yaml exec -T api python -c 'import json,urllib.request; data=json.load(urllib.request.urlopen("http://127.0.0.1:8000/health/ready", timeout=3)); assert data["property"]=="MARINA_DEMO" and data["room_count"]==12 and data["room_type_count"]==3' 2>/dev/null; then
              echo "MARINA_LOCAL_DEMO_DOCKER_PASS"
              exit 0
            fi
            sleep 2
          done
          docker compose -f compose.marina-demo.yaml ps
          docker compose -f compose.marina-demo.yaml logs --tail 60 api seed migrate
          exit 1
      - name: Verify browser entrypoints and private API proxy
        shell: bash
        run: |
          set -euo pipefail
          for port in 13000 13001 13002; do
            for i in {1..35}; do
              if curl -fsS "http://127.0.0.1:$port/" -o /dev/null; then break; fi
              sleep 2
            done
            curl -fsS "http://127.0.0.1:$port/" -o /dev/null
          done
          curl -fsS http://127.0.0.1:13001/core/health/live | grep -q 'marina-smart-core'
          echo "MARINA_ALL_UI_AND_API_PROXY_PASS"
      - name: Verify real OWNER login and interactive PMS grid in demo browser
        env:
          MARINA_ADMIN_BROWSER_URL: http://127.0.0.1:13001
          BOOTSTRAP_OWNER_USERNAME: ${{ env.MARINA_DEMO_OWNER_USERNAME }}
          BOOTSTRAP_OWNER_PASSWORD: ${{ env.MARINA_DEMO_OWNER_PASSWORD }}
        run: |
          npm install --no-audit --no-fund --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          node scripts/marina_grid_browser_smoke.mjs
      - name: Verify actual demo booking, price, overlap rejection and grid persistence
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f compose.marina-demo.yaml exec -T \
            -e MARINA_BOOKING_TEST_API=http://127.0.0.1:8000 \
            api python scripts/marina_ordinary_booking_e2e.py
      - name: Re-run demo without erasing or rotating owner credentials
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f compose.marina-demo.yaml up -d --build --wait
          docker compose -f compose.marina-demo.yaml exec -T api python -c 'import json, urllib.request; r=json.load(urllib.request.urlopen("http://127.0.0.1:8000/health/ready")); assert r["room_count"]==12'
      - name: Diagnostics on failure
        if: failure()
        run: docker compose -f compose.marina-demo.yaml ps && docker compose -f compose.marina-demo.yaml logs --tail 90 api seed migrate postgres
      - name: Teardown disposable demo
        if: always()
        run: docker compose -f compose.marina-demo.yaml down -v --remove-orphans
