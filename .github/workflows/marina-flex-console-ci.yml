name: MARINA FLEX Console Read-Only CI
on:
  pull_request:
    paths:
      # Release candidate gate: every FLEX change must check the SAME head SHA.
      - ".github/workflows/marina-flex-*.yml"
      - "apps/flex-console/**"
      - "apps/flex-api-qa/**"
      - "docs/flex/**"
      - "services/api/app/flex_*.py"
      - "scripts/marina_flex_*"
      - "apps/flex-console/**"
      - "docs/flex/ui/**"
      - "scripts/marina_flex_release_scope_guard.py"
      - ".github/workflows/marina-flex-console-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-console:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned FLEX Console auth dependencies
        working-directory: apps/flex-console
        run: npm install --ignore-scripts --no-fund --no-audit
      - name: Generate isolated Better Auth + TOTP SQL for review (never apply)
        working-directory: apps/flex-console
        env:
          FLEX_AUTH_SCHEMA_DRY_RUN: "true"
          BETTER_AUTH_SECRET: "github-ci-only-test-secret-not-for-deployment-123456789"
        run: |
          npx --yes auth@1.7.27 generate --config auth/schema-config.mjs --output /tmp/flex-auth-schema.sql --yes
          test -s /tmp/flex-auth-schema.sql
          echo "FLEX_AUTH_SCHEMA_GENERATED"
          cat /tmp/flex-auth-schema.sql
      - name: Syntax + isolated HTTP security tests
        working-directory: apps/flex-console
        run: npm run check
      - name: FLEX-only cumulative additive guard self-test
        run: python3 scripts/marina_flex_release_scope_guard.py --self-test
      - name: Console cannot modify hotel PMS
        shell: bash
        run: |
          if git diff --name-only "origin/main"...HEAD | grep -Eq '^(apps/(admin|staff|mobile|web)/|packages/database/|services/api/app/main\.py)'; then
            echo 'Forbidden operational PMS change'
            exit 1
          fi
          echo 'PASS: operational PMS is unchanged'
