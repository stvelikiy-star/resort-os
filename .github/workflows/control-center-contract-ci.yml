name: Control Center Monorepo Contract CI

on:
  pull_request:
    paths:
      - 'package.json'
      - 'control-center-verify.mjs'
      - 'apps/**'
      - 'services/api/app/**'
      - 'scripts/**'
      - '.github/workflows/control-center-contract-ci.yml'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'control-center-verify.mjs'
      - 'apps/**'
      - 'services/api/app/**'
      - 'scripts/**'
      - '.github/workflows/control-center-contract-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install application dependencies
        run: |
          set -euo pipefail
          npm --prefix apps/admin install --no-audit --no-fund
          npm --prefix apps/web install --no-audit --no-fund
          npm --prefix apps/staff install --no-audit --no-fund

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run repository-owned Stage 01B verification contract
        run: npm test

      - name: Prove trusted manifest drift fails closed
        run: |
          set -euo pipefail
          backup="$(mktemp)"
          log="$(mktemp)"
          cp apps/admin/package.json "$backup"
          trap 'cp "$backup" apps/admin/package.json; rm -f "$backup" "$log"' EXIT
          printf '\n' >> apps/admin/package.json
          set +e
          npm test >"$log" 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -F 'trusted package manifest drift: apps/admin/package.json' "$log"
