name: MARINA FLEX Signed QA Settlement

on:
  pull_request:
    paths:
      - "services/api/app/flex_qa_payment.py"
      - "services/api/app/flex_qa_settlement.py"
      - "docs/flex/sql/0009_flex_signed_qa_settlement_preview.sql"
      - "scripts/marina_flex_signed_qa_settlement_e2e.py"
      - "scripts/marina_flex_qa_settlement_fixture.sql"
      - ".github/workflows/marina-flex-signed-qa-settlement-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-ci-payment:
    name: FLEX signed sandbox evidence to isolated PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: flex_ci
          POSTGRES_USER: flex_ci
          POSTGRES_PASSWORD: flex_ci_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flex_ci -d flex_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: flex_ci
      PGPASSWORD: flex_ci_ci_only
      PGDATABASE: flex_ci
      FLEX_SETTLEMENT_MODE: CI_DISPOSABLE_ONLY
      FLEX_DATABASE_URL: postgresql://flex_qa_runtime_ci:flex_ci_runtime_only@localhost:5432/flex_ci
      FLEX_TEST_DB_OWNER_URL: postgresql://flex_ci:flex_ci_ci_only@localhost:5432/flex_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated FLEX CI dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          python -m pip install --disable-pip-version-check -r services/api/requirements-flex-control.txt
      - name: Compile and check simulation isolation
        run: |
          python -m py_compile services/api/app/flex_qa_payment.py services/api/app/flex_qa_settlement.py scripts/marina_flex_signed_qa_settlement_e2e.py
      - name: Bootstrap only ephemeral FLEX commercial schema and fixtures
        run: |
          for f in \
            0001_flex_control_plane_preview.sql \
            0002_flex_platform_identity_rls_preview.sql \
            0003_flex_price_version_guard_preview.sql \
            0004_flex_hotel_onboarding_preview.sql \
            0005_flex_deployment_attestation_preview.sql \
            0006_flex_agreements_subscription_preview.sql \
            0007_flex_invoice_ledger_preview.sql \
            0008_flex_refund_reconciliation_preview.sql \
            0009_flex_signed_qa_settlement_preview.sql; do
            psql -X -v ON_ERROR_STOP=1 -f "docs/flex/sql/$f"
          done
          psql -X -v ON_ERROR_STOP=1 -f scripts/marina_flex_rls_isolation_contract.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/marina_flex_qa_settlement_fixture.sql
      - name: Create least-privilege NOINHERIT ephemeral database client
        run: |
          psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE flex_qa_runtime_ci LOGIN PASSWORD 'flex_ci_runtime_only' NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE"
          psql -X -v ON_ERROR_STOP=1 -c "GRANT flex_qa_settlement_writer TO flex_qa_runtime_ci WITH INHERIT FALSE, SET TRUE"
          psql -X -v ON_ERROR_STOP=1 -c "SELECT 1 / CASE WHEN NOT pg_has_role('flex_qa_runtime_ci','flex_qa_settlement_writer','USAGE') THEN 1 ELSE 0 END"
      - name: Verify signed amounts, retries, two-hotel isolation and denial
        run: python scripts/marina_flex_signed_qa_settlement_e2e.py
      - name: Verify no operational hotel tables or production provider receipts
        run: |
          count="$(psql -X -Atqc "SELECT count(*) FROM pg_tables WHERE schemaname='public' AND tablename IN ('guests','reservations','properties','folio')")"
          test "$count" = "0"
          count="$(psql -X -Atqc "SELECT count(*) FROM flex_confirmed_payments WHERE provider!='FLEX_QA_SIMULATOR'")"
          test "$count" = "0"
