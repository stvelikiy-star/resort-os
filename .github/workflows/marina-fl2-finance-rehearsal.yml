name: MARINA FL2 Finance Combined Rehearsal

on:
  push:
    branches:
      - integration/marina-fl2-finance-design-candidate-20261116

permissions:
  contents: read

jobs:
  combined:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build ephemeral two-parent merge with design-conflict preference
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MARINA integration rehearsal"
          git config user.email "marina-rehearsal@users.noreply.github.com"
          git fetch --no-tags origin refs/heads/fix/marina-owner-finance-refresh-fl2-20261116:refs/remotes/origin/finance-audit
          git merge -X ours --no-commit --no-ff origin/finance-audit
          if test -n "$(git diff --name-only --diff-filter=U)"; then
            echo "ERROR: unresolved conflicts"; git diff --name-only --diff-filter=U; exit 1
          fi
          git diff --cached --name-only > combined-files.txt
          echo "Rehearsal only. No merge commit/push/deploy."
          cat combined-files.txt
          test -f apps/mobile/src/components/OwnerExpenses.tsx
          test -f services/api/app/owner_kitchen_reconciliation.py
          test -f apps/staff/public/marina-smart-approved.png
          grep -q 'marina-smart-approved.png' apps/staff/app/manifest.ts
          grep -q 'onCommitted' apps/mobile/src/components/OwnerExpenses.tsx
          grep -q 'refreshFinancialSnapshots' apps/mobile/app/finance.tsx
          grep -q 'AUTH_TRUST_PROXY_HEADERS' services/api/app/public_ai_admin.py || grep -q '_client_ip' services/api/app/public_ai_admin.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/mobile/package-lock.json
            apps/admin/package-lock.json
      - name: Mobile combined dependencies
        working-directory: apps/mobile
        run: npm ci --ignore-scripts
      - name: Mobile combined typecheck
        working-directory: apps/mobile
        run: npm run typecheck
      - name: Mobile combined Jest regression
        working-directory: apps/mobile
        run: npm test -- --runInBand --silent
      - name: Admin combined dependencies
        working-directory: apps/admin
        run: npm ci --ignore-scripts
      - name: Admin combined typecheck
        working-directory: apps/admin
        run: npm run typecheck
      - name: Combined rehearsal inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marina-fl2-finance-combined-files
          path: combined-files.txt
          if-no-files-found: warn
