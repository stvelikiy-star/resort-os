name: MARINA SMART AK BERMET CI

on:
  pull_request:
    paths:
      - 'services/api/**'
      - 'packages/database/**'
      - 'apps/admin/**'
      - 'apps/staff/**'
      - 'apps/web/**'
      - 'data-marina/**'
      - 'scripts/bootstrap_ak_bermet_test.py'
      - 'scripts/verify_marina_client_cycle.py'
      - 'scripts/verify_marina_ai_role_runtime.py'
      - 'scripts/ak_bermet_grid_browser.mjs'
      - 'scripts/admin_full_navigation_browser.mjs'
      - 'scripts/public_i18n_guard.py'
      - 'deploy/ak-bermet-test-api.Dockerfile'
      - 'compose.ak-bermet-test.yaml'
      - '.github/workflows/marina-smart-ak-bermet-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marina-smart-ak-bermet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ak-bermet:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ak_bermet_marina_ci
          POSTGRES_USER: marina_ci
          POSTGRES_PASSWORD: marina_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marina_ci -d ak_bermet_marina_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://marina_ci:marina_ci_password@127.0.0.1:5432/ak_bermet_marina_ci?schema=public
      PROPERTY_CODE: AK_BERMET_TEST
      MARINA_PROPERTY_NAME: AK BERMET · MARINA SMART TEST
      RATE_PLAN_CODE: AKB_DIRECT_2026
      CORE_API_URL: http://127.0.0.1:8000
      ADMIN_BASE_URL: http://127.0.0.1:3001
      GUEST_OS_PUBLIC_BASE_URL: http://127.0.0.1:8000
      EXPECTED_GUEST_BASE_URL: http://127.0.0.1:8000
      BOOTSTRAP_OWNER_USERNAME: akb-ci-owner
      BOOTSTRAP_OWNER_PASSWORD: AKB-CI-Owner-Strong-2026
      BOOTSTRAP_OWNER_DISPLAY_NAME: AK BERMET CI Owner
      APP_ENV: staging
      RECEPTION_USERNAME: akb-ci-admin
      RECEPTION_PASSWORD: AKB-CI-Admin-Strong-2026
      RECEPTION_DISPLAY_NAME: AK BERMET CI Administrator
      MAID_USERNAME: akb-ci-housemaid
      MAID_PASSWORD: AKB-CI-Housemaid-2026
      MAID_DISPLAY_NAME: AK BERMET CI Housemaid
      DINING_STAFF_USERNAME: akb-ci-kitchen
      DINING_STAFF_PASSWORD: AKB-CI-Kitchen-2026
      DINING_STAFF_DISPLAY_NAME: AK BERMET CI Kitchen
      KITCHEN_USERNAME: akb-ci-kitchen
      KITCHEN_PASSWORD: AKB-CI-Kitchen-2026
      WAITER_USERNAME: akb-ci-waiter
      WAITER_PASSWORD: AKB-CI-Waiter-2026
      WAITER_DISPLAY_NAME: AK BERMET CI Waiter
      TECHNICIAN_USERNAME: akb-ci-technician
      TECHNICIAN_PASSWORD: AKB-CI-Technician-2026
      TECHNICIAN_DISPLAY_NAME: AK BERMET CI Technician
      AGENT_USERNAME: akb-ci-agent
      AGENT_PASSWORD: AKB-CI-Agent-2026
      AGENT_DISPLAY_NAME: AK BERMET CI Agent
      BOOKING_AGENT_NAME: AK BERMET CI Agency
      COOKIE_SECURE: false
      REQUIRE_COOKIE_DOMAIN: false
      AUTH_TRUST_PROXY_HEADERS: false
      REQUIRE_AUTOMATION_SERVICE: false
      ENABLE_PAYMENT_OPERATIONS: false
      ENABLE_SERVICE_POINT_QR: false
      ENABLE_MKASSA: false
      EXPECTED_ROOM_COUNT: '169'
      EXPECTED_ROOM_TYPE_COUNT: '16'
      EXPECTED_CLEAN_ROOM_COUNT: '137'
      EXPECTED_BLOCKED_ROOM_COUNT: '32'
      EXPECTED_PUBLIC_AVAILABLE_COUNT: '137'
      EXPECTED_ROOM_TYPE_CODES: ''

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            packages/database/package-lock.json
            apps/admin/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/requirements.txt

      - name: Validate compose contract
        env:
          AKB_TEST_DB_PASSWORD: ci-db-password
          AKB_TEST_AUTOMATION_KEY: ci-automation-key
          AKB_TEST_STAFF_PASSWORD: AKB-CI-Shared-Strong-2026
        run: docker compose -f compose.ak-bermet-test.yaml config >/tmp/akb-compose.rendered.yml

      - name: Apply clean database migrations
        working-directory: packages/database
        run: |
          npm ci --no-audit --no-fund
          npx prisma validate
          npx prisma migrate deploy
          npx prisma migrate status

      - name: Install Core and compile Python
        run: |
          pip install -r services/api/requirements.txt
          python -m compileall -q services/api/app scripts

      - name: Bootstrap exact AK BERMET inventory and staff
        run: |
          python scripts/bootstrap_ak_bermet_test.py
          python scripts/bootstrap_owner.py
          python scripts/bootstrap_staging_staff.py

      - name: Verify AK BERMET database truth before runtime
        run: |
          python - <<'PY'
          import asyncio, os
          import asyncpg

          async def main():
              conn = await asyncpg.connect(os.environ["DATABASE_URL"].split("?")[0])
              try:
                  row = await conn.fetchrow(
                      """
                      SELECT p.name,
                             (SELECT count(*)::int FROM rooms r WHERE r."propertyId"=p.id) rooms,
                             (SELECT count(*)::int FROM rooms r WHERE r."propertyId"=p.id AND r."operationalState"='CLEAN') clean,
                             (SELECT count(*)::int FROM rooms r WHERE r."propertyId"=p.id AND r."operationalState"='TECH_BLOCK') blocked,
                             (SELECT count(*)::int FROM room_types rt WHERE rt."propertyId"=p.id) room_types
                      FROM properties p WHERE p.code=$1
                      """,
                      os.environ["PROPERTY_CODE"],
                  )
                  assert row
                  assert row["rooms"] == 169, row
                  assert row["clean"] == 137, row
                  assert row["blocked"] == 32, row
                  assert row["room_types"] == 16, row
                  print("AK_BERMET_DB_TRUTH_PASS", dict(row))
              finally:
                  await conn.close()

          asyncio.run(main())
          PY

      - name: Verify MARINA AI role-scoped runtime context
        run: python scripts/verify_marina_ai_role_runtime.py

      - name: Verify MARINA public brand and RU/KG/KZ/EN contract
        run: python scripts/public_i18n_guard.py

      - name: Build Admin
        working-directory: apps/admin
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Install Playwright Chromium
        working-directory: apps/admin
        run: |
          npm install --no-audit --no-fund --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Expose Playwright to repository browser tests
        run: ln -s apps/admin/node_modules node_modules

      - name: Start Core and Admin
        run: |
          python -m uvicorn app.app_entry:app --app-dir services/api --host 127.0.0.1 --port 8000 >/tmp/akb-core.log 2>&1 &
          echo $! >/tmp/akb-core.pid
          (cd apps/admin && nohup npm run start >/tmp/akb-admin.log 2>&1 & echo $! >/tmp/akb-admin.pid)
          for i in $(seq 1 60); do
            if curl --fail -sS http://127.0.0.1:8000/health/ready >/tmp/ready.json 2>/dev/null               && curl --fail -sS http://127.0.0.1:3001/ >/tmp/admin.html 2>/dev/null; then
              cat /tmp/ready.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/akb-core.log || true
          cat /tmp/akb-admin.log || true
          exit 1

      - name: Browser acceptance — AK BERMET 169-room chessboard
        run: node scripts/ak_bermet_grid_browser.mjs

      - name: Browser acceptance — all owner navigation
        run: node scripts/admin_full_navigation_browser.mjs

      - name: Full AK BERMET MARINA client and role cycle
        run: python scripts/verify_marina_client_cycle.py

      - name: Diagnostics on failure
        if: failure()
        run: |
          cat /tmp/akb-core.log 2>/dev/null || true
          cat /tmp/akb-admin.log 2>/dev/null || true

      - name: Stop services
        if: always()
        run: |
          if [ -f /tmp/akb-admin.pid ]; then kill "$(cat /tmp/akb-admin.pid)" 2>/dev/null || true; fi
          if [ -f /tmp/akb-core.pid ]; then kill "$(cat /tmp/akb-core.pid)" 2>/dev/null || true; fi
