name: Export Real Admin Mac Package

on:
  push:
    branches:
      - package/real-admin-mac-20260908

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout package branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify accepted product boundary exists
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e ac1a45e4cf3ef0e40a7fea6be75c81999e9af0b4^{commit}
          test -f apps/admin/package.json
          test -f services/api/Dockerfile
          test -f packages/database/prisma/schema.prisma
          test -f compose.staging.yaml
          test -f RUN_REAL_ADMIN_MAC.sh
          test -f .env.real-admin
          echo "accepted_product_sha=ac1a45e4cf3ef0e40a7fea6be75c81999e9af0b4"

      - name: Build real Resort OS source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive \
            --format=zip \
            --prefix=THREE_CROWNS_REAL_ADMIN_0.62.2/ \
            --output=dist/THREE_CROWNS_REAL_ADMIN_0.62.2_MAC.zip \
            HEAD
          sha256sum dist/THREE_CROWNS_REAL_ADMIN_0.62.2_MAC.zip > dist/THREE_CROWNS_REAL_ADMIN_0.62.2_MAC.zip.sha256
          unzip -l dist/THREE_CROWNS_REAL_ADMIN_0.62.2_MAC.zip | grep 'apps/admin/package.json'
          unzip -l dist/THREE_CROWNS_REAL_ADMIN_0.62.2_MAC.zip | grep 'services/api/Dockerfile'
          unzip -l dist/THREE_CROWNS_REAL_ADMIN_0.62.2_MAC.zip | grep 'packages/database/prisma/schema.prisma'
          unzip -l dist/THREE_CROWNS_REAL_ADMIN_0.62.2_MAC.zip | grep 'RUN_REAL_ADMIN_MAC.sh'

      - name: Upload actual Resort OS package
        uses: actions/upload-artifact@v4
        with:
          name: THREE_CROWNS_REAL_ADMIN_0.62.2_MAC
          path: |
            dist/THREE_CROWNS_REAL_ADMIN_0.62.2_MAC.zip
            dist/THREE_CROWNS_REAL_ADMIN_0.62.2_MAC.zip.sha256
          if-no-files-found: error
          retention-days: 7
