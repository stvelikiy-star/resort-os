name: No Payment Launch Profile CI

on:
  pull_request:
    paths:
      - '.env.production.example'
      - 'compose.production.yaml'
      - 'services/api/app/app_entry.py'
      - 'services/api/app/runtime_capabilities.py'
      - 'services/api/app/booking_admin.py'
      - 'services/api/app/reservation_payments.py'
      - 'services/api/app/service_point_payments.py'
      - 'services/api/app/mkassa_payment_bridge.py'
      - 'apps/admin/components/ReservationFolioPanel.tsx'
      - 'scripts/no_payment_launch_profile_contract_test.py'
      - '.github/workflows/no-payment-launch-profile-ci.yml'
  push:
    branches:
      - main
    paths:
      - '.env.production.example'
      - 'compose.production.yaml'
      - 'services/api/app/app_entry.py'
      - 'services/api/app/runtime_capabilities.py'
      - 'services/api/app/booking_admin.py'
      - 'services/api/app/reservation_payments.py'
      - 'services/api/app/service_point_payments.py'
      - 'services/api/app/mkassa_payment_bridge.py'
      - 'apps/admin/components/ReservationFolioPanel.tsx'
      - 'scripts/no_payment_launch_profile_contract_test.py'
      - '.github/workflows/no-payment-launch-profile-ci.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    env:
      ENABLE_PAYMENT_OPERATIONS: false
      ENABLE_SERVICE_POINT_QR: false
      ENABLE_MKASSA: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: services/api/requirements.txt
      - name: Install Core dependencies
        run: pip install -r services/api/requirements.txt
      - name: Compile changed Core modules
        run: |
          python -m py_compile services/api/app/app_entry.py services/api/app/runtime_capabilities.py
      - name: Guard launch profile
        run: python scripts/no_payment_launch_profile_contract_test.py
      - name: Verify active no-payment route surface
        env:
          PYTHONPATH: services/api
        run: |
          python - <<'PY'
          from app.app_entry import app

          routes = {
              (method, route.path)
              for route in app.routes
              for method in (getattr(route, "methods", None) or set())
          }
          tags = {
              tag
              for route in app.routes
              for tag in (getattr(route, "tags", None) or [])
          }

          blocked_routes = {
              ("POST", "/api/v1/admin/booking/requests/{request_id}/confirm-payment"),
              ("POST", "/api/v1/admin/booking/reservations/{reservation_id}/payments"),
          }
          leaked = sorted(blocked_routes & routes)
          assert not leaked, f"payment mutation routes leaked into FULL_NO_PAYMENTS: {leaked}"

          blocked_tags = {
              "admin-reservation-payments",
              "admin-service-point-payments",
              "service-point-payments",
              "service-point-payment-integrations",
          }
          leaked_tags = sorted(blocked_tags & tags)
          assert not leaked_tags, f"payment router tags leaked into FULL_NO_PAYMENTS: {leaked_tags}"

          required = {
              ("GET", "/api/v1/admin/booking/requests"),
              ("GET", "/api/v1/runtime/capabilities"),
          }
          missing = sorted(required - routes)
          assert not missing, f"required operational routes missing: {missing}"
          print("ACTIVE_NO_PAYMENT_ROUTE_SURFACE=PASS")
          PY
      - name: Validate production compose syntax
        run: docker compose --env-file .env.production.example -f compose.production.yaml config >/dev/null
