name: WebSocket Origin Security CI

on:
  pull_request:
    paths:
      - 'services/api/app/websocket_security.py'
      - 'services/api/app/realtime.py'
      - 'services/api/app/dining_realtime.py'
      - 'scripts/websocket_origin_security_test.py'
      - '.github/workflows/websocket-origin-security-ci.yml'
  push:
    branches: [main]
    paths:
      - 'services/api/app/websocket_security.py'
      - 'services/api/app/realtime.py'
      - 'services/api/app/dining_realtime.py'
      - 'scripts/websocket_origin_security_test.py'
      - '.github/workflows/websocket-origin-security-ci.yml'

permissions:
  contents: read

jobs:
  websocket-origin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: services/api/requirements.txt
      - name: Install API dependencies
        run: pip install -r services/api/requirements.txt
      - name: Compile WebSocket security modules
        run: python -m py_compile services/api/app/websocket_security.py services/api/app/realtime.py services/api/app/dining_realtime.py scripts/websocket_origin_security_test.py
      - name: Run real ASGI WebSocket origin handshake tests
        env:
          PYTHONPATH: services/api
        run: python scripts/websocket_origin_security_test.py
