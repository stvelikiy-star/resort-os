name: Owner Control V2 CI

on:
  pull_request:
    paths:
      - 'services/api/app/owner_pace.py'
      - 'services/api/app/app_entry.py'
      - 'services/api/app/service_auth.py'
      - 'packages/database/prisma/schema.prisma'
      - 'packages/database/prisma/migrations/3_owner_analytics_snapshots/**'
      - 'packages/database/prisma/migrations/6_service_point_qr_operations/**'
      - 'apps/admin/components/OwnerControlV2.tsx'
      - 'apps/admin/components/DashboardBoard.tsx'
      - 'apps/admin/app/owner-control-v2.css'
      - 'apps/admin/app/layout.tsx'
      - 'automation/n8n/owner-analytics-daily-snapshot.json'
      - 'scripts/release_contract.py'
      - 'scripts/verify_owner_control_v2.py'
      - '.github/workflows/owner-control-v2-ci.yml'
  push:
    branches: [main]
    paths:
      - 'services/api/app/owner_pace.py'
      - 'services/api/app/app_entry.py'
      - 'packages/database/prisma/schema.prisma'
      - 'packages/database/prisma/migrations/3_owner_analytics_snapshots/**'
      - 'packages/database/prisma/migrations/6_service_point_qr_operations/**'
      - 'apps/admin/components/OwnerControlV2.tsx'
      - 'automation/n8n/owner-analytics-daily-snapshot.json'
      - 'scripts/release_contract.py'
      - 'scripts/verify_owner_control_v2.py'
      - '.github/workflows/owner-control-v2-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owner-control-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: resort_os
          POSTGRES_USER: resort
          POSTGRES_PASSWORD: resort
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resort -d resort_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://resort:resort@localhost:5432/resort_os?schema=public
      PROPERTY_CODE: THREE_CROWNS
      RATE_PLAN_CODE: DIRECT_2026_27
      COOKIE_SECURE: false
      AUTOMATION_SERVICE_KEY: owner-control-v2-ci-service-key
      AUTOMATION_SERVICE_NAME: owner-control-v2-ci
      BOOTSTRAP_OWNER_USERNAME: ci-owner
      BOOTSTRAP_OWNER_PASSWORD: CI-Owner-Strong-Password-2026
      BOOTSTRAP_OWNER_DISPLAY_NAME: CI Owner

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate canonical database chain
        working-directory: packages/database
        run: |
          npm install --no-audit --no-fund
          npx prisma validate
          npx prisma migrate deploy
          npx prisma migrate status
          test -s prisma/migrations/6_service_point_qr_operations/migration.sql

      - name: Typecheck and build Owner Control UI
        working-directory: apps/admin
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: services/api/requirements.txt

      - name: Install and compile Core
        run: |
          pip install -r services/api/requirements.txt
          python -m compileall services/api/app scripts/verify_owner_control_v2.py
          python -m json.tool automation/n8n/owner-analytics-daily-snapshot.json >/dev/null

      - name: Seed Three Crowns and bootstrap OWNER
        run: |
          python scripts/seed_from_intake.py
          python scripts/bootstrap_owner.py

      - name: Start Resort Core
        run: |
          python -m uvicorn app.app_entry:app --app-dir services/api --host 127.0.0.1 --port 8000 > /tmp/owner-control-v2-api.log 2>&1 &
          for i in {1..30}; do
            curl --fail -sS http://127.0.0.1:8000/health/ready >/tmp/ready.json 2>/dev/null && break
            if [ "$i" = "30" ]; then cat /tmp/owner-control-v2-api.log; exit 1; fi
            sleep 1
          done

      - name: Run Owner Control V2 E2E
        run: python scripts/verify_owner_control_v2.py

      - name: Show Core logs on failure
        if: failure()
        run: cat /tmp/owner-control-v2-api.log || true
