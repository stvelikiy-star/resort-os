name: MARINA Mobile Expo Scoped Security Candidate
on:
  push:
    branches:
      - 'fix/marina-mobile-expo-security-deps-20261103'
    paths:
      - '.github/workflows/marina-mobile-expo-security-candidate.yml'
permissions:
  contents: read
jobs:
  pinned-expo-security-candidate:
    name: Generate compatible lockfile only after successful mobile tests
    if: github.repository == 'stvelikiy-star/resort-os'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - name: Apply scoped overrides in isolated dependency branch
        run: |
          npm pkg set 'overrides.@expo/cli.glob=^14.0.2' 'overrides.@expo/config.glob=^14.0.2' 'overrides.@expo/config-plugins.glob=^14.0.2' 'overrides.@expo/fingerprint.glob=^14.0.2' 'overrides.@expo/fingerprint.minimatch=^11.0.1' 'overrides.@expo/metro-config.glob=^14.0.2'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Prove mobile SDK and application compatibility
        run: |
          npm ci --no-audit --no-fund
          npx expo install --check
          node scripts/verify-backend-contract.mjs
          npm run typecheck
          npm run lint
          npm test -- --ci --runInBand
          npm run web:export
      - name: Print current security exposure
        run: |
          npm audit --omit=dev --json > /tmp/marina-mobile-expo-audit-after.json || true
          node -e "const a=require('/tmp/marina-mobile-expo-audit-after.json'); console.log('SCOPED_AUDIT:',JSON.stringify(a.metadata?.vulnerabilities ?? {}))"
      - name: Commit reviewed-scope dependency resolution to isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git diff --stat -- package.json package-lock.json
          if git diff --quiet -- package.json package-lock.json; then
            echo 'No dependency changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'security(mobile): pin scoped Expo tooling glob/minimatch patches'
          git push origin HEAD:"${GITHUB_REF_NAME}"
