name: MARINA Shared Staff P0 Two-Hotel Lifecycle CI

on:
  pull_request:
    paths:
      - 'scripts/marina_shared_staff_lifecycle_ci.py'
      - 'services/api/app/staff_control.py'
      - 'services/api/app/auth.py'
      - 'services/api/app/shared_auth_preview.py'
      - 'scripts/marina_shared_owner_finance_p0_ci.py'
      - 'services/api/app/reservation_payments.py'
      - 'scripts/marina_shared_manual_refund_evidence_ci.py'
      - 'scripts/marina_shared_kitchen_cost_truth_ci.py'
      - 'services/api/app/owner_accrual_readiness.py'
      - 'services/api/app/owner_served_kitchen_cost_trace.py'
      - 'scripts/test_owner_served_kitchen_cost_trace.py'
      - 'scripts/marina_shared_served_cost_trace_ci.py'
      - 'scripts/marina_shared_batch_allocation_ci.py'
      - 'scripts/marina_owner_accounting_decision_ci.py'
      - 'scripts/test_owner_accounting_decision_evidence.py'
      - 'services/api/app/owner_accounting_journal.py'
      - 'packages/database/prisma/migrations/zz128_marina_owner_accounting_decision_evidence_20261124/migration.sql'
      - 'services/api/app/kitchen_batch_allocation.py'
      - 'services/api/app/owner_served_kitchen_cost_trace.py'
      - 'packages/database/prisma/migrations/zz127_marina_served_batch_allocation_20261124/migration.sql'
      - 'services/api/app/section_permissions.py'
      - '.github/workflows/marina-shared-staff-lifecycle-p0-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-hotel-staff-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: marina_shared_browser_ci
          POSTGRES_USER: marina_ci
          POSTGRES_PASSWORD: synthetic-ci-database-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U marina_ci -d marina_shared_browser_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://marina_ci:synthetic-ci-database-only@127.0.0.1:5432/marina_shared_browser_ci?schema=public
      APP_ENV: staging
      PROPERTY_CODE: MARINA_BROWSER_CI
      RATE_PLAN_CODE: MARINA_BROWSER_CI
      MARINA_TENANT_CONTEXT_ENABLED: 'true'
      MARINA_SHARED_AUTH_PREVIEW_ENABLED: 'true'
      MARINA_SHARED_BROWSER_CI_CONFIRM: DISPOSABLE_TWO_HOTEL_BROWSER_CI
      COOKIE_SECURE: 'true'
      AUTH_TRUST_PROXY_HEADERS: 'false'
      ENABLE_PAYMENT_OPERATIONS: 'false'
      ENABLE_MKASSA: 'false'
      ENABLE_SERVICE_POINT_QR: 'false'
      PYTHONPATH: services/api:scripts
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin exact PR HEAD and create local-only synthetic owner password
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          pwd="synthetic-ci-only-$(openssl rand -hex 24)"
          echo "::add-mask::$pwd"
          echo "MARINA_SHARED_BROWSER_CI_PASSWORD=$pwd" >> "$GITHUB_ENV"
      - name: Verify immutable historical RC3 and reviewed additive migrations
        run: python scripts/marina_rc3_additive_gate.py
      - name: Apply existing Prisma migrations to disposable empty PostgreSQL
        working-directory: packages/database
        run: |
          npm ci --no-audit --no-fund
          npx prisma migrate deploy
      - name: Install canonical FastAPI dependencies
        run: python -m pip install -r services/api/requirements.txt
      - name: Verify role ceilings including all 12 server enum identities
        run: python -m unittest discover -s scripts -p 'test_marina_shared_auth_role_ceiling.py' -v
      - name: Seed TWO unrelated synthetic hotel owners and 12 server roles each
        run: python scripts/marina_shared_live_browser_db.py seed
      - name: Verify full real two-hotel staff creation and revocation contract
        run: python scripts/marina_shared_staff_lifecycle_ci.py
      - name: Verify two-hotel OWNER expenses, settlements and financial truth
        env:
          MARINA_SHARED_FINANCE_P0_CI_CONFIRM: ISOLATED_OWNER_FINANCE_CI_ONLY
        run: python scripts/marina_shared_owner_finance_p0_ci.py
      - name: Verify OWNER-only refund evidence without external money movement
        env:
          MARINA_REFUND_EVIDENCE_CI_CONFIRM: ISOLATED_REFUND_EVIDENCE_ONLY
          MARINA_SHARED_RECEPTION_CASH_P0_ENABLED: 'true'
          MARINA_SHARED_RECEPTION_CASH_P0_CONFIRM: REVIEWED_RECEPTION_CASH_STAGING_ONLY
        run: python scripts/marina_shared_manual_refund_evidence_ci.py
      - name: Verify two-hotel inventory spoilage cost and non-recognized profit
        env:
          MARINA_KITCHEN_COST_CI_CONFIRM: ISOLATED_KITCHEN_COST_ONLY
        run: python scripts/marina_shared_kitchen_cost_truth_ci.py
      - name: Check day/menu production cost candidates, not recognized COGS
        run: python -m unittest scripts.test_owner_served_kitchen_cost_trace -v
      - name: Verify actual two-hotel production targets and served dish cost trace
        env:
          MARINA_SERVED_COST_TRACE_CI_CONFIRM: ISOLATED_SERVED_COST_TRACE_ONLY
        run: python scripts/marina_shared_served_cost_trace_ci.py
      - name: Verify precise operator-attested batch links on two live hotels
        env:
          MARINA_BATCH_ALLOCATION_CI_CONFIRM: ISOLATED_BATCH_ALLOCATION_ONLY
        run: python scripts/marina_shared_batch_allocation_ci.py
      - name: Verify accounting approval feature is fail-closed by default
        run: python -m unittest scripts.test_owner_accounting_decision_evidence -v
      - name: Verify independent OWNER accounting decisions without posting P&L
        env:
          MARINA_SHARED_AUTH_PREVIEW_ENABLED: 'false'
          PROPERTY_CODE: HOTEL_A
          MARINA_ACCOUNTING_DECISION_EVIDENCE_ENABLED: 'true'
        run: python scripts/marina_owner_accounting_decision_ci.py
