name: MARINA FLEX Foundation Contract

on:
  pull_request:
    paths:
      - "services/api/app/flex_foundation.py"
      - "scripts/marina_flex_foundation_contract_test.py"
      - "scripts/marina_flex_schema_contract_test.sql"
      - ".github/workflows/marina-flex-foundation-ci.yml"
      - "docs/flex/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flex-pure-domain:
    name: FLEX policy and financial invariants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile no-IO domain primitives
        run: python -m py_compile services/api/app/flex_foundation.py scripts/marina_flex_foundation_contract_test.py
      - name: Test entitlement policy and allocation math (no DB)
        run: python scripts/marina_flex_foundation_contract_test.py

  flex-postgres-preview:
    name: FLEX disposable PostgreSQL schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: flex_ci
          POSTGRES_USER: flex_ci
          POSTGRES_PASSWORD: flex_ci_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flex_ci -d flex_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: flex_ci
      PGPASSWORD: flex_ci_ci_only
      PGDATABASE: flex_ci
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Create fresh FLEX schema from preview SQL
        run: psql -X -v ON_ERROR_STOP=1 -f docs/flex/sql/0001_flex_control_plane_preview.sql
      - name: Verify relational and append-only invariants
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/marina_flex_schema_contract_test.sql
      - name: Confirm PMS tables were not introduced
        run: |
          count="$(psql -X -Atqc "SELECT count(*) FROM pg_tables WHERE schemaname='public' AND tablename IN ('properties','reservations','guests','payments')")"
          test "$count" = "0"
