name: Kitchen Operations CI

on:
  pull_request:
    paths:
      - 'packages/database/prisma/migrations/7_kitchen_operations/**'
      - 'services/api/app/kitchen.py'
      - 'services/api/app/kitchen_arrivals.py'
      - 'services/api/app/app_entry.py'
      - 'apps/staff/app/kitchen/**'
      - 'apps/staff/components/KitchenAdmin.tsx'
      - 'apps/staff/components/KitchenAdmin.module.css'
      - 'apps/staff/components/StaffRoleGateway.tsx'
      - 'scripts/verify_kitchen_operations.py'
      - '.github/workflows/kitchen-operations-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kitchen-operations:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: resort_os
          POSTGRES_USER: resort
          POSTGRES_PASSWORD: resort
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resort -d resort_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://resort:resort@localhost:5432/resort_os?schema=public
      PROPERTY_CODE: THREE_CROWNS
      RATE_PLAN_CODE: DIRECT_2026_27
      COOKIE_SECURE: 'false'
      BOOTSTRAP_OWNER_USERNAME: kitchen-ci-owner
      BOOTSTRAP_OWNER_PASSWORD: Kitchen-CI-Owner-Password-2026
      BOOTSTRAP_OWNER_DISPLAY_NAME: Kitchen CI Owner
      CORE_API_URL: http://127.0.0.1:8000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            packages/database/package-lock.json
            apps/staff/package-lock.json

      - name: Apply canonical migration chain
        working-directory: packages/database
        run: |
          npm install --no-audit --no-fund
          npx prisma validate
          npx prisma migrate deploy
          npx prisma migrate status

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/requirements.txt

      - name: Install and compile Resort Core
        run: |
          pip install -r services/api/requirements.txt
          python -m compileall services/api/app scripts/verify_kitchen_operations.py

      - name: Seed canonical hotel and owner
        run: |
          python scripts/seed_from_intake.py
          python scripts/bootstrap_owner.py

      - name: Typecheck and build Kitchen Admin host app
        working-directory: apps/staff
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Start Resort Core
        run: |
          python -m uvicorn app.app_entry:app --app-dir services/api --host 127.0.0.1 --port 8000 > /tmp/kitchen-api.log 2>&1 &
          echo $! > /tmp/kitchen-api.pid
          for i in {1..30}; do
            curl --fail -sS http://127.0.0.1:8000/health/ready >/tmp/ready.json 2>/dev/null && exit 0
            sleep 1
          done
          cat /tmp/kitchen-api.log || true
          exit 1

      - name: Run Kitchen Operations E2E
        run: python scripts/verify_kitchen_operations.py

      - name: Show Core logs on failure
        if: failure()
        run: cat /tmp/kitchen-api.log || true

      - name: Stop Core
        if: always()
        run: |
          if [ -f /tmp/kitchen-api.pid ]; then kill "$(cat /tmp/kitchen-api.pid)" 2>/dev/null || true; fi
