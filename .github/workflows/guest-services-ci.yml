name: Guest Services Center CI

on:
  pull_request:
    paths:
      - 'services/api/app/guest_services.py'
      - 'services/api/app/guest_requests.py'
      - 'services/api/app/staff_guest_requests.py'
      - 'services/api/app/app_entry.py'
      - 'packages/database/prisma/schema.prisma'
      - 'packages/database/prisma/migrations/**'
      - 'apps/admin/components/GuestServicesCenter.tsx'
      - 'apps/admin/components/AdminShell.tsx'
      - 'apps/admin/components/PMSGridV9.tsx'
      - 'apps/web/components/GuestRequestsPanel.tsx'
      - 'scripts/verify_guest_services_center.py'
      - 'scripts/upsert_staff_user.py'
      - '.github/workflows/guest-services-ci.yml'
  push:
    branches: [main]
    paths:
      - 'services/api/app/guest_services.py'
      - 'services/api/app/guest_requests.py'
      - 'services/api/app/staff_guest_requests.py'
      - 'services/api/app/app_entry.py'
      - 'packages/database/prisma/schema.prisma'
      - 'packages/database/prisma/migrations/**'
      - 'apps/admin/components/GuestServicesCenter.tsx'
      - 'apps/admin/components/AdminShell.tsx'
      - 'apps/admin/components/PMSGridV9.tsx'
      - 'apps/web/components/GuestRequestsPanel.tsx'
      - 'scripts/verify_guest_services_center.py'
      - 'scripts/upsert_staff_user.py'
      - '.github/workflows/guest-services-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guest-services-center:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: resort_os
          POSTGRES_USER: resort
          POSTGRES_PASSWORD: resort
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resort -d resort_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://resort:resort@localhost:5432/resort_os?schema=public
      PROPERTY_CODE: THREE_CROWNS
      RATE_PLAN_CODE: DIRECT_2026_27
      COOKIE_SECURE: false
      BOOTSTRAP_OWNER_USERNAME: ci-owner
      BOOTSTRAP_OWNER_PASSWORD: CI-Owner-Strong-Password-2026
      BOOTSTRAP_OWNER_DISPLAY_NAME: CI Owner
      RESORT_CORE_TEST_URL: http://127.0.0.1:8000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Prisma schema and clean migration chain
        working-directory: packages/database
        run: |
          npm install --no-audit --no-fund
          npx prisma validate
          npx prisma migrate deploy

      - name: Typecheck and build unified admin surface
        working-directory: apps/admin
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Typecheck and build Guest OS public surface
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: services/api/requirements.txt

      - name: Install and compile Resort Core and verifier
        run: |
          pip install -r services/api/requirements.txt
          python -m compileall services/api/app scripts/verify_guest_services_center.py scripts/upsert_staff_user.py

      - name: Seed Three Crowns and bootstrap OWNER
        run: |
          python scripts/seed_from_intake.py
          python scripts/bootstrap_owner.py

      - name: Prove current RBAC roles are reproducible by staff helper
        run: |
          STAFF_USERNAME=ci-reception STAFF_PASSWORD=CI-Reception-Password-2026 STAFF_DISPLAY_NAME='CI Reception' STAFF_ROLE=RECEPTION python scripts/upsert_staff_user.py
          STAFF_USERNAME=ci-dining STAFF_PASSWORD=CI-Dining-Password-2026 STAFF_DISPLAY_NAME='CI Dining' STAFF_ROLE=DINING_STAFF python scripts/upsert_staff_user.py
          STAFF_USERNAME=ci-store STAFF_PASSWORD=CI-Store-Password-2026 STAFF_DISPLAY_NAME='CI Store' STAFF_ROLE=STORE_STAFF python scripts/upsert_staff_user.py
          STAFF_USERNAME=ci-content STAFF_PASSWORD=CI-Content-Password-2026 STAFF_DISPLAY_NAME='CI Content' STAFF_ROLE=CONTENT_MANAGER python scripts/upsert_staff_user.py

      - name: Start Resort Core
        run: |
          python -m uvicorn app.app_entry:app --app-dir services/api --host 127.0.0.1 --port 8000 > /tmp/guest-services-center-api.log 2>&1 &
          echo $! > /tmp/guest-services-center-api.pid
          for i in {1..30}; do
            if curl --fail -sS http://127.0.0.1:8000/health/ready >/tmp/ready.json 2>/dev/null; then break; fi
            if [ "$i" = "30" ]; then cat /tmp/guest-services-center-api.log; exit 1; fi
            sleep 1
          done

      - name: Run unified Guest Services Center E2E
        run: python scripts/verify_guest_services_center.py

      - name: Show Core logs on failure
        if: failure()
        run: cat /tmp/guest-services-center-api.log || true

      - name: Stop Core
        if: always()
        run: |
          if [ -f /tmp/guest-services-center-api.pid ]; then kill "$(cat /tmp/guest-services-center-api.pid)" || true; fi
