name: MARINA FL2 Finance Publish Isolated Draft RC

on:
  push:
    branches:
      - integration/marina-fl2-finance-design-candidate-20261116

permissions:
  contents: write

jobs:
  publish-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Conflict-aware two-parent merge (approved FL2 wins overlapping hunks)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "MARINA SMART integration"
          git config user.email "marina-smart-integration@users.noreply.github.com"
          git fetch --no-tags origin refs/heads/fix/marina-owner-finance-refresh-fl2-20261116:refs/remotes/origin/finance-audit
          git merge -X ours --no-commit --no-ff origin/finance-audit
          test -z "$(git diff --name-only --diff-filter=U)"
          test -f services/api/app/owner_kitchen_reconciliation.py
          test -f services/api/app/owner_expenses.py
          test -f packages/database/prisma/migrations/zz122_marina_supplier_returns_20261116/migration.sql
          grep -q 'marina-smart-approved.png' apps/staff/app/manifest.ts
          grep -q 'onCommitted' apps/mobile/src/components/OwnerExpenses.tsx
          grep -q 'refreshFinancialSnapshots' apps/mobile/app/finance.tsx
          grep -q 'store: Package' apps/mobile/src/theme/moduleIcons.ts
          echo "Conflicting hunks preserved FL2 design; non-conflicting finance changes retained. Not yet production accepted."
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/mobile/package-lock.json
            apps/admin/package-lock.json
      - name: Mobile dependencies
        working-directory: apps/mobile
        run: npm ci --ignore-scripts
      - name: Mobile typecheck
        working-directory: apps/mobile
        run: npm run typecheck
      - name: Mobile Jest regression
        working-directory: apps/mobile
        run: npm test -- --runInBand --silent
      - name: Admin dependencies
        working-directory: apps/admin
        run: npm ci --ignore-scripts
      - name: Admin typecheck
        working-directory: apps/admin
        run: npm run typecheck
      - name: Commit and push ONLY separate integration draft branch
        shell: bash
        run: |
          set -euo pipefail
          target=integration/marina-fl2-finance-merged-rc-20261116
          expected=cebd609308596b81ad43271ddee2b958ae8799b4
          actual=$(git ls-remote origin "refs/heads/$target" | cut -f1)
          if [ "$actual" != "$expected" ]; then
            echo "Ref lease mismatch on draft branch; refusing push"; exit 1
          fi
          git -c user.name="MARINA SMART integration" -c user.email="marina-smart-integration@users.noreply.github.com" commit -m "integration(fl2): combine Future Luxury design and owner finance P0 on draft"
          git push origin "HEAD:refs/heads/$target"
          echo "Pushed combined Draft RC only to $target at $(git rev-parse HEAD)"
