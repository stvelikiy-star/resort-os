name: Guest OS Access CI

on:
  pull_request:
    paths:
      - 'services/api/app/guest_os.py'
      - 'services/api/app/app_entry.py'
      - 'services/api/app/stays.py'
      - 'services/api/requirements.txt'
      - 'apps/web/app/g/**'
      - 'apps/web/app/guest-os.css'
      - 'apps/web/components/GuestOsRuntime.tsx'
      - 'apps/web/lib/ownerApprovedGuestFacts.ts'
      - 'packages/database/prisma/schema.prisma'
      - 'packages/database/prisma/migrations/5_guest_os_core/**'
      - 'scripts/verify_guest_os_access.py'
      - '.github/workflows/guest-os-access-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guest-os-access:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: resort_os
          POSTGRES_USER: resort
          POSTGRES_PASSWORD: resort
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resort -d resort_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://resort:resort@localhost:5432/resort_os?schema=public
      PROPERTY_CODE: THREE_CROWNS
      RATE_PLAN_CODE: DIRECT_2026_27
      COOKIE_SECURE: 'false'
      GUEST_OS_PUBLIC_BASE_URL: http://127.0.0.1:3000
      BOOTSTRAP_OWNER_USERNAME: guest-access-ci-owner
      BOOTSTRAP_OWNER_PASSWORD: Guest-Access-CI-Owner-Password-2026
      BOOTSTRAP_OWNER_DISPLAY_NAME: Guest Access CI Owner
      CORE_API_URL: http://127.0.0.1:8000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            packages/database/package-lock.json
            apps/web/package-lock.json

      - name: Apply canonical database migration chain
        working-directory: packages/database
        run: |
          npm install --no-audit --no-fund
          npx prisma validate
          npx prisma migrate deploy
          npx prisma migrate status

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/requirements.txt

      - name: Install and compile Resort Core + access verifier
        run: |
          pip install -r services/api/requirements.txt
          python -m compileall services/api/app scripts/verify_guest_os_access.py

      - name: Seed canonical hotel and bootstrap owner
        run: |
          python scripts/seed_from_intake.py
          python scripts/bootstrap_owner.py

      - name: Typecheck and build public Guest OS route
        working-directory: apps/web
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Start Resort Core
        run: |
          python -m uvicorn app.app_entry:app --app-dir services/api --host 127.0.0.1 --port 8000 > /tmp/guest-os-access-api.log 2>&1 &
          echo $! > /tmp/guest-os-access-api.pid
          for i in {1..30}; do
            curl --fail -sS http://127.0.0.1:8000/health/ready >/tmp/ready.json 2>/dev/null && exit 0
            sleep 1
          done
          cat /tmp/guest-os-access-api.log || true
          exit 1

      - name: Run Guest OS access and privacy E2E
        run: python scripts/verify_guest_os_access.py

      - name: Show Core logs on failure
        if: failure()
        run: cat /tmp/guest-os-access-api.log || true

      - name: Stop Core
        if: always()
        run: |
          if [ -f /tmp/guest-os-access-api.pid ]; then kill "$(cat /tmp/guest-os-access-api.pid)" 2>/dev/null || true; fi
