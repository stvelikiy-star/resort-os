name: marina-ai-embedded-ci

on:
  pull_request:
    paths:
      - 'services/api/app/marina_assistant.py'
      - 'services/api/app/guest_assistant.py'
      - 'services/api/app/section_permissions.py'
      - 'services/api/app/guest_requests.py'
      - 'services/api/app/guest_os.py'
      - 'services/api/app/marina_assistant_knowledge.md'
      - 'services/api/app/app_entry.py'
      - 'apps/admin/components/MarinaAiAssistant.tsx'
      - 'apps/admin/components/MarinaAiAssistant.module.css'
      - 'apps/admin/components/AdminShell.tsx'
      - 'apps/staff/components/MarinaAiAssistant.tsx'
      - 'apps/staff/components/MarinaAiAssistant.module.css'
      - 'apps/staff/components/StaffRoleGateway.tsx'
      - 'apps/staff/components/KitchenEntry.tsx'
      - 'apps/staff/components/WaiterEntry.tsx'
      - 'scripts/marina_ai_embedded_contract.py'
      - 'scripts/test_marina_assistant_permissions.py'
      - 'apps/web/components/GuestAiAssistant.tsx'
      - 'apps/web/components/GuestAiAssistant.module.css'
      - 'apps/web/components/GuestConciergeRuntime.tsx'
      - '.github/workflows/marina-ai-embedded-ci.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile backend
        run: python -m py_compile services/api/app/marina_assistant.py services/api/app/app_entry.py
      - name: Embedded assistant contract
        run: python scripts/marina_ai_embedded_contract.py
      - name: Install backend test dependencies
        run: pip install -r services/api/requirements.txt
      - name: Assistant role and guest isolation behavior
        run: python scripts/test_marina_assistant_permissions.py

  guest-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - run: npm run typecheck --prefix apps/web

  admin-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci --prefix apps/admin
      - run: npm run typecheck --prefix apps/admin

  staff-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/staff/package-lock.json
      - run: npm ci --prefix apps/staff
      - run: npm run typecheck --prefix apps/staff
