name: Marketing Provider UAT CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'automation/n8n/marketing-whatsapp-green-provider-uat.json'
      - 'scripts/verify_marketing_provider_uat_workflow.py'
      - '.github/workflows/marketing-provider-uat-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-provider-uat-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate JSON
        run: python -m json.tool automation/n8n/marketing-whatsapp-green-provider-uat.json >/dev/null
      - name: Verify fail-closed provider UAT workflow
        run: python scripts/verify_marketing_provider_uat_workflow.py
