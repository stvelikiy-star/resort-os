name: MARINA FLEX Invoice and Ledger Contracts

on:
  pull_request:
    paths:
      - "services/api/app/flex_billing.py"
      - "scripts/marina_flex_billing_contract_test.py"
      - "docs/flex/sql/0007_flex_invoice_ledger_preview.sql"
      - "scripts/marina_flex_invoice_ledger_sql_contract.sql"
      - ".github/workflows/marina-flex-invoice-ledger-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invoice-math:
    name: FLEX tax-approved invoice and verified allocation math
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax-check billing arithmetic
        run: |
          python -m py_compile services/api/app/flex_billing.py scripts/marina_flex_billing_contract_test.py
      - name: Run invoice and payment planning contract tests
        run: python scripts/marina_flex_billing_contract_test.py

  ledger-constraints:
    name: FLEX disposable PostgreSQL invoice and cash invariants
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: flex_ci
          POSTGRES_USER: flex_ci
          POSTGRES_PASSWORD: flex_ci_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flex_ci -d flex_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: flex_ci
      PGPASSWORD: flex_ci_ci_only
      PGDATABASE: flex_ci
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Create disposable FLEX 0001–0007 schema
        run: |
          psql -X -v ON_ERROR_STOP=1 -f docs/flex/sql/0001_flex_control_plane_preview.sql
          psql -X -v ON_ERROR_STOP=1 -f docs/flex/sql/0002_flex_platform_identity_rls_preview.sql
          psql -X -v ON_ERROR_STOP=1 -f docs/flex/sql/0003_flex_price_version_guard_preview.sql
          psql -X -v ON_ERROR_STOP=1 -f docs/flex/sql/0004_flex_hotel_onboarding_preview.sql
          psql -X -v ON_ERROR_STOP=1 -f docs/flex/sql/0005_flex_deployment_attestation_preview.sql
          psql -X -v ON_ERROR_STOP=1 -f docs/flex/sql/0006_flex_agreements_subscription_preview.sql
          psql -X -v ON_ERROR_STOP=1 -f docs/flex/sql/0007_flex_invoice_ledger_preview.sql
          psql -X -v ON_ERROR_STOP=1 -f scripts/marina_flex_rls_isolation_contract.sql
      - name: Verify invoice, approval, cash allocation and double-post guards
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/marina_flex_invoice_ledger_sql_contract.sql
      - name: Guard against cross-contamination of hotel PMS schema
        run: |
          count="$(psql -X -Atqc "SELECT count(*) FROM pg_tables WHERE schemaname='public' AND tablename IN ('properties','reservations','guests','payments')")"
          test "$count" = "0"
