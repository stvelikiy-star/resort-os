name: Management Final Acceptance CI

on:
  pull_request:
    paths:
      - 'apps/admin/**'
      # Reviewed MARINA guest-portal and paired Next.js security-patch inputs.
      - 'apps/web/app/g/**'
      - 'apps/web/components/GuestConciergeRuntime.tsx'
      - 'apps/web/components/GuestRoomDirections.tsx'
      - 'apps/web/components/GuestStayReview.tsx'
      - 'apps/web/package.json'
      - 'apps/web/package-lock.json'
      - 'apps/staff/**'
      - 'services/api/**'
      - 'scripts/**'
      - 'data-intake/**'
      - 'release/**'
      - 'docs/THREE_CROWNS_MANAGEMENT_FINAL_ACCEPTANCE_2026-09-06.md'
      - '.github/workflows/management-final-acceptance-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  management-final-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enforce frozen public website scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          case "$branch" in
            fix/marina-staging-*)
              git fetch origin "${{ github.base_ref }}" --depth=1
              changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
              web_changed="$(printf '%s\n' "$changed" | grep '^apps/web/' || true)"
              # Allow only the four reviewed guest-portal files and the exact
              # Next.js security-patch pair, including their combined diff.
              manifest_changed=false
              lock_changed=false
              for path in $web_changed; do
                case "$path" in
                  'apps/web/app/g/[token]/page.tsx'|\
                  'apps/web/components/GuestConciergeRuntime.tsx'|\
                  'apps/web/components/GuestRoomDirections.tsx'|\
                  'apps/web/components/GuestStayReview.tsx')
                    ;;
                  'apps/web/package.json')
                    manifest_changed=true
                    ;;
                  'apps/web/package-lock.json')
                    lock_changed=true
                    ;;
                  *)
                    echo "BLOCKED: unapproved MARINA public-web change: $path" >&2
                    exit 1
                    ;;
                esac
              done
              if [ "$manifest_changed" != "$lock_changed" ]; then
                echo 'BLOCKED: Next.js security patch requires both package.json and package-lock.json.' >&2
                exit 1
              fi
              if [ "$manifest_changed" = true ]; then
                node - <<'NODE'
          const manifest = require('./apps/web/package.json');
          const lock = require('./apps/web/package-lock.json');
          const patched = '15.5.28';
          if (manifest.dependencies?.next !== patched ||
              lock.packages?.['']?.dependencies?.next !== patched ||
              lock.packages?.['node_modules/next']?.version !== patched) {
            throw new Error('Only the verified Next.js 15.5.28 security patch is permitted.');
          }
          console.log('PASS: exact public-web Next.js security patch only.');
          NODE
              fi
              echo "PASS: MARINA guest-portal scope permits only approved stay review and room-direction files; public marketing pages remain frozen."
              exit 0
              ;;
            marina-smart/*|railway/marina-*|fix/marina-smart-*)
              echo "PASS: legacy Three Crowns public-web freeze is not the MARINA SMART AK BERMET acceptance boundary."
              exit 0
              ;;
          esac

          git fetch origin "${{ github.base_ref }}" --depth=1
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          echo "$changed"
          web_changed="$(printf '%s\n' "$changed" | grep '^apps/web/' || true)"
          if [ -n "$web_changed" ]; then
            if [ "$web_changed" = $'apps/web/package-lock.json\napps/web/package.json' ]; then
              node - <<'NODE'
          const manifest = require('./apps/web/package.json');
          const lock = require('./apps/web/package-lock.json');
          const patched = '15.5.28';
          if (manifest.dependencies?.next !== patched ||
              lock.packages?.['']?.dependencies?.next !== patched ||
              lock.packages?.['node_modules/next']?.version !== patched) {
            throw new Error('Public-web exception only permits the verified Next.js 15.5.28 security patch.');
          }
          console.log('PASS: exact Next.js security patch is reflected in manifest and lockfile.');
          NODE
            elif [ "$web_changed" = 'apps/web/components/BookingWidget.tsx' ]; then
              if ! printf '%s\n' "$changed" | grep -qx 'scripts/owner_ops_corrections_contract.py'; then
                echo 'BLOCKED: BookingWidget owner correction requires its regression contract update.' >&2
                exit 1
              fi
              python scripts/owner_ops_corrections_contract.py
            else
              echo 'BLOCKED: public-web pages, marketing copy, and assets remain frozen; only the exact security patch or approved BookingWidget copy is allowed.' >&2
              exit 1
            fi
          fi

      - name: Run management final truth assertions
        run: python scripts/verify_management_final_acceptance.py

      - name: Run strict internal hardening assertions
        run: python scripts/verify_internal_hardening.py

      - name: Verify synthetic mutation scripts fail closed
        run: python scripts/verify_synthetic_script_safety.py

      - name: Verify legacy mutating utilities are fail closed
        run: python scripts/verify_mutating_utility_safety.py

      - name: Compile management Core and acceptance scripts
        run: python -m compileall -q services/api/app scripts

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/admin/package-lock.json
            apps/staff/package-lock.json

      - name: Typecheck and build Admin
        working-directory: apps/admin
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Typecheck and build Staff
        working-directory: apps/staff
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Acceptance summary
        run: echo 'MANAGEMENT_FINAL_ACCEPTANCE_AND_INTERNAL_HARDENING_PASS'
