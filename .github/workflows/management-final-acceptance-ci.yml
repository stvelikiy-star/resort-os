name: Management Final Acceptance CI

on:
  pull_request:
    paths:
      - 'apps/admin/**'
      - 'apps/staff/**'
      - 'services/api/**'
      - 'scripts/**'
      - 'data-intake/**'
      - 'release/**'
      - 'docs/THREE_CROWNS_MANAGEMENT_FINAL_ACCEPTANCE_2026-09-06.md'
      - '.github/workflows/management-final-acceptance-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  management-final-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enforce frozen public website scope
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          echo "$changed"
          web_changed="$(printf '%s\n' "$changed" | grep '^apps/web/' || true)"
          if [ -n "$web_changed" ]; then
            blocked=0
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              case "$path" in
                "apps/web/app/page.tsx"|"apps/web/app/rooms-premium.css"|"apps/web/app/rooms/page.tsx"|"apps/web/app/rooms/[slug]/page.tsx"|"apps/web/components/BookingWidget.tsx"|"apps/web/lib/roomMedia.ts"|apps/web/public/media/three-crowns/rooms/*)
                  ;;
                *)
                  echo "BLOCKED: public website path is outside the owner-approved room-media scope: $path" >&2
                  blocked=1
                  ;;
              esac
            done <<< "$web_changed"
            [ "$blocked" -eq 0 ] || exit 1
            for contract in scripts/public_browser_acceptance.mjs scripts/public_media_integrity_guard.py; do
              if ! printf '%s\n' "$changed" | grep -qx "$contract"; then
                echo "BLOCKED: room-media change requires regression contract update: $contract" >&2
                exit 1
              fi
            done
            python scripts/public_media_integrity_guard.py
          fi

      - name: Run management final truth assertions
        run: python scripts/verify_management_final_acceptance.py

      - name: Run strict internal hardening assertions
        run: python scripts/verify_internal_hardening.py

      - name: Verify synthetic mutation scripts fail closed
        run: python scripts/verify_synthetic_script_safety.py

      - name: Verify legacy mutating utilities are fail closed
        run: python scripts/verify_mutating_utility_safety.py

      - name: Compile management Core and acceptance scripts
        run: python -m compileall -q services/api/app scripts

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/admin/package-lock.json
            apps/staff/package-lock.json

      - name: Typecheck and build Admin
        working-directory: apps/admin
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Typecheck and build Staff
        working-directory: apps/staff
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Acceptance summary
        run: echo 'MANAGEMENT_FINAL_ACCEPTANCE_AND_INTERNAL_HARDENING_PASS'
