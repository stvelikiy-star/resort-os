name: Management Final Acceptance CI

on:
  pull_request:
    paths:
      - 'apps/admin/**'
      - 'apps/staff/**'
      - 'services/api/**'
      - 'scripts/**'
      - 'data-intake/**'
      - 'release/**'
      - 'docs/THREE_CROWNS_MANAGEMENT_FINAL_ACCEPTANCE_2026-09-06.md'
      - '.github/workflows/management-final-acceptance-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  management-final-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enforce frozen public website scope
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          echo "$changed"
          if printf '%s\n' "$changed" | grep -q '^apps/web/'; then
            echo 'BLOCKED: apps/web is frozen by owner scope during management hardening.' >&2
            exit 1
          fi

      - name: Run management final truth assertions
        run: python scripts/verify_management_final_acceptance.py

      - name: Run strict internal hardening assertions
        run: python scripts/verify_internal_hardening.py

      - name: Verify synthetic mutation scripts fail closed
        run: python scripts/verify_synthetic_script_safety.py

      - name: Compile management Core and acceptance scripts
        run: python -m compileall -q services/api/app scripts

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            apps/admin/package-lock.json
            apps/staff/package-lock.json

      - name: Typecheck and build Admin
        working-directory: apps/admin
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Typecheck and build Staff
        working-directory: apps/staff
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Acceptance summary
        run: echo 'MANAGEMENT_FINAL_ACCEPTANCE_AND_INTERNAL_HARDENING_PASS'
