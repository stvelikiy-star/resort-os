name: MARINA Shared Server Mobile Task Contracts CI

on:
  pull_request:
    paths:
      - 'services/api/app/operations.py'
      - 'services/api/app/shared_auth_preview.py'
      - 'scripts/test_marina_server_mobile_tasks.py'
      - '.github/workflows/marina-shared-server-mobile-tasks-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoped-task-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical API requirements
        run: python -m pip install -r services/api/requirements.txt
      - name: Typecheck Python task and staging route contracts
        run: python -m py_compile services/api/app/operations.py services/api/app/shared_auth_preview.py scripts/test_marina_server_mobile_tasks.py
      - name: Validate task payload and role ceilings without deployment
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s scripts -p 'test_marina_server_mobile_tasks.py' -v
