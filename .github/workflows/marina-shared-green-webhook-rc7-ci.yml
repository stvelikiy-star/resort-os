name: MARINA Shared GreenAPI Webhook RC7 Two-Hotel CI

on:
  pull_request:
    paths:
      - 'services/api/app/shared_green_rc6.py'
      - 'services/api/app/shared_green_rc7.py'
      - 'services/api/app/shared_green_rc7_webhook.py'
      - 'scripts/marina_shared_green_rc7_webhook_ci.py'
      - '.github/workflows/marina-shared-green-webhook-rc7-ci.yml'
      - 'services/api/app/shared_green_rc6_config.py'
      - 'services/api/app/whatsapp_connection.py'
      - 'services/api/app/main.py'
      - 'scripts/marina_shared_green_rc6_db_ci.py'
      - '.github/workflows/marina-shared-green-rc6-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-hotel-webhook-ingress:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_DB: marina_shared_browser_ci
          POSTGRES_USER: marina_ci
          POSTGRES_PASSWORD: synthetic-ci-database-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U marina_ci -d marina_shared_browser_ci"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql://marina_ci:synthetic-ci-database-only@127.0.0.1:5432/marina_shared_browser_ci?schema=public
      PYTHONPATH: services/api:scripts
      APP_ENV: staging
      PROPERTY_CODE: MARINA_BROWSER_CI
      RATE_PLAN_CODE: MARINA_BROWSER_CI
      MARINA_TENANT_CONTEXT_ENABLED: 'true'
      MARINA_SHARED_AUTH_PREVIEW_ENABLED: 'true'
      COOKIE_SECURE: 'true'
      COOKIE_DOMAIN: ''
      MARINA_SHARED_BROWSER_CI_CONFIRM: DISPOSABLE_TWO_HOTEL_BROWSER_CI
      MARINA_SHARED_GREEN_RC6_CI_CONFIRM: DISPOSABLE_TWO_HOTEL_GREEN_QR_CI_ONLY
      MARINA_SHARED_GREEN_WEBHOOK_RC7_CI_CONFIRM: ISOLATED_TWO_HOTEL_WEBHOOK_ONLY
      MARINA_SHARED_GREEN_WEBHOOK_RC7_ENABLED: 'true'
      MARINA_SHARED_GREEN_WEBHOOK_RC7_CONFIRM: REVIEWED_GREEN_WEBHOOK_STAGING_ONLY
      MARINA_SHARED_GUEST_QR_RC4_ENABLED: 'true'
      MARINA_SHARED_GUEST_QR_RC4_CONFIRM: REVIEWED_SHARED_GUEST_QR_STAGING_ONLY
      GUEST_OS_PUBLIC_BASE_URL: https://green-rc6-ci.invalid
      MARINA_SHARED_GUEST_QR_RC4_ORIGIN: https://green-rc6-ci.invalid
      MARINA_SHARED_INBOX_RC5_ENABLED: 'true'
      MARINA_SHARED_INBOX_RC5_CONFIRM: REVIEWED_SHARED_INBOX_STAGING_ONLY
      MARINA_SHARED_GREEN_RC6_ENABLED: 'true'
      MARINA_SHARED_GREEN_RC6_CONFIRM: REVIEWED_SHARED_GREEN_QR_STAGING_ONLY
      ENABLE_GREEN_API_CONNECTION: 'true'
      GREEN_API_PROPERTY_CODE: HOTEL_A
      GREEN_API_ID_INSTANCE: '9999999999'
      GREEN_API_TOKEN_INSTANCE: LEGACY_SYNTHETIC_KEY_NOT_FOR_SHARED
      GREEN_API_URL: https://api.green-api.com
      ENABLE_PAYMENT_OPERATIONS: 'false'
      ENABLE_MKASSA: 'false'
      ENABLE_SERVICE_POINT_QR: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate private synthetic hotel credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python - <<'PY'
          import json,os,secrets
          pwd="synthetic-ci-only-"+secrets.token_hex(24)
          print("::add-mask::"+pwd)
          channels=[]
          for hotel,account in (("A","10000001"),("B","20000002")):
              key=secrets.token_urlsafe(48)
              print("::add-mask::"+key)
              channels.append({
                  "tenant_code":"tenant_"+hotel.lower(),
                  "property_code":"HOTEL_"+hotel,
                  "channel_code":"WA_MAIN",
                  "external_account_id":account,
                  "service_key":key,
              })
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as e:
              e.write("MARINA_SHARED_BROWSER_CI_PASSWORD="+pwd+"\n")
              e.write("MARINA_SHARED_INBOX_RC5_ADAPTERS_JSON="+json.dumps(channels,separators=(",",":"))+"\n")
          PY
      - name: Apply unchanged Prisma migration chain
        working-directory: packages/database
        run: |
          npm ci --no-audit --no-fund
          npx prisma migrate deploy
      - name: Install Resort Core dependencies
        run: python -m pip install -r services/api/requirements.txt
      - name: Seed two independent hotels, owners, managers and reception
        run: python scripts/marina_shared_live_browser_db.py seed
      - name: Verify authenticated provider webhook on full shared Core and two hotels
        run: python scripts/marina_shared_green_rc7_webhook_ci.py
