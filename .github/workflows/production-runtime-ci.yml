name: Production Runtime CI

on:
  workflow_dispatch:
  push:
    branches: [main, feat/production-runtime-hardening]
    paths:
      - 'compose.production.yaml'
      - 'compose.production.edge.yaml'
      - 'infra/Caddyfile'
      - 'ops/production.env.example'
      - 'ops/production_deploy.sh'
      - 'ops/production_smoke.sh'
      - 'services/api/Dockerfile'
      - 'packages/database/Dockerfile'
      - 'packages/database/package.json'
      - 'packages/database/package-lock.json'
      - 'packages/database/prisma/**'
      - 'scripts/generate_migration_baseline.sh'
      - 'scripts/production_preflight.py'
      - 'scripts/seed_from_intake.py'
      - 'scripts/bootstrap_owner.py'
      - '.github/workflows/production-runtime-ci.yml'
  pull_request:
    paths:
      - 'compose.production.yaml'
      - 'compose.production.edge.yaml'
      - 'infra/Caddyfile'
      - 'ops/production.env.example'
      - 'ops/production_deploy.sh'
      - 'ops/production_smoke.sh'
      - 'services/api/Dockerfile'
      - 'packages/database/Dockerfile'
      - 'packages/database/package.json'
      - 'packages/database/package-lock.json'
      - 'packages/database/prisma/**'
      - 'scripts/generate_migration_baseline.sh'
      - 'scripts/production_preflight.py'
      - 'scripts/seed_from_intake.py'
      - 'scripts/bootstrap_owner.py'
      - '.github/workflows/production-runtime-ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Source-only validation. This workflow never touches production credentials, DNS or databases.
jobs:
  runtime-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Validate production shell entrypoints
        run: |
          bash -n ops/production_deploy.sh
          bash -n ops/production_smoke.sh
          bash -n scripts/generate_migration_baseline.sh

      - name: Materialize non-secret validation env
        run: |
          cp ops/production.env.example /tmp/production.env
          sed -i 's/CHANGE_ME_LONG_RANDOM_PASSWORD/validation-password-only/' /tmp/production.env
          sed -i 's/CHANGE_ME_OWNER_EMAIL/ops@example.com/' /tmp/production.env
          sed -i 's/CHANGE_ME_64_PLUS_RANDOM_CHARS/validation-automation-service-key-000000000000000000000000000000000000/' /tmp/production.env
          sed -i 's/CHANGE_ME_MIN_12_CHARS/ValidationOwnerPassword123!/' /tmp/production.env
          sed -i 's/CHANGE_ME_VERIFIED_BACKUP_ISO8601/2026-08-26T00:00:00Z/' /tmp/production.env

      - name: Validate merged production Compose model
        run: |
          docker compose --env-file /tmp/production.env \
            -f compose.production.yaml \
            -f compose.production.edge.yaml \
            config >/tmp/compose-rendered.yaml
          for service in postgres migrator backup api web admin staff edge; do
            grep -q "^  ${service}:" /tmp/compose-rendered.yaml
          done
          if grep -q 'BOOTSTRAP_OWNER_PASSWORD' /tmp/compose-rendered.yaml; then
            echo 'ERROR: bootstrap owner password leaked into persistent Compose service environment' >&2
            exit 1
          fi

      - name: Validate Caddy configuration
        run: |
          docker run --rm \
            -e ACME_EMAIL=ops@example.com \
            -e PUBLIC_HOST=3korony.com \
            -e WWW_HOST=www.3korony.com \
            -e PMS_HOST=pms.3korony.com \
            -e STAFF_HOST=staff.3korony.com \
            -e CORE_HOST=core.3korony.com \
            -v "$PWD/infra/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Assert public Core allowlist and internal routing
        run: |
          grep -Fq '@publicAvailability' infra/Caddyfile
          grep -Fq 'path /core/api/v1/booking/check-availability' infra/Caddyfile
          grep -Fq 'method GET' infra/Caddyfile
          grep -Fq '@publicReservationRequest' infra/Caddyfile
          grep -Fq 'path /core/api/v1/booking/requests' infra/Caddyfile
          grep -Fq 'method POST' infra/Caddyfile
          grep -Fq '@blockedPublicCore path /core/*' infra/Caddyfile
          grep -Fq 'respond "Not Found" 404' infra/Caddyfile
          grep -Fq '@pmsws path /ws/*' infra/Caddyfile
          test "$(grep -Fc 'handle_path /core/*' infra/Caddyfile)" -eq 2

      - name: Assert host-isolated secure sessions
        run: |
          grep -Fxq 'COOKIE_SECURE=true' ops/production.env.example
          grep -Fxq 'COOKIE_DOMAIN=' ops/production.env.example
          grep -Fxq 'REQUIRE_COOKIE_DOMAIN=false' ops/production.env.example
          grep -Fq 'REQUIRE_COOKIE_DOMAIN must be false for host-isolated production sessions' ops/production_deploy.sh
          grep -Fq 'COOKIE_DOMAIN must be empty so production sessions remain host-only' ops/production_deploy.sh
          grep -Fq 'REQUIRE_COOKIE_DOMAIN=false' ops/production_deploy.sh
          if grep -Fq 'COOKIE_DOMAIN=.3korony.com' ops/production.env.example; then
            echo 'ERROR: shared parent-domain session cookie is forbidden' >&2
            exit 1
          fi

      - name: Assert production cutover gates
        run: |
          grep -Fq 'PRODUCTION_CUTOVER_APPROVED=false' ops/production.env.example
          grep -Fq 'PUBLIC_DNS_READY=false' ops/production.env.example
          grep -Fq 'PRODUCTION_CUTOVER_APPROVED must be true' ops/production_deploy.sh
          grep -Fq 'PUBLIC_DNS_READY must be true' ops/production_deploy.sh
          grep -Fq 'Existing application schema has no Prisma migration history' ops/production_deploy.sh
          grep -Fq 'LAST_VERIFIED_BACKUP_AT cannot be in the future' ops/production_deploy.sh
          grep -Fq 'LAST_VERIFIED_BACKUP_AT is older than MAX_BACKUP_AGE_HOURS' ops/production_deploy.sh

      - name: Assert pinned migration toolchain and generator contract
        run: |
          grep -Fq '"prisma": "6.15.0"' packages/database/package.json
          grep -Fq '"@prisma/client": "6.15.0"' packages/database/package.json
          grep -Fq 'npx --no-install prisma validate' scripts/generate_migration_baseline.sh
          grep -Fq 'npx --no-install prisma migrate diff' scripts/generate_migration_baseline.sh
          grep -Fq 'sha256sum -c migration.sql.sha256' scripts/generate_migration_baseline.sh
          grep -Fq 'pinned Prisma toolchain is not installed' scripts/generate_migration_baseline.sh
          if grep -Eq '^[[:space:]]*npm (install|ci)' scripts/generate_migration_baseline.sh; then
            echo 'ERROR: baseline generator must not install dependencies or resolve network packages' >&2
            exit 1
          fi
          if grep -Fq 'npx prisma format' scripts/generate_migration_baseline.sh; then
            echo 'ERROR: baseline generator must not rewrite canonical schema before diff' >&2
            exit 1
          fi
          grep -Fq 'COPY packages/database/package*.json ./' packages/database/Dockerfile
          grep -Fq 'npm ci --no-audit --no-fund' packages/database/Dockerfile
          grep -Fq 'CMD ["npx", "--no-install", "prisma", "migrate", "deploy"]' packages/database/Dockerfile

      - name: Assert migration and preflight contract
        run: |
          grep -Fq 'prisma/migrations/0_init' ops/production_deploy.sh
          grep -Fq 'run --rm migrator' ops/production_deploy.sh
          grep -Fq 'npx prisma migrate status' ops/production_deploy.sh
          grep -Fq 'production_preflight.py' ops/production_deploy.sh
          grep -Fq 'REQUIRE_RECENT_BACKUP=true' ops/production_deploy.sh
          grep -Fq 'REQUIRE_MIGRATION_HISTORY=true' ops/production_deploy.sh
          if grep -Fq 'psql -v ON_ERROR_STOP' ops/production_deploy.sh; then
            echo 'ERROR: deploy script bypasses Prisma migration history with direct baseline SQL' >&2
            exit 1
          fi

      - name: Prove missing baseline fails before deployment actions
        run: |
          if [ ! -s packages/database/prisma/migrations/0_init/migration.sql ]; then
            if ENV_FILE=/tmp/production.env bash ops/production_deploy.sh >/tmp/deploy.out 2>/tmp/deploy.err; then
              echo 'ERROR: deploy script unexpectedly continued without committed baseline' >&2
              exit 1
            fi
            grep -Fq 'Missing immutable migration baseline' /tmp/deploy.err
          else
            MIGRATION_DIR=packages/database/prisma/migrations/0_init
            test -s "$MIGRATION_DIR/migration.sql.sha256"
            test -s packages/database/package-lock.json
            test "$(awk 'NR==1 {print $2}' "$MIGRATION_DIR/migration.sql.sha256")" = 'migration.sql'
            (cd "$MIGRATION_DIR" && sha256sum -c migration.sql.sha256)
          fi

      - name: Build production helper images
        run: |
          docker compose --env-file /tmp/production.env \
            -f compose.production.yaml \
            -f compose.production.edge.yaml \
            build migrator api

      - name: Verify API image contains one-shot operational scripts
        run: |
          docker compose --env-file /tmp/production.env \
            -f compose.production.yaml \
            -f compose.production.edge.yaml \
            run --rm --no-deps api sh -lc \
            'test -f /app/scripts/seed_from_intake.py && test -f /app/scripts/bootstrap_owner.py && test -f /app/scripts/production_preflight.py'

      - name: Verify migrator image has pinned Prisma CLI
        run: |
          docker compose --env-file /tmp/production.env \
            -f compose.production.yaml \
            -f compose.production.edge.yaml \
            run --rm --no-deps migrator node -e \
            'const v=require("prisma/package.json").version; if(v!=="6.15.0"){console.error(`unexpected Prisma ${v}`); process.exit(1)}'
