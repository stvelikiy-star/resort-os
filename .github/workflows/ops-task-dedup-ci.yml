name: Operational Task Dedup CI

on:
  pull_request:
    paths:
      - 'packages/database/sql/001_core_constraints.sql'
      - '.github/workflows/ops-task-dedup-ci.yml'
  push:
    branches: [main]
    paths:
      - 'packages/database/sql/001_core_constraints.sql'
      - '.github/workflows/ops-task-dedup-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  active-task-dedup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: resort_ops_dedup
          POSTGRES_USER: resort
          POSTGRES_PASSWORD: resort
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resort -d resort_ops_dedup"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://resort:resort@localhost:5432/resort_ops_dedup?schema=public
      PGURL: postgresql://resort:resort@localhost:5432/resort_ops_dedup

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create Prisma schema on disposable PostgreSQL
        working-directory: packages/database
        run: |
          npm install --no-audit --no-fund
          npx prisma validate
          npx prisma db push

      - name: Apply canonical PostgreSQL invariants
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -f packages/database/sql/001_core_constraints.sql

      - name: Seed minimal property and room
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO properties (id,code,name,"updatedAt") VALUES
            ('11111111-1111-1111-1111-111111111111','OPS_DEDUP_CI','Ops Dedup CI',now());
          INSERT INTO room_types (id,"propertyId",code,name,"capacityAdults","updatedAt") VALUES
            ('22222222-2222-2222-2222-222222222222','11111111-1111-1111-1111-111111111111','TEST','Test Room',2,now());
          INSERT INTO rooms (id,"propertyId","roomTypeId",code,name,"updatedAt") VALUES
            ('33333333-3333-3333-3333-333333333333','11111111-1111-1111-1111-111111111111','22222222-2222-2222-2222-222222222222','101','Room 101',now());
          SQL

      - name: Prove active housekeeping is unique per room and type
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -c "INSERT INTO operational_tasks (id,\"propertyId\",\"roomId\",type,status,priority,title,\"createdByType\",source,\"updatedAt\") VALUES ('40000000-0000-0000-0000-000000000001','11111111-1111-1111-1111-111111111111','33333333-3333-3333-3333-333333333333','HOUSEKEEPING','OPEN','NORMAL','HK 1','STAFF','CI',now())"
          if psql "$PGURL" -v ON_ERROR_STOP=1 -c "INSERT INTO operational_tasks (id,\"propertyId\",\"roomId\",type,status,priority,title,\"createdByType\",source,\"updatedAt\") VALUES ('40000000-0000-0000-0000-000000000002','11111111-1111-1111-1111-111111111111','33333333-3333-3333-3333-333333333333','HOUSEKEEPING','IN_PROGRESS','HIGH','HK duplicate','STAFF','CI',now())"; then
            echo 'ERROR: second active HOUSEKEEPING task was accepted for the same room' >&2
            exit 1
          fi

      - name: Prove housekeeping and maintenance may coexist but maintenance also deduplicates
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -c "INSERT INTO operational_tasks (id,\"propertyId\",\"roomId\",type,status,priority,title,\"createdByType\",source,\"updatedAt\") VALUES ('50000000-0000-0000-0000-000000000001','11111111-1111-1111-1111-111111111111','33333333-3333-3333-3333-333333333333','MAINTENANCE','OPEN','HIGH','Maintenance 1','STAFF','CI',now())"
          if psql "$PGURL" -v ON_ERROR_STOP=1 -c "INSERT INTO operational_tasks (id,\"propertyId\",\"roomId\",type,status,priority,title,\"createdByType\",source,\"updatedAt\") VALUES ('50000000-0000-0000-0000-000000000002','11111111-1111-1111-1111-111111111111','33333333-3333-3333-3333-333333333333','MAINTENANCE','IN_INSPECTION','HIGH','Maintenance duplicate','STAFF','CI',now())"; then
            echo 'ERROR: second active MAINTENANCE task was accepted for the same room' >&2
            exit 1
          fi

      - name: Prove completed history does not block a new task
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -c "UPDATE operational_tasks SET status='DONE',\"completedAt\"=now(),\"updatedAt\"=now() WHERE id='40000000-0000-0000-0000-000000000001'"
          psql "$PGURL" -v ON_ERROR_STOP=1 -c "INSERT INTO operational_tasks (id,\"propertyId\",\"roomId\",type,status,priority,title,\"createdByType\",source,\"updatedAt\") VALUES ('40000000-0000-0000-0000-000000000003','11111111-1111-1111-1111-111111111111','33333333-3333-3333-3333-333333333333','HOUSEKEEPING','OPEN','NORMAL','HK after done','STAFF','CI',now())"
          hk_total="$(psql "$PGURL" -Atc 'SELECT count(*) FROM operational_tasks WHERE "roomId"='"'"'33333333-3333-3333-3333-333333333333'"'"' AND type='"'"'HOUSEKEEPING'"'"'')"
          hk_active="$(psql "$PGURL" -Atc 'SELECT count(*) FROM operational_tasks WHERE "roomId"='"'"'33333333-3333-3333-3333-333333333333'"'"' AND type='"'"'HOUSEKEEPING'"'"' AND status IN ('"'"'OPEN'"'"','"'"'IN_PROGRESS'"'"','"'"'IN_INSPECTION'"'"')')"
          test "$hk_total" = '2'
          test "$hk_active" = '1'

      - name: Prove independent guest requests remain unconstrained
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO operational_tasks (id,"propertyId","roomId",type,status,priority,title,"createdByType",source,"updatedAt") VALUES
            ('60000000-0000-0000-0000-000000000001','11111111-1111-1111-1111-111111111111','33333333-3333-3333-3333-333333333333','GUEST_REQUEST','OPEN','NORMAL','Guest request 1','STAFF','CI',now()),
            ('60000000-0000-0000-0000-000000000002','11111111-1111-1111-1111-111111111111','33333333-3333-3333-3333-333333333333','GUEST_REQUEST','OPEN','NORMAL','Guest request 2','STAFF','CI',now());
          SQL
          guest_active="$(psql "$PGURL" -Atc 'SELECT count(*) FROM operational_tasks WHERE "roomId"='"'"'33333333-3333-3333-3333-333333333333'"'"' AND type='"'"'GUEST_REQUEST'"'"' AND status='"'"'OPEN'"'"'')"
          test "$guest_active" = '2'
