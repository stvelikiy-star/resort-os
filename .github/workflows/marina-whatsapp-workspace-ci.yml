name: MARINA WhatsApp Workspace CI

on:
  pull_request:
    paths:
      - 'apps/admin/components/WhatsAppWorkspace.tsx'
      - 'apps/admin/components/WhatsAppWorkspace.module.css'
      - 'apps/admin/components/InboxBoard.tsx'
      - 'apps/admin/components/AdminShell.tsx'
      - '.github/workflows/marina-whatsapp-workspace-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci --prefix apps/admin
      - run: npm run typecheck --prefix apps/admin
      - name: Verify WhatsApp remains visible and disabled provider states are honest
        run: |
          grep -Fq 'WhatsApp / AI' apps/admin/components/AdminShell.tsx
          grep -Fq 'WhatsApp не подключён' apps/admin/components/WhatsAppWorkspace.tsx
          grep -Fq 'InboxBoard channelKind="WHATSAPP"' apps/admin/components/WhatsAppWorkspace.tsx
          grep -Fq 'WHERE id=$1 AND "propertyId"=$2' services/api/app/inbox.py
