name: Marketing Consent Automation CI

on:
  pull_request:
    branches:
      - main
      - integration/site-pms-cms-20260827
    paths:
      - 'services/api/app/main.py'
      - 'services/api/app/marketing.py'
      - 'services/api/app/marketing_automation.py'
      - 'services/api/app/service_auth.py'
      - 'services/api/app/app_entry.py'
      - 'packages/database/**'
      - 'automation/n8n/marketing-consent-audience.json'
      - 'scripts/apply_core_constraints.py'
      - 'scripts/seed_from_intake.py'
      - 'scripts/verify_marketing_consent_automation.py'
      - '.github/workflows/marketing-consent-automation-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  marketing-consent-automation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: resort_os
          POSTGRES_USER: resort
          POSTGRES_PASSWORD: resort
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resort -d resort_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: ci
      DATABASE_URL: postgresql://resort:resort@localhost:5432/resort_os?schema=public
      PROPERTY_CODE: THREE_CROWNS
      RATE_PLAN_CODE: DIRECT_2026_27
      COOKIE_SECURE: false
      CORE_API_URL: http://127.0.0.1:8000
      AUTOMATION_SERVICE_NAME: n8n-ci
      AUTOMATION_SERVICE_KEY: ci-marketing-service-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build clean PostgreSQL schema
        working-directory: packages/database
        run: |
          npm install --no-audit --no-fund
          npx prisma validate
          npx prisma db push

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/requirements.txt

      - name: Install Core and marketing SQL
        run: |
          pip install -r services/api/requirements.txt
          python -m compileall services/api/app scripts/verify_marketing_consent_automation.py
          python scripts/apply_core_constraints.py
          python scripts/seed_from_intake.py

      - name: Start Resort Core
        run: |
          python -m uvicorn app.app_entry:app --app-dir services/api --host 127.0.0.1 --port 8000 > /tmp/marketing-consent-api.log 2>&1 &
          echo $! > /tmp/marketing-consent-api.pid
          for i in {1..45}; do
            curl --fail --silent http://127.0.0.1:8000/health >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/marketing-consent-api.log || true
          exit 1

      - name: E2E — consent to audience to unsubscribe exclusion
        run: python scripts/verify_marketing_consent_automation.py

      - name: Show Core diagnostics on failure
        if: failure()
        run: cat /tmp/marketing-consent-api.log || true

      - name: Stop Core
        if: always()
        run: |
          if [ -f /tmp/marketing-consent-api.pid ]; then kill "$(cat /tmp/marketing-consent-api.pid)" 2>/dev/null || true; fi
