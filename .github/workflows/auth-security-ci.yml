name: Staff Auth Security CI

on:
  pull_request:
    branches:
      - integration/site-pms-cms-20260827
    paths:
      - 'services/api/app/auth.py'
      - 'services/api/requirements.txt'
      - 'packages/database/**'
      - 'scripts/auth_security_contract_test.py'
      - '.github/workflows/auth-security-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staff-login-hardening:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: resort_os
          POSTGRES_USER: resort
          POSTGRES_PASSWORD: resort
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resort -d resort_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://resort:resort@localhost:5432/resort_os?schema=public
      PROPERTY_CODE: THREE_CROWNS
      RATE_PLAN_CODE: DIRECT_2026_27
      BOOTSTRAP_OWNER_USERNAME: ci-owner
      BOOTSTRAP_OWNER_PASSWORD: CI-Only-Strong-Password-2026
      BOOTSTRAP_OWNER_DISPLAY_NAME: CI Owner
      COOKIE_SECURE: false
      CORE_API_URL: http://127.0.0.1:8000
      AUTH_TRUST_PROXY_HEADERS: true
      AUTH_LOGIN_WINDOW_SECONDS: 60
      AUTH_LOGIN_PAIR_MAX_FAILURES: 3
      AUTH_LOGIN_IP_MAX_FAILURES: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build clean PostgreSQL schema
        working-directory: packages/database
        run: |
          npm install --no-audit --no-fund
          npx prisma validate
          npx prisma db push

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/requirements.txt

      - name: Install Core and seed staff auth fixture
        run: |
          pip install -r services/api/requirements.txt
          python -m compileall services/api/app/auth.py scripts/auth_security_contract_test.py
          python scripts/apply_core_constraints.py
          python scripts/seed_from_intake.py
          python scripts/bootstrap_owner.py

      - name: Start Resort Core with trusted proxy and bounded throttle policy
        run: |
          python -m uvicorn app.app_entry:app --app-dir services/api --host 127.0.0.1 --port 8000 > /tmp/auth-security-api.log 2>&1 &
          echo $! > /tmp/auth-security-api.pid
          for i in {1..45}; do
            curl --fail --silent http://127.0.0.1:8000/health >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/auth-security-api.log || true
          exit 1

      - name: E2E — repeated failure, anti-DoS, concurrency, reset and recovery
        run: python scripts/auth_security_contract_test.py

      - name: Show Core diagnostics on failure
        if: failure()
        run: cat /tmp/auth-security-api.log || true

      - name: Stop Core
        if: always()
        run: |
          if [ -f /tmp/auth-security-api.pid ]; then kill "$(cat /tmp/auth-security-api.pid)" 2>/dev/null || true; fi
