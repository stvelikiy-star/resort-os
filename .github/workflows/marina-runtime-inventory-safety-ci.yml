name: MARINA P0 Runtime Inventory Safety CI

on:
  pull_request:
    paths:
      - 'scripts/marina_runtime_inventory_readonly.py'
      - 'scripts/test_marina_runtime_inventory_readonly.py'
      - '.github/workflows/marina-runtime-inventory-safety-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile read-only inventory
        run: python -m py_compile scripts/marina_runtime_inventory_readonly.py
      - name: Run isolated inventory safety tests
        run: python -m unittest discover -s scripts -p 'test_marina_runtime_inventory_readonly.py' -v
      - name: Verify no environment values are collected
        run: |
          ! grep -En 'docker.*exec|compose.*up|os\.environ|printenv|env_file|DATABASE_URL|TOKEN_INSTANCE' scripts/marina_runtime_inventory_readonly.py
      - name: Permit only narrow container image ID inspection
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("scripts/marina_runtime_inventory_readonly.py").read_text()
          assert '["docker", "inspect", "--type", "container"' in source
          assert '"--format", "{{.Image}}", name]' in source
          assert '["docker", "inspect"]' not in source
          print("MARINA_IMAGE_ID_INSPECTION_SCOPE_PASS")
          PY
