name: Three Crowns Full Staging Gate

on:
  push:
    branches:
      - main
      - integration/site-pms-cms-20260827
    paths:
      - 'apps/**'
      - 'services/api/**'
      - 'packages/database/**'
      - 'scripts/**'
      - 'data-intake/**'
      - 'compose.staging.yaml'
      - '.env.staging.example'
      - '.github/workflows/staging-full-gate-ci.yml'
  pull_request:
    paths:
      - 'apps/**'
      - 'services/api/**'
      - 'packages/database/**'
      - 'scripts/**'
      - 'data-intake/**'
      - 'compose.staging.yaml'
      - '.env.staging.example'
      - '.github/workflows/staging-full-gate-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staging-full-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_ENV: staging
      POSTGRES_DB: resort_os_staging_ci
      POSTGRES_USER: resort_staging
      PROPERTY_CODE: THREE_CROWNS
      RATE_PLAN_CODE: DIRECT_2026_27
      CORE_API_URL: http://127.0.0.1:18000
      CORE_WS_URL: ws://127.0.0.1:18000
      CORS_ORIGINS: ''
      NEXT_PUBLIC_CORE_WS_URL: ws://127.0.0.1:18000
      SESSION_TTL_HOURS: '8'
      COOKIE_SECURE: 'false'
      REQUIRE_COOKIE_DOMAIN: 'false'
      COOKIE_DOMAIN: ''
      AUTOMATION_SERVICE_NAME: n8n-staging
      REQUIRE_AUTOMATION_SERVICE: 'true'
      EXPECTED_ROOM_COUNT: '84'
      EXPECTED_ROOM_TYPE_COUNT: '12'
      REQUIRE_MIGRATION_HISTORY: 'true'
      REQUIRE_RECENT_BACKUP: 'false'
      LAST_VERIFIED_BACKUP_AT: ''
      MAX_BACKUP_AGE_HOURS: ''
      STAGING_ACCEPTANCE_MUTATIONS: I_UNDERSTAND_SYNTHETIC_WRITES
      GUEST_OS_PUBLIC_BASE_URL: http://127.0.0.1:13000
      SERVICE_POINT_PUBLIC_BASE_URL: http://127.0.0.1:13000
      BOOTSTRAP_OWNER_USERNAME: staging-owner
      BOOTSTRAP_OWNER_PASSWORD: staging-owner-password-2026
      BOOTSTRAP_OWNER_DISPLAY_NAME: Staging Owner
      DINING_STAFF_USERNAME: staging-dining
      DINING_STAFF_PASSWORD: staging-dining-password-2026
      RECEPTION_USERNAME: staging-reception
      RECEPTION_PASSWORD: staging-reception-password-2026
      MAID_USERNAME: staging-maid
      MAID_PASSWORD: staging-maid-password-2026
      TECHNICIAN_USERNAME: staging-technician
      TECHNICIAN_PASSWORD: staging-technician-password-2026

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            packages/database/package-lock.json
            apps/web/package-lock.json
            apps/admin/package-lock.json
            apps/staff/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/requirements.txt

      - name: Install PostgreSQL client and utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Start isolated PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name resort-postgres-staging \
            -e POSTGRES_DB="$POSTGRES_DB" \
            -e POSTGRES_USER="$POSTGRES_USER" \
            -e POSTGRES_PASSWORD=resort_staging_password \
            -p 15432:5432 postgres:16-alpine
          for i in {1..30}; do
            if PGPASSWORD=resort_staging_password pg_isready -h 127.0.0.1 -p 15432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"; then
              exit 0
            fi
            sleep 1
          done
          docker logs resort-postgres-staging
          exit 1

      - name: Export database URL
        run: echo "DATABASE_URL=postgresql://${POSTGRES_USER}:resort_staging_password@127.0.0.1:15432/${POSTGRES_DB}?schema=public" >> "$GITHUB_ENV"

      - name: Install database package
        working-directory: packages/database
        run: npm ci --no-audit --no-fund

      - name: Validate and deploy exact migration chain
        working-directory: packages/database
        run: |
          npx prisma validate
          npx prisma migrate deploy
          npx prisma migrate status

      - name: Install Resort Core dependencies
        run: pip install -r services/api/requirements.txt

      - name: Validate release/data truth and seed canonical hotel
        run: |
          python scripts/release_contract_test.py
          python scripts/release_rc_truth_guard.py --allow-non-accepted-head
          python scripts/owner_corrections_truth_guard.py
          python scripts/public_site_truth_guard.py
          python scripts/owner_guest_facts_guard.py
          python scripts/seed_from_intake.py
          python scripts/bootstrap_owner.py
          python scripts/bootstrap_dining_staff.py
          python scripts/bootstrap_staging_users.py

      - name: Build public, admin and staff apps
        shell: bash
        run: |
          set -euo pipefail
          for app in web admin staff; do
            pushd "apps/${app}"
            npm ci --no-audit --no-fund
            npm run typecheck
            npm run build
            popd
          done

      - name: Start Resort Core
        run: |
          python -m uvicorn app.app_entry:app --app-dir services/api --host 127.0.0.1 --port 18000 > /tmp/staging-core.log 2>&1 &
          echo $! > /tmp/staging-core.pid
          for i in {1..40}; do
            curl --fail -sS http://127.0.0.1:18000/health/ready >/tmp/staging-ready.json 2>/dev/null && exit 0
            sleep 1
          done
          cat /tmp/staging-core.log || true
          exit 1

      - name: Start public web
        working-directory: apps/web
        run: |
          PORT=13000 CORE_API_URL=http://127.0.0.1:18000 npm start > /tmp/staging-web.log 2>&1 &
          echo $! > /tmp/staging-web.pid

      - name: Start admin
        working-directory: apps/admin
        run: |
          PORT=13001 CORE_API_URL=http://127.0.0.1:18000 npm start > /tmp/staging-admin.log 2>&1 &
          echo $! > /tmp/staging-admin.pid

      - name: Start staff
        working-directory: apps/staff
        run: |
          PORT=13002 CORE_API_URL=http://127.0.0.1:18000 npm start > /tmp/staging-staff.log 2>&1 &
          echo $! > /tmp/staging-staff.pid

      - name: Wait for Next apps
        shell: bash
        run: |
          set -euo pipefail
          for port in 13000 13001 13002; do
            for i in {1..40}; do
              if curl --fail -sS "http://127.0.0.1:${port}" >/dev/null 2>&1; then break; fi
              sleep 1
            done
            curl --fail -sS "http://127.0.0.1:${port}" >/dev/null
          done

      - name: Run full synthetic staging acceptance
        env:
          PUBLIC_URL: http://127.0.0.1:13000
          ADMIN_URL: http://127.0.0.1:13001
          STAFF_URL: http://127.0.0.1:13002
        run: |
          python scripts/staging_acceptance.py
          python scripts/release_060_e2e.py

      - name: Prove NFC remains absent from active V1 schema/runtime
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n -E 'nfc_wallet|nfc_transaction|process_nfc_payment' packages/database/prisma/migrations services/api/app apps || {
            echo 'Active V1 contains forbidden NFC transaction runtime/schema'; exit 1;
          }

      - name: Show logs on failure
        if: failure()
        run: |
          cat /tmp/staging-core.log || true
          cat /tmp/staging-web.log || true
          cat /tmp/staging-admin.log || true
          cat /tmp/staging-staff.log || true

      - name: Stop services
        if: always()
        shell: bash
        run: |
          for file in /tmp/staging-core.pid /tmp/staging-web.pid /tmp/staging-admin.pid /tmp/staging-staff.pid; do
            if [ -f "$file" ]; then kill "$(cat "$file")" 2>/dev/null || true; fi
          done
          docker rm -f resort-postgres-staging >/dev/null 2>&1 || true
