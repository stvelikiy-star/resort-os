name: MARINA Native Pinned LIVE-QA Connection Build
on:
  pull_request:
    paths:
      - '.github/workflows/marina-native-live-qa-build-ci.yml'
      - 'scripts/design/fl2-native-qa-connect.yaml'
      - 'scripts/design/fl2-native-qa-connect.sh'
  workflow_dispatch:
    inputs:
      run_android:
        description: 'Recheck previously accepted Android only when explicitly requested'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: marina-native-live-qa-build
  cancel-in-progress: true

jobs:
  android-native:
    if: github.event_name == 'workflow_dispatch' && inputs.run_android == true
    name: Android 35 QA-origin APK + login screen
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      CI: 'true'
      EXPO_PUBLIC_MARINA_TRUSTED_API_ORIGINS: 'https://agent-vivobook-asuslaptop-x412ua.tail2066a4.ts.net/core'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify QA TLS and single-property authentication mode
        run: |
          set -euo pipefail
          origin="$EXPO_PUBLIC_MARINA_TRUSTED_API_ORIGINS"
          test "$origin" = 'https://agent-vivobook-asuslaptop-x412ua.tail2066a4.ts.net/core'
          curl -fsS --connect-timeout 10 --max-time 20 -o /dev/null "$origin/health/ready"
          curl -fsS --connect-timeout 10 --max-time 20 "$origin/api/v1/auth/mode" > "$RUNNER_TEMP/marina-qa-mode.json"
          python3 - <<'PY'
          import json,os
          p=os.path.join(os.environ['RUNNER_TEMP'],'marina-qa-mode.json')
          d=json.load(open(p))
          assert d.get('mode')=='single_property', 'QA auth mode is not single-property'
          print('QA_HTTPS_SINGLE_PROPERTY_PRECHECK_PASS')
          PY
      - name: Build QA-origin standalone Android APK (no hotel credentials)
        working-directory: apps/mobile
        run: |
          npm ci --no-audit --no-fund
          npx expo install --check
          npx expo prebuild --platform android --no-install --non-interactive
          cd android
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Validate Android package and bundled JavaScript
        run: |
          set -euo pipefail
          apk=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          unzip -Z1 "$apk" | grep -Fx 'assets/index.android.bundle'
          aapt=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$aapt" dump badging "$apk" | grep -F "package: name='kg.go.ms.staff'"
          if "$aapt" dump permissions "$apk" | grep -F 'android.permission.SYSTEM_ALERT_WINDOW'; then
            echo 'FAIL: forbidden overlay permission'; exit 1
          fi
      - name: Upload installable Android APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marina-qa-android-origin-pinned-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
          if-no-files-found: warn
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-marina-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 35 native trusted QA login
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          disk-size: 6000M
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash scripts/design/fl2-native-qa-connect.sh
      - name: Upload Android native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marina-qa-android-login-proof
          path: android-qa-evidence/
          retention-days: 7
          if-no-files-found: warn

  ios-simulator:
    name: iOS QA-origin Simulator + login screen
    runs-on: macos-26-intel
    timeout-minutes: 140
    env:
      CI: 'true'
      EXPO_PUBLIC_MARINA_TRUSTED_API_ORIGINS: 'https://agent-vivobook-asuslaptop-x412ua.tail2066a4.ts.net/core'
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '360000'
      MAESTRO_CLI_NO_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify QA TLS and single-property authentication mode
        run: |
          set -euo pipefail
          origin="$EXPO_PUBLIC_MARINA_TRUSTED_API_ORIGINS"
          test "$origin" = 'https://agent-vivobook-asuslaptop-x412ua.tail2066a4.ts.net/core'
          curl -fsS --connect-timeout 10 --max-time 20 -o /dev/null "$origin/health/ready"
          curl -fsS --connect-timeout 10 --max-time 20 "$origin/api/v1/auth/mode" > "$RUNNER_TEMP/marina-qa-mode.json"
          python3 - <<'PY'
          import json,os
          p=os.path.join(os.environ['RUNNER_TEMP'],'marina-qa-mode.json')
          d=json.load(open(p))
          assert d.get('mode')=='single_property', 'QA auth mode is not single-property'
          print('QA_HTTPS_SINGLE_PROPERTY_PRECHECK_PASS')
          PY
      - name: Preflight Xcode iOS Simulator
        run: |
          xcodebuild -version
          xcode_major=$(xcodebuild -version | awk '/^Xcode / {split($2,parts,"."); print parts[1]}')
          test "${xcode_major:-0}" -ge 26 || { echo "FAIL: Expo 58 needs Xcode 26.4+"; exit 1; }
          xcrun simctl list devices available
          mkdir -p ios-simulator-evidence
      - name: Prepare simulator-only iOS bundle identifier (no App Store signing)
        working-directory: apps/mobile
        run: |
          npm ci --no-audit --no-fund
          npx expo install --check
          node - <<'NODE'
          const fs=require('fs');
          const f='app.json';
          const cfg=JSON.parse(fs.readFileSync(f,'utf8'));
          cfg.expo.ios=cfg.expo.ios||{};
          cfg.expo.ios.bundleIdentifier='kg.go.ms.staff';
          fs.writeFileSync(f, JSON.stringify(cfg,null,2)+'\n');
          console.log('SIMULATOR_ONLY_BUNDLE_ID=kg.go.ms.staff; source repo unchanged');
          NODE
          npx expo prebuild --platform ios --no-install --non-interactive
      - name: CocoaPods dependencies
        working-directory: apps/mobile/ios
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: pod install
      - name: Build offline release for iOS Simulator without Apple credentials
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          workspace=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$workspace"
          scheme=$(basename "$workspace" .xcworkspace)
          echo "XCODE_WORKSPACE=$workspace SCHEME=$scheme"
          # Keep the Xcode output private but expose progress and failure reasons.
          # A Python watchdog prevents indefinite silent macOS CI compilation.
          python3 -u - "$workspace" "$scheme" <<'PY'
          import os, pathlib, subprocess, sys, time
          workspace, scheme = sys.argv[1:]
          log = pathlib.Path(os.environ["RUNNER_TEMP"]) / "marina-xcodebuild.log"
          cmd = ["xcodebuild", "-workspace", workspace, "-scheme", scheme,
                 "-configuration", "Release", "-sdk", "iphonesimulator",
                 "-destination", "generic/platform=iOS Simulator",
                 "-derivedDataPath", str(pathlib.Path(os.environ["RUNNER_TEMP"]) / "MarinaDerived"),
                 "CODE_SIGNING_ALLOWED=NO", "CODE_SIGNING_REQUIRED=NO", "build"]
          print("IOS_XCODEBUILD_START", flush=True)
          with log.open("wb") as out:
              proc = subprocess.Popen(cmd, stdout=out, stderr=subprocess.STDOUT, start_new_session=True)
              started = time.monotonic()
              last_size = -1
              while proc.poll() is None:
                  time.sleep(30)
                  size = log.stat().st_size
                  print(f"IOS_XCODEBUILD_HEARTBEAT elapsed_s={int(time.monotonic()-started)} log_bytes={size} growing={size != last_size}", flush=True)
                  last_size = size
                  if time.monotonic() - started > 3600:
                      import signal
                      os.killpg(proc.pid, signal.SIGTERM)
                      try: proc.wait(timeout=15)
                      except subprocess.TimeoutExpired: os.killpg(proc.pid, signal.SIGKILL)
                      print("IOS_XCODEBUILD_TIMEOUT_60_MIN", flush=True)
                      break
              result = proc.poll()
          if result != 0:
              lines = log.read_text(errors="replace").splitlines()
              errors = [(i+1, line) for i,line in enumerate(lines) if any(x in line.lower() for x in ("error:", "fatal error", "** build failed **"))]
              print("IOS_XCODEBUILD_ERRORS", errors[-30:], flush=True)
              print("IOS_XCODEBUILD_LOG_TAIL", "\\n".join(lines[-50:]), flush=True)
              sys.exit(1)
          print("IOS_XCODEBUILD_COMPLETED", flush=True)
          PY
          app=$(find "$RUNNER_TEMP/MarinaDerived/Build/Products/Release-iphonesimulator" -maxdepth 1 -name '*.app' -print -quit)
          test -d "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")" = "kg.go.ms.staff"
          echo "IOS_APP_PATH=$app" >> "$GITHUB_ENV"
          echo 'IOS_UNSIGNED_SIMULATOR_BUILD_PASS'
      - name: Package unsigned iOS Simulator app for review
        run: |
          set -euo pipefail
          test -d "$IOS_APP_PATH"
          mkdir -p ios-simulator-evidence
          cd "$(dirname "$IOS_APP_PATH")"
          zip -qry "$GITHUB_WORKSPACE/ios-simulator-evidence/MARINA_SMART_iOS_Simulator.zip" "$(basename "$IOS_APP_PATH")"
          test -s "$GITHUB_WORKSPACE/ios-simulator-evidence/MARINA_SMART_iOS_Simulator.zip"
      - name: Upload unsigned iOS Simulator application
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marina-qa-ios-origin-pinned-app
          path: ios-simulator-evidence/MARINA_SMART_iOS_Simulator.zip
          retention-days: 14
          if-no-files-found: warn
      - name: Boot iPhone Simulator, install app, capture native proof
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; j=json.load(sys.stdin); d=[x for a in j["devices"].values() for x in a if x.get("isAvailable") and "iPhone" in x.get("name","")]; print(d[0]["udid"] if d else "")')
          test -n "$udid"
          echo "IOS_SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "$IOS_APP_PATH"
          xcrun simctl launch "$udid" kg.go.ms.staff
          sleep 16
          xcrun simctl io "$udid" screenshot ios-simulator-evidence/ios-first-launch.png
          test -s ios-simulator-evidence/ios-first-launch.png
          echo 'IOS_NATIVE_INSTALL_LAUNCH_SCREENSHOT_PASS'
      - name: Maestro iOS pinned QA login screen
        run: |
          set -euo pipefail
          curl -fsSL https://get.maestro.mobile.dev -o /tmp/marina-maestro-qa-install.sh
          bash /tmp/marina-maestro-qa-install.sh
          test -x "$HOME/.maestro/bin/maestro"
          if ! "$HOME/.maestro/bin/maestro" test scripts/design/fl2-native-qa-connect.yaml > "$RUNNER_TEMP/marina-qa-maestro-private.log" 2>&1; then
            xcrun simctl io "$IOS_SIMULATOR_UDID" screenshot ios-simulator-evidence/failure-login.png || true
            echo 'NATIVE_QA_IOS_LOGIN_SCREEN_FAIL (private log not uploaded)'
            exit 1
          fi
          xcrun simctl io "$IOS_SIMULATOR_UDID" screenshot ios-simulator-evidence/login.png
          echo 'NATIVE_QA_IOS_LOGIN_SCREEN_PASS; authentication NOT tested'
      - name: Upload iOS native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marina-qa-ios-login-proof
          path: ios-simulator-evidence/
          retention-days: 7
          if-no-files-found: warn
