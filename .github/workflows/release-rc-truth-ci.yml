name: Release RC Truth CI

on:
  pull_request:
    branches:
      - main
      - integration/site-pms-cms-20260827
  push:
    branches:
      - main
      - integration/site-pms-cms-20260827
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-rc-truth:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile RC truth guard
        run: python -m py_compile scripts/release_rc_truth_guard.py

      - name: Verify frozen release candidate truth
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Pull requests may represent a controlled next candidate. Validate the
            # current manifest/docs contract without requiring PR HEAD itself to be
            # identical to the already accepted executable tree.
            python scripts/release_rc_truth_guard.py --allow-non-accepted-head
          else
            # Direct main/integration pushes remain strict and fail closed on
            # executable drift until a release is explicitly refrozen.
            python scripts/release_rc_truth_guard.py
          fi

      - name: Verify main production-source boundary remains fail-closed
        shell: bash
        run: |
          python - <<'PY'
          import json
          rc = json.load(open('release/current-rc.json', encoding='utf-8'))
          assert rc['release_version'] == '0.61.0'
          assert rc['production_source_branch'] == 'main'
          assert rc['main_allowed_as_production_source'] is True
          assert rc['production_cutover_authorized'] is False
          assert rc['external_beget_staging_verified'] is False
          assert rc['legacy_live_rollback_verified'] is False
          print('PASS: main is the frozen source branch while external production cutover remains STOP')
          PY
