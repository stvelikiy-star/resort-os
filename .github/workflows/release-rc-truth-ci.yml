name: Release RC Truth CI

on:
  pull_request:
    branches:
      - main
      - integration/site-pms-cms-20260827
  push:
    branches:
      - main
      - integration/site-pms-cms-20260827
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-rc-truth:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile RC truth guard
        run: python -m py_compile scripts/release_rc_truth_guard.py

      - name: Verify historical release 0.62.2 contract (unchanged)
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.ref_name }}" = "main" ]; then
            # The historical 0.62.2 assertions are still checked. A separate
            # fail-closed November guard verifies the current main source tree.
            python scripts/release_rc_truth_guard.py --allow-non-accepted-head
          else
            python scripts/release_rc_truth_guard.py
          fi

      - name: Verify November MARINA SMART release boundary negative cases
        run: python scripts/verify_marina_november_release_boundary.py --self-test

      - name: Verify November main executable source and historical separation
        if: github.ref_name == 'main' || github.base_ref == 'main'
        run: python scripts/verify_marina_november_release_boundary.py

      - name: Verify main production-source boundary remains fail-closed
        shell: bash
        run: |
          python - <<'PY'
          import json
          rc = json.load(open('release/current-rc.json', encoding='utf-8'))
          assert rc['release_version'] == '0.62.2'
          assert rc['production_source_branch'] == 'main'
          assert rc['main_allowed_as_production_source'] is True
          assert rc['production_cutover_authorized'] is False
          assert rc['external_beget_staging_verified'] is False
          assert rc['legacy_live_rollback_verified'] is False
          print('PASS: main is the frozen source branch while external production cutover remains STOP')
          PY
