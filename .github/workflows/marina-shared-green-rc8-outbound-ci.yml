name: MARINA Shared GREEN-API RC8 Human Outbound CI

on:
  pull_request:
    paths:
      - 'services/api/app/green_api_webhook.py'
      - 'services/api/app/shared_green_rc7.py'
      - 'services/api/app/main.py'
      - 'services/api/app/app_entry.py'
      - 'scripts/marina_shared_green_rc7_webhook_ci.py'
      - 'services/api/app/green_outbound.py'
      - 'services/api/app/shared_green_rc8.py'
      - 'services/api/app/channel_outbound.py'
      - 'scripts/marina_shared_green_rc8_outbound_ci.py'
      - '.github/workflows/marina-shared-green-rc8-outbound-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  green-human-outbound-two-hotels:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_DB: marina_shared_browser_ci
          POSTGRES_USER: marina_ci
          POSTGRES_PASSWORD: synthetic-ci-database-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U marina_ci -d marina_shared_browser_ci"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql://marina_ci:synthetic-ci-database-only@127.0.0.1:5432/marina_shared_browser_ci?schema=public
      PYTHONPATH: services/api:scripts
      APP_ENV: staging
      PROPERTY_CODE: MARINA_BROWSER_CI
      RATE_PLAN_CODE: MARINA_BROWSER_CI
      MARINA_TENANT_CONTEXT_ENABLED: 'true'
      MARINA_SHARED_AUTH_PREVIEW_ENABLED: 'true'
      MARINA_SHARED_BROWSER_CI_CONFIRM: DISPOSABLE_TWO_HOTEL_BROWSER_CI
      MARINA_SHARED_GREEN_RC7_CI_CONFIRM: ISOLATED_TWO_HOTEL_GREEN_WEBHOOK_CI_ONLY
      MARINA_SHARED_GREEN_RC8_CI_CONFIRM: ISOLATED_TWO_HOTEL_HUMAN_OUTBOUND_CI_ONLY
      COOKIE_SECURE: 'true'
      COOKIE_DOMAIN: ''
      AUTH_TRUST_PROXY_HEADERS: 'false'
      MARINA_SHARED_GUEST_QR_RC4_ENABLED: 'true'
      MARINA_SHARED_GUEST_QR_RC4_CONFIRM: REVIEWED_SHARED_GUEST_QR_STAGING_ONLY
      MARINA_SHARED_GUEST_QR_RC4_ORIGIN: https://green-rc7-ci.invalid
      GUEST_OS_PUBLIC_BASE_URL: https://green-rc7-ci.invalid
      MARINA_SHARED_INBOX_RC5_ENABLED: 'true'
      MARINA_SHARED_INBOX_RC5_CONFIRM: REVIEWED_SHARED_INBOX_STAGING_ONLY
      MARINA_SHARED_GREEN_RC6_ENABLED: 'true'
      MARINA_SHARED_GREEN_RC6_CONFIRM: REVIEWED_SHARED_GREEN_QR_STAGING_ONLY
      MARINA_SHARED_GREEN_RC7_ENABLED: 'true'
      MARINA_SHARED_GREEN_RC7_CONFIRM: REVIEWED_SHARED_GREEN_WEBHOOK_STAGING_ONLY
      MARINA_SHARED_GREEN_RC8_ENABLED: 'true'
      MARINA_SHARED_GREEN_RC8_CONFIRM: REVIEWED_HUMAN_WHATSAPP_SEND_STAGING_ONLY
      ENABLE_GREEN_API_CONNECTION: 'true'
      ENABLE_PAYMENT_OPERATIONS: 'false'
      ENABLE_MKASSA: 'false'
      ENABLE_SERVICE_POINT_QR: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate random synthetic owner identity on exact PR HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          password="synthetic-ci-only-$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "MARINA_SHARED_BROWSER_CI_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Apply immutable migrations to a fresh disposable database
        working-directory: packages/database
        run: |
          npm ci --no-audit --no-fund
          npx prisma migrate deploy
      - name: Install canonical API dependencies
        run: python -m pip install -r services/api/requirements.txt
      - name: Compile callback, middleware and webhook E2E
        run: |
          python -m py_compile \
            services/api/app/green_api_webhook.py \
            services/api/app/shared_green_rc7.py \
            services/api/app/shared_green_rc8.py \
            services/api/app/green_outbound.py \
            services/api/app/channel_outbound.py \
            services/api/app/main.py \
            services/api/app/app_entry.py \
            scripts/marina_shared_green_rc8_outbound_ci.py
      - name: Seed unrelated hotels, authenticated owners and distinct rates
        run: python scripts/marina_shared_live_browser_db.py seed
      - name: Verify two-hotel human WhatsApp replies and webhook-confirmed sending
        run: timeout --signal=SIGTERM --kill-after=15s 180s python -u scripts/marina_shared_green_rc8_outbound_ci.py
