name: PMS Chessboard Mutation CI

on:
  push:
    branches: [main]
    paths:
      - 'services/api/**'
      - 'packages/database/**'
      - 'scripts/**'
      - 'apps/admin/**'
      - '.github/workflows/pms-chessboard-ci.yml'
  pull_request:
    paths:
      - 'services/api/**'
      - 'packages/database/**'
      - 'scripts/**'
      - 'apps/admin/**'
      - '.github/workflows/pms-chessboard-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chessboard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: resort_os
          POSTGRES_USER: resort
          POSTGRES_PASSWORD: resort
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resort -d resort_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://resort:resort@localhost:5432/resort_os?schema=public
      PROPERTY_CODE: THREE_CROWNS
      RATE_PLAN_CODE: DIRECT_2026_27
      BOOTSTRAP_OWNER_USERNAME: ci-owner
      BOOTSTRAP_OWNER_PASSWORD: CI-Only-Strong-Password-2026
      BOOTSTRAP_OWNER_DISPLAY_NAME: CI Owner
      COOKIE_SECURE: false
      CORE_API_URL: http://127.0.0.1:8000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve hotel-local test dates
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          today = datetime.now(ZoneInfo('Asia/Bishkek')).date()
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              for i in range(6):
                  f.write(f'D{i}={(today + timedelta(days=i)).isoformat()}\n')
          PY

      - name: Create development database
        working-directory: packages/database
        run: |
          npm install --no-audit --no-fund
          npx prisma validate
          npx prisma db push

      - name: Typecheck and build PMS admin V2
        working-directory: apps/admin
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: services/api/requirements.txt

      - name: Install Core and seed
        run: |
          pip install -r services/api/requirements.txt
          python -m compileall services/api/app scripts
          python scripts/apply_core_constraints.py
          python scripts/seed_from_intake.py
          python scripts/bootstrap_owner.py

      - name: Start Core and login
        run: |
          python -m uvicorn app.app_entry:app --app-dir services/api --host 127.0.0.1 --port 8000 > /tmp/chessboard-api.log 2>&1 &
          sleep 3
          curl --fail -sS -c /tmp/cookies.txt -X POST http://127.0.0.1:8000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci-owner","password":"CI-Only-Strong-Password-2026"}' > /tmp/login.json

      - name: Create manager-confirmed guaranteed reservation
        run: |
          curl --fail -sS "http://127.0.0.1:8000/api/v1/booking/check-availability?check_in=$D0&check_out=$D4&adults=2&children=0" > /tmp/availability.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/availability.json'))
          sellable=[x for x in d['results'] if x['pricing']['sellable'] and len(x['available_rooms']) >= 3]
          assert sellable, 'need a room type with at least three rooms for chessboard test'
          x=sellable[0]
          open('/tmp/type','w').write(x['room_type_code'])
          json.dump(x['available_rooms'][:3],open('/tmp/rooms.json','w'))
          PY
          TYPE=$(cat /tmp/type)
          curl --fail -sS -X POST http://127.0.0.1:8000/api/v1/booking/requests \
            -H 'Content-Type: application/json' \
            -d "{\"guest_name\":\"Chessboard Guest\",\"phone\":\"+996555111222\",\"check_in\":\"$D0\",\"check_out\":\"$D4\",\"adults\":2,\"children\":0,\"room_type_code\":\"$TYPE\",\"source\":\"CI_CHESSBOARD\"}" > /tmp/request.json
          RID=$(python -c 'import json; print(json.load(open("/tmp/request.json"))["id"])')
          curl --fail -sS -b /tmp/cookies.txt -X POST "http://127.0.0.1:8000/api/v1/admin/booking/requests/$RID/quote" \
            -H 'Content-Type: application/json' -d "{\"room_type_code\":\"$TYPE\"}" > /tmp/quote.json
          curl --fail -sS -b /tmp/cookies.txt -X POST "http://127.0.0.1:8000/api/v1/admin/booking/requests/$RID/confirm-payment" \
            -H 'Content-Type: application/json' \
            -d '{"amount_kgs":777,"method":"MANAGER_MANUAL","provider":"MANAGER_MANUAL","external_ref":"chessboard-ci-pay","idempotency_key":"chessboard-ci-payment-0001"}' > /tmp/reservation.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/reservation.json'))
          open('/tmp/reservation_id','w').write(d['reservation_id'])
          PY

      - name: Read canonical schedule and choose free targets
        run: |
          RID=$(cat /tmp/reservation_id)
          curl --fail -sS -b /tmp/cookies.txt "http://127.0.0.1:8000/api/v1/admin/pms/reservations/$RID/schedule" > /tmp/schedule0.json
          python - <<'PY'
          import json
          schedule=json.load(open('/tmp/schedule0.json'))
          rooms=json.load(open('/tmp/rooms.json'))
          current=schedule['schedule'][0]['room_id']
          targets=[r for r in rooms if r['id'] != current]
          assert len(targets)>=2
          open('/tmp/target1','w').write(targets[0]['id'])
          open('/tmp/target2','w').write(targets[1]['id'])
          assert schedule['reservation']['status']=='GUARANTEED'
          assert schedule['reservation']['stored_total_kgs'] > 0
          PY

      - name: Preview and atomically move entire booking
        run: |
          RID=$(cat /tmp/reservation_id)
          TARGET=$(cat /tmp/target1)
          cat > /tmp/move.json <<JSON
          {"segments":[{"room_id":"$TARGET","start":"$D0","end":"$D4"}]}
          JSON
          curl --fail -sS -b /tmp/cookies.txt -X POST "http://127.0.0.1:8000/api/v1/admin/pms/reservations/$RID/schedule/preview" \
            -H 'Content-Type: application/json' --data-binary @/tmp/move.json > /tmp/move-preview.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/move-preview.json'))
          assert d['can_commit'] is True
          assert d['conflicts']==[]
          assert d['pricing']['stored_total_will_change_on_commit'] is False
          open('/tmp/version0','w').write(d['reservation']['version'])
          PY
          python - <<'PY'
          import json
          d=json.load(open('/tmp/move.json'))
          d['expected_version']=open('/tmp/version0').read().strip()
          json.dump(d,open('/tmp/move-commit.json','w'))
          PY
          curl --fail -sS -b /tmp/cookies.txt -X POST "http://127.0.0.1:8000/api/v1/admin/pms/reservations/$RID/schedule/commit" \
            -H 'Content-Type: application/json' --data-binary @/tmp/move-commit.json > /tmp/moved.json
          python -c 'import json; d=json.load(open("/tmp/moved.json")); assert d["ok"] is True; open("/tmp/version1","w").write(d["version"])'

      - name: Reject stale manager snapshot without changing schedule
        run: |
          RID=$(cat /tmp/reservation_id)
          CODE=$(curl -sS -o /tmp/stale.json -w '%{http_code}' -b /tmp/cookies.txt -X POST "http://127.0.0.1:8000/api/v1/admin/pms/reservations/$RID/schedule/commit" \
            -H 'Content-Type: application/json' --data-binary @/tmp/move-commit.json)
          test "$CODE" = "409"
          python -c 'import json; assert json.load(open("/tmp/stale.json"))["detail"]["code"]=="STALE_RESERVATION"'

      - name: Resize and split reservation across two rooms
        run: |
          RID=$(cat /tmp/reservation_id)
          ROOM1=$(cat /tmp/target1)
          ROOM2=$(cat /tmp/target2)
          cat > /tmp/split.json <<JSON
          {"segments":[
            {"room_id":"$ROOM1","start":"$D0","end":"$D2"},
            {"room_id":"$ROOM2","start":"$D2","end":"$D5"}
          ]}
          JSON
          curl --fail -sS -b /tmp/cookies.txt -X POST "http://127.0.0.1:8000/api/v1/admin/pms/reservations/$RID/schedule/preview" \
            -H 'Content-Type: application/json' --data-binary @/tmp/split.json > /tmp/split-preview.json
          python - <<'PY'
          import json, os
          d=json.load(open('/tmp/split-preview.json'))
          assert d['can_commit'] is True
          assert d['proposed_check_out']==os.environ['D5']
          assert len(d['proposed_schedule'])==2
          x=json.load(open('/tmp/split.json'))
          x['expected_version']=open('/tmp/version1').read().strip()
          json.dump(x,open('/tmp/split-commit.json','w'))
          PY
          curl --fail -sS -b /tmp/cookies.txt -X POST "http://127.0.0.1:8000/api/v1/admin/pms/reservations/$RID/schedule/commit" \
            -H 'Content-Type: application/json' --data-binary @/tmp/split-commit.json > /tmp/split-result.json
          python - <<'PY'
          import json, os
          d=json.load(open('/tmp/split-result.json'))
          assert d['check_out']==os.environ['D5']
          assert len(d['schedule'])==2
          open('/tmp/version2','w').write(d['version'])
          PY

      - name: Check-in requires first room to be CLEAN
        run: |
          RID=$(cat /tmp/reservation_id)
          python - <<'PY'
          import os,asyncio,asyncpg,uuid
          async def main():
              conn=await asyncpg.connect(os.environ['DATABASE_URL'].split('?')[0])
              try:
                  await conn.execute('UPDATE rooms SET "operationalState"=\'DIRTY\' WHERE id=$1',uuid.UUID(open('/tmp/target1').read().strip()))
              finally: await conn.close()
          asyncio.run(main())
          PY
          CODE=$(curl -sS -o /tmp/checkin-blocked.json -w '%{http_code}' -b /tmp/cookies.txt -X POST "http://127.0.0.1:8000/api/v1/admin/stays/reservations/$RID/check-in")
          test "$CODE" = "409"
          python -c 'import json; d=json.load(open("/tmp/checkin-blocked.json")); assert d["detail"]["code"]=="CHECK_IN_ROOM_NOT_READY"'
          python - <<'PY'
          import os,asyncio,asyncpg,uuid
          async def main():
              conn=await asyncpg.connect(os.environ['DATABASE_URL'].split('?')[0])
              try:
                  await conn.execute('UPDATE rooms SET "operationalState"=\'CLEAN\' WHERE id=$1',uuid.UUID(open('/tmp/target1').read().strip()))
              finally: await conn.close()
          asyncio.run(main())
          PY
          curl --fail -sS -b /tmp/cookies.txt -X POST "http://127.0.0.1:8000/api/v1/admin/stays/reservations/$RID/check-in" > /tmp/checkin.json
          python -c 'import json; d=json.load(open("/tmp/checkin.json")); assert d["status"]=="CHECKED_IN"; assert d["room_state"]=="CLEAN"'

      - name: Immediate relocation preserves lived history and dirties vacated room
        run: |
          RID=$(cat /tmp/reservation_id)
          curl --fail -sS -b /tmp/cookies.txt "http://127.0.0.1:8000/api/v1/admin/pms/reservations/$RID/schedule" > /tmp/pre-relocate-schedule.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/pre-relocate-schedule.json'))
          effective=d['local_today']
          checkout=d['reservation']['check_out']
          target=open('/tmp/target2').read().strip()
          kept=[]
          for item in d['schedule']:
              if item['end'] <= effective:
                  kept.append({'room_id':item['room_id'],'start':item['start'],'end':item['end']})
                  continue
              if item['start'] < effective < item['end']:
                  kept.append({'room_id':item['room_id'],'start':item['start'],'end':effective})
              break
          assert effective < checkout, (effective, checkout)
          kept.append({'room_id':target,'start':effective,'end':checkout})
          json.dump({'segments':kept},open('/tmp/relocate.json','w'))
          PY
          curl --fail -sS -b /tmp/cookies.txt -X POST "http://127.0.0.1:8000/api/v1/admin/pms/reservations/$RID/schedule/preview" \
            -H 'Content-Type: application/json' --data-binary @/tmp/relocate.json > /tmp/relocate-preview.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/relocate-preview.json'))
          assert d['can_commit'] is True
          assert d['immediate_relocation']
          assert d['immediate_relocation']['vacated_room_will_become_dirty'] is True
          x=json.load(open('/tmp/relocate.json'))
          x['expected_version']=open('/tmp/version2').read().strip()
          json.dump(x,open('/tmp/relocate-commit.json','w'))
          PY
          curl --fail -sS -b /tmp/cookies.txt -X POST "http://127.0.0.1:8000/api/v1/admin/pms/reservations/$RID/schedule/commit" \
            -H 'Content-Type: application/json' --data-binary @/tmp/relocate-commit.json > /tmp/relocate-result.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/relocate-result.json'))
          assert d['immediate_relocation']
          assert d['relocation_housekeeping_task_id']
          open('/tmp/version3','w').write(d['version'])
          PY
          curl --fail -sS -b /tmp/cookies.txt "http://127.0.0.1:8000/api/v1/admin/pms/reservations/$RID/schedule" > /tmp/relocated-schedule.json
          python - <<'PY'
          import os,asyncio,asyncpg,uuid,json
          async def main():
              conn=await asyncpg.connect(os.environ['DATABASE_URL'].split('?')[0])
              try:
                  room=uuid.UUID(open('/tmp/target1').read().strip())
                  state=await conn.fetchval('SELECT "operationalState"::text FROM rooms WHERE id=$1',room)
                  assert state=='DIRTY', state
                  tasks=await conn.fetchval("SELECT count(*) FROM operational_tasks WHERE \"roomId\"=$1 AND type='HOUSEKEEPING' AND status IN ('OPEN','IN_PROGRESS','IN_INSPECTION')",room)
                  assert tasks>=1, tasks
              finally: await conn.close()
          asyncio.run(main())
          relocated=json.load(open('/tmp/relocated-schedule.json'))
          target2=open('/tmp/target2').read().strip()
          assert relocated['schedule'][-1]['room_id']==target2
          PY

      - name: Conflict rolls back and preserves relocated schedule
        run: |
          RID=$(cat /tmp/reservation_id)
          python - <<'PY'
          import os,uuid,asyncio,asyncpg
          async def main():
              conn=await asyncpg.connect(os.environ['DATABASE_URL'].split('?')[0])
              try:
                  room=uuid.UUID(open('/tmp/target1').read().strip())
                  await conn.execute('''INSERT INTO inventory_blocks (id,"roomId","blockType","startDate","endDate",active,reason,"createdAt","updatedAt") VALUES ($1,$2,'MANUAL',$3::date,$4::date,true,'CI conflict',now(),now())''',uuid.uuid4(),room,os.environ['D2'],os.environ['D5'])
              finally: await conn.close()
          asyncio.run(main())
          PY
          python - <<'PY'
          import json
          d=json.load(open('/tmp/relocated-schedule.json'))
          effective=d['local_today']
          target1=open('/tmp/target1').read().strip()
          proposed=[]
          for item in d['schedule']:
              if item['end'] <= effective:
                  proposed.append({'room_id':item['room_id'],'start':item['start'],'end':item['end']})
                  continue
              if item['start'] < effective:
                  proposed.append({'room_id':item['room_id'],'start':item['start'],'end':effective})
              break
          proposed.append({'room_id':target1,'start':effective,'end':d['reservation']['check_out']})
          json.dump({'segments':proposed},open('/tmp/conflict.json','w'))
          PY
          curl --fail -sS -b /tmp/cookies.txt -X POST "http://127.0.0.1:8000/api/v1/admin/pms/reservations/$RID/schedule/preview" \
            -H 'Content-Type: application/json' --data-binary @/tmp/conflict.json > /tmp/conflict-preview.json
          python -c 'import json; d=json.load(open("/tmp/conflict-preview.json")); assert d["can_commit"] is False; assert d["conflicts"]'
          python - <<'PY'
          import json
          x=json.load(open('/tmp/conflict.json'))
          x['expected_version']=open('/tmp/version3').read().strip()
          json.dump(x,open('/tmp/conflict-commit.json','w'))
          PY
          CODE=$(curl -sS -o /tmp/conflict-result.json -w '%{http_code}' -b /tmp/cookies.txt -X POST "http://127.0.0.1:8000/api/v1/admin/pms/reservations/$RID/schedule/commit" \
            -H 'Content-Type: application/json' --data-binary @/tmp/conflict-commit.json)
          test "$CODE" = "409"
          curl --fail -sS -b /tmp/cookies.txt "http://127.0.0.1:8000/api/v1/admin/pms/reservations/$RID/schedule" > /tmp/schedule-final.json
          python - <<'PY'
          import json
          before=json.load(open('/tmp/relocated-schedule.json'))
          after=json.load(open('/tmp/schedule-final.json'))
          before_shape=[(x['room_id'],x['start'],x['end']) for x in before['schedule']]
          after_shape=[(x['room_id'],x['start'],x['end']) for x in after['schedule']]
          assert after_shape==before_shape,(before_shape,after_shape)
          PY

      - name: Check-out uses actual current room and creates housekeeping
        run: |
          RID=$(cat /tmp/reservation_id)
          curl --fail -sS -b /tmp/cookies.txt -X POST "http://127.0.0.1:8000/api/v1/admin/stays/reservations/$RID/check-out" > /tmp/checkout.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/checkout.json'))
          assert d['status']=='CHECKED_OUT'
          assert d['room_state']=='DIRTY'
          assert d['housekeeping_task_id']
          PY
          python - <<'PY'
          import os,asyncio,asyncpg,uuid
          async def main():
              conn=await asyncpg.connect(os.environ['DATABASE_URL'].split('?')[0])
              try:
                  room=uuid.UUID(open('/tmp/target2').read().strip())
                  state=await conn.fetchval('SELECT "operationalState"::text FROM rooms WHERE id=$1',room)
                  assert state=='DIRTY', state
              finally: await conn.close()
          asyncio.run(main())
          PY

      - name: Verify audit evidence exists
        run: |
          python - <<'PY'
          import os,asyncio,asyncpg
          async def main():
              conn=await asyncpg.connect(os.environ['DATABASE_URL'].split('?')[0])
              try:
                  rid=open('/tmp/reservation_id').read().strip()
                  mutations=await conn.fetchval('SELECT count(*) FROM audit_logs WHERE resource=\'Reservation\' AND "resourceId"=$1 AND action=\'PMS_SCHEDULE_MUTATION\' AND result=\'SUCCESS\'',rid)
                  checkins=await conn.fetchval('SELECT count(*) FROM audit_logs WHERE resource=\'Reservation\' AND "resourceId"=$1 AND action=\'CHECK_IN\' AND result=\'SUCCESS\'',rid)
                  checkouts=await conn.fetchval('SELECT count(*) FROM audit_logs WHERE resource=\'Reservation\' AND "resourceId"=$1 AND action=\'CHECK_OUT\' AND result=\'SUCCESS\'',rid)
                  assert mutations==3, mutations
                  assert checkins==1, checkins
                  assert checkouts==1, checkouts
              finally: await conn.close()
          asyncio.run(main())
          PY

      - name: Show Core logs on failure
        if: failure()
        run: cat /tmp/chessboard-api.log || true
