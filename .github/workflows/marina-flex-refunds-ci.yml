name: MARINA FLEX Refund and Cash Reconciliation

on:
  pull_request:
    paths:
      - "docs/flex/sql/0008_flex_refund_reconciliation_preview.sql"
      - "scripts/marina_flex_refund_reconciliation_sql_contract.sql"
      - ".github/workflows/marina-flex-refunds-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refunds:
    name: FLEX immutable refunds and line-level cash conservation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: flex_ci
          POSTGRES_USER: flex_ci
          POSTGRES_PASSWORD: flex_ci_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flex_ci -d flex_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: flex_ci
      PGPASSWORD: flex_ci_ci_only
      PGDATABASE: flex_ci
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL CLI
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Bootstrap independent commercial PostgreSQL
        run: |
          for n in 0001 0002 0003 0004 0005 0006 0007 0008; do
            case "$n" in
              0001) file=0001_flex_control_plane_preview.sql ;;
              0002) file=0002_flex_platform_identity_rls_preview.sql ;;
              0003) file=0003_flex_price_version_guard_preview.sql ;;
              0004) file=0004_flex_hotel_onboarding_preview.sql ;;
              0005) file=0005_flex_deployment_attestation_preview.sql ;;
              0006) file=0006_flex_agreements_subscription_preview.sql ;;
              0007) file=0007_flex_invoice_ledger_preview.sql ;;
              0008) file=0008_flex_refund_reconciliation_preview.sql ;;
            esac
            psql -X -v ON_ERROR_STOP=1 -f "docs/flex/sql/$file"
          done
          psql -X -v ON_ERROR_STOP=1 -f scripts/marina_flex_rls_isolation_contract.sql
      - name: Enforce refund, payment and allocation limits
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/marina_flex_refund_reconciliation_sql_contract.sql
      - name: No real payment capture or hotel-PMS schema
        run: |
          test "$(psql -X -Atqc "SELECT count(*) FROM pg_tables WHERE schemaname='public' AND tablename IN ('properties','guests','reservations','folio')")" = "0"
