name: PostgreSQL Backup Restore CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backup-restore:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: resort_os
          POSTGRES_USER: resort
          POSTGRES_PASSWORD: resort
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resort -d resort_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://resort:resort@localhost:5432/resort_os?schema=public
      PROPERTY_CODE: THREE_CROWNS
      RATE_PLAN_CODE: DIRECT_2026_27

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create development source schema
        working-directory: packages/database
        run: |
          npm install
          npx prisma validate
          npx prisma db push

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API dependencies
        run: pip install -r services/api/requirements.txt

      - name: Ensure PostgreSQL client tools
        run: |
          pg_dump --version
          pg_restore --version
          psql --version

      - name: Apply constraints and seed source database
        run: |
          python scripts/apply_core_constraints.py
          python scripts/seed_from_intake.py

      - name: Create verified-format backup artifact
        env:
          BACKUP_DIR: /tmp/three-crowns-backups
        run: |
          python scripts/database_backup.py | tee /tmp/backup-output.txt
          BACKUP_FILE=$(grep '^BACKUP_FILE=' /tmp/backup-output.txt | cut -d= -f2-)
          BACKUP_MANIFEST=$(grep '^BACKUP_MANIFEST=' /tmp/backup-output.txt | cut -d= -f2-)
          test -s "$BACKUP_FILE"
          test -s "$BACKUP_MANIFEST"
          echo "BACKUP_FILE=$BACKUP_FILE" >> "$GITHUB_ENV"
          echo "BACKUP_MANIFEST=$BACKUP_MANIFEST" >> "$GITHUB_ENV"

      - name: Create clean restore target
        env:
          PGPASSWORD: resort
        run: |
          psql -h 127.0.0.1 -U resort -d postgres -c 'DROP DATABASE IF EXISTS resort_os_restore;'
          psql -h 127.0.0.1 -U resort -d postgres -c 'CREATE DATABASE resort_os_restore;'

      - name: Restore and compare hotel facts
        env:
          RESTORE_DATABASE_URL: postgresql://resort:resort@localhost:5432/resort_os_restore
        run: |
          python scripts/database_restore_verify.py | tee /tmp/restore-output.txt
          grep -q '^RESTORE_VERIFICATION=SUCCESS$' /tmp/restore-output.txt
          grep -q '^RESTORED_ROOMS=84$' /tmp/restore-output.txt
          grep -q '^RESTORED_ROOM_TYPES=12$' /tmp/restore-output.txt
          grep -q '^LAST_VERIFIED_BACKUP_AT=' /tmp/restore-output.txt
