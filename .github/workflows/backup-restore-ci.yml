name: PostgreSQL Backup Restore CI

on:
  push:
    branches: [main]
    paths:
      - 'services/api/**'
      - 'packages/database/**'
      - 'scripts/**'
      - '.github/workflows/backup-restore-ci.yml'
  pull_request:
    paths:
      - 'services/api/**'
      - 'packages/database/**'
      - 'scripts/**'
      - '.github/workflows/backup-restore-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backup-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: resort_os
          POSTGRES_USER: resort
          POSTGRES_PASSWORD: resort
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resort -d resort_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://resort:resort@localhost:5432/resort_os?schema=public
      PROPERTY_CODE: THREE_CROWNS
      RATE_PLAN_CODE: DIRECT_2026_27
      REQUIRE_MIGRATION_HISTORY: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Prepare production-like migration baseline
        run: |
          if test -s packages/database/prisma/migrations/0_init/migration.sql; then
            echo 'Using committed migration baseline.'
            (
              cd packages/database
              npm install --no-audit --no-fund
              npx prisma validate
            )
          else
            echo 'No committed baseline yet; generating review candidate for restore proof.'
            bash scripts/generate_migration_baseline.sh
          fi
          test -s packages/database/prisma/migrations/0_init/migration.sql
          test -s packages/database/prisma/migrations/0_init/migration.sql.sha256
          PYTHONPATH=scripts python - <<'PY'
          from pathlib import Path
          from release_contract import EXPECTED_MIGRATIONS
          root = Path('packages/database/prisma/migrations')
          missing = [name for name in EXPECTED_MIGRATIONS if not (root / name / 'migration.sql').is_file()]
          assert not missing, f'missing committed migrations: {missing}'
          print(f'PASS: committed migration files={len(EXPECTED_MIGRATIONS)}')
          PY
          (
            cd packages/database/prisma/migrations/0_init
            sha256sum -c migration.sql.sha256
          )

      - name: Apply migration baseline to clean source database
        working-directory: packages/database
        run: |
          npx prisma migrate deploy
          npx prisma migrate status

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: services/api/requirements.txt

      - name: Install API dependencies
        run: pip install -r services/api/requirements.txt

      - name: Ensure PostgreSQL client tools
        run: |
          pg_dump --version
          pg_restore --version
          psql --version

      - name: Seed canonical Three Crowns source database
        run: python scripts/seed_from_intake.py

      - name: Verify source exact release contract
        env:
          APP_ENV: production
          COOKIE_SECURE: 'true'
          REQUIRE_RECENT_BACKUP: 'false'
          CORS_ORIGINS: https://release-check.3korony.invalid
          AUTOMATION_SERVICE_KEY: resort-core-automation-release-validation-key-00000001
          EXPECTED_ROOM_COUNT: '84'
          EXPECTED_ROOM_TYPE_COUNT: '12'
        run: |
          expected_migrations="$(PYTHONPATH=scripts python -c 'from release_contract import EXPECTED_MIGRATIONS; print(len(EXPECTED_MIGRATIONS))')"
          expected_constraints="$(PYTHONPATH=scripts python -c 'from release_contract import CRITICAL_CONSTRAINTS; print(len(CRITICAL_CONSTRAINTS))')"
          python scripts/production_preflight.py | tee /tmp/preflight.txt
          grep -q "^FACT: applied_migrations=${expected_migrations}$" /tmp/preflight.txt
          grep -q "^FACT: critical_constraint_count=${expected_constraints}$" /tmp/preflight.txt
          grep -q '^RESULT: READY FOR NEXT DEPLOYMENT GATE$' /tmp/preflight.txt

      - name: Create migration-aware backup artifact
        env:
          BACKUP_DIR: /tmp/three-crowns-backups
        run: |
          expected_migrations="$(PYTHONPATH=scripts python -c 'from release_contract import EXPECTED_MIGRATIONS; print(len(EXPECTED_MIGRATIONS))')"
          expected_constraints="$(PYTHONPATH=scripts python -c 'from release_contract import CRITICAL_CONSTRAINTS; print(len(CRITICAL_CONSTRAINTS))')"
          python scripts/database_backup.py | tee /tmp/backup-output.txt
          BACKUP_FILE=$(grep '^BACKUP_FILE=' /tmp/backup-output.txt | cut -d= -f2-)
          BACKUP_MANIFEST=$(grep '^BACKUP_MANIFEST=' /tmp/backup-output.txt | cut -d= -f2-)
          test -s "$BACKUP_FILE"
          test -s "$BACKUP_MANIFEST"
          grep -q "^BACKUP_MIGRATIONS=${expected_migrations}$" /tmp/backup-output.txt
          grep -q "^BACKUP_CRITICAL_CONSTRAINTS=${expected_constraints}$" /tmp/backup-output.txt
          grep -q 'three-crowns-postgres-backup-v3' "$BACKUP_MANIFEST"
          echo "BACKUP_FILE=$BACKUP_FILE" >> "$GITHUB_ENV"
          echo "BACKUP_MANIFEST=$BACKUP_MANIFEST" >> "$GITHUB_ENV"

      - name: Create clean restore target
        env:
          PGPASSWORD: resort
        run: |
          psql -h 127.0.0.1 -U resort -d postgres -c 'DROP DATABASE IF EXISTS resort_os_restore;'
          psql -h 127.0.0.1 -U resort -d postgres -c 'CREATE DATABASE resort_os_restore;'

      - name: Restore and compare data, migrations and constraints
        env:
          RESTORE_DATABASE_URL: postgresql://resort:resort@localhost:5432/resort_os_restore
        run: |
          expected_migrations="$(PYTHONPATH=scripts python -c 'from release_contract import EXPECTED_MIGRATIONS; print(len(EXPECTED_MIGRATIONS))')"
          expected_constraints="$(PYTHONPATH=scripts python -c 'from release_contract import CRITICAL_CONSTRAINTS; print(len(CRITICAL_CONSTRAINTS))')"
          python scripts/database_restore_verify.py | tee /tmp/restore-output.txt
          grep -q '^RESTORE_VERIFICATION=SUCCESS$' /tmp/restore-output.txt
          grep -q '^RESTORED_ROOMS=84$' /tmp/restore-output.txt
          grep -q '^RESTORED_ROOM_TYPES=12$' /tmp/restore-output.txt
          grep -q "^RESTORED_CRITICAL_CONSTRAINTS=${expected_constraints}$" /tmp/restore-output.txt
          grep -q '^RESTORED_MIGRATION_HISTORY_PRESENT=True$' /tmp/restore-output.txt
          grep -q "^RESTORED_APPLIED_MIGRATIONS=${expected_migrations}$" /tmp/restore-output.txt
          grep -q '^LAST_VERIFIED_BACKUP_AT=' /tmp/restore-output.txt

      - name: Verify restored migration ledger directly
        env:
          PGPASSWORD: resort
        run: |
          expected_count="$(PYTHONPATH=scripts python -c 'from release_contract import EXPECTED_MIGRATIONS; print(len(EXPECTED_MIGRATIONS))')"
          expected_names="$(PYTHONPATH=scripts python -c 'from release_contract import EXPECTED_MIGRATIONS; print(",".join(EXPECTED_MIGRATIONS))')"
          source_migrations="$(psql -h 127.0.0.1 -U resort -d resort_os -Atc "select migration_name || ':' || checksum from _prisma_migrations where finished_at is not null and rolled_back_at is null order by started_at,migration_name")"
          restored_migrations="$(psql -h 127.0.0.1 -U resort -d resort_os_restore -Atc "select migration_name || ':' || checksum from _prisma_migrations where finished_at is not null and rolled_back_at is null order by started_at,migration_name")"
          restored_count="$(psql -h 127.0.0.1 -U resort -d resort_os_restore -Atc "select count(*) from _prisma_migrations where finished_at is not null and rolled_back_at is null")"
          restored_names="$(psql -h 127.0.0.1 -U resort -d resort_os_restore -Atc "select string_agg(migration_name,',' order by started_at) from _prisma_migrations where finished_at is not null and rolled_back_at is null")"
          test "$source_migrations" = "$restored_migrations"
          test "$restored_count" = "$expected_count"
          test "$restored_names" = "$expected_names"
