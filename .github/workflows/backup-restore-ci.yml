name: PostgreSQL Backup Restore CI

on:
  push:
    branches: [main]
    paths:
      - 'services/api/**'
      - 'packages/database/**'
      - 'scripts/**'
      - '.github/workflows/backup-restore-ci.yml'
  pull_request:
    paths:
      - 'services/api/**'
      - 'packages/database/**'
      - 'scripts/**'
      - '.github/workflows/backup-restore-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backup-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: resort_os
          POSTGRES_USER: resort
          POSTGRES_PASSWORD: resort
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resort -d resort_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://resort:resort@localhost:5432/resort_os?schema=public
      PROPERTY_CODE: THREE_CROWNS
      RATE_PLAN_CODE: DIRECT_2026_27
      REQUIRE_MIGRATION_HISTORY: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Prepare production-like migration baseline
        run: |
          if test -s packages/database/prisma/migrations/0_init/migration.sql; then
            echo 'Using committed migration baseline.'
            (
              cd packages/database
              npm install --no-audit --no-fund
              npx prisma validate
            )
          else
            echo 'No committed baseline yet; generating review candidate for restore proof.'
            bash scripts/generate_migration_baseline.sh
          fi
          test -s packages/database/prisma/migrations/0_init/migration.sql
          test -s packages/database/prisma/migrations/0_init/migration.sql.sha256
          (
            cd packages/database/prisma/migrations/0_init
            sha256sum -c migration.sql.sha256
          )

      - name: Apply migration baseline to clean source database
        working-directory: packages/database
        run: |
          npx prisma migrate deploy
          npx prisma migrate status

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: services/api/requirements.txt

      - name: Install API dependencies
        run: pip install -r services/api/requirements.txt

      - name: Ensure PostgreSQL client tools
        run: |
          pg_dump --version
          pg_restore --version
          psql --version

      - name: Seed canonical Three Crowns source database
        run: python scripts/seed_from_intake.py

      - name: Verify source migration ledger and all critical invariants
        env:
          PGPASSWORD: resort
        run: |
          migration_count="$(psql -h 127.0.0.1 -U resort -d resort_os -Atc "select count(*) from _prisma_migrations where finished_at is not null and rolled_back_at is null")"
          constraint_count="$(psql -h 127.0.0.1 -U resort -d resort_os -Atc "select count(*) from pg_constraint where conname = any(array['rate_period_valid_dates','rate_period_nonnegative_price','reservation_request_valid_dates','reservation_request_positive_adults','reservation_request_nonnegative_children','reservation_valid_dates','reservation_positive_adults','reservation_nonnegative_children','reservation_nonnegative_total','inventory_block_valid_dates','no_overlapping_active_room_blocks','payment_positive_amount','payment_has_context'])")"
          test "$migration_count" -ge 1
          test "$constraint_count" = '13'

      - name: Create migration-aware backup artifact
        env:
          BACKUP_DIR: /tmp/three-crowns-backups
        run: |
          python scripts/database_backup.py | tee /tmp/backup-output.txt
          BACKUP_FILE=$(grep '^BACKUP_FILE=' /tmp/backup-output.txt | cut -d= -f2-)
          BACKUP_MANIFEST=$(grep '^BACKUP_MANIFEST=' /tmp/backup-output.txt | cut -d= -f2-)
          test -s "$BACKUP_FILE"
          test -s "$BACKUP_MANIFEST"
          grep -q '^BACKUP_MIGRATIONS=' /tmp/backup-output.txt
          grep -q '^BACKUP_CRITICAL_CONSTRAINTS=13$' /tmp/backup-output.txt
          echo "BACKUP_FILE=$BACKUP_FILE" >> "$GITHUB_ENV"
          echo "BACKUP_MANIFEST=$BACKUP_MANIFEST" >> "$GITHUB_ENV"

      - name: Create clean restore target
        env:
          PGPASSWORD: resort
        run: |
          psql -h 127.0.0.1 -U resort -d postgres -c 'DROP DATABASE IF EXISTS resort_os_restore;'
          psql -h 127.0.0.1 -U resort -d postgres -c 'CREATE DATABASE resort_os_restore;'

      - name: Restore and compare data, migrations and constraints
        env:
          RESTORE_DATABASE_URL: postgresql://resort:resort@localhost:5432/resort_os_restore
        run: |
          python scripts/database_restore_verify.py | tee /tmp/restore-output.txt
          grep -q '^RESTORE_VERIFICATION=SUCCESS$' /tmp/restore-output.txt
          grep -q '^RESTORED_ROOMS=84$' /tmp/restore-output.txt
          grep -q '^RESTORED_ROOM_TYPES=12$' /tmp/restore-output.txt
          grep -q '^RESTORED_CRITICAL_CONSTRAINTS=13$' /tmp/restore-output.txt
          grep -q '^RESTORED_MIGRATION_HISTORY_PRESENT=True$' /tmp/restore-output.txt
          grep -Eq '^RESTORED_APPLIED_MIGRATIONS=[1-9][0-9]*$' /tmp/restore-output.txt
          grep -q '^LAST_VERIFIED_BACKUP_AT=' /tmp/restore-output.txt

      - name: Verify restored migration ledger directly
        env:
          PGPASSWORD: resort
        run: |
          source_migrations="$(psql -h 127.0.0.1 -U resort -d resort_os -Atc "select migration_name || ':' || checksum from _prisma_migrations where finished_at is not null and rolled_back_at is null order by started_at,migration_name")"
          restored_migrations="$(psql -h 127.0.0.1 -U resort -d resort_os_restore -Atc "select migration_name || ':' || checksum from _prisma_migrations where finished_at is not null and rolled_back_at is null order by started_at,migration_name")"
          test "$source_migrations" = "$restored_migrations"
