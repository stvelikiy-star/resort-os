name: NFC Deferred Scope CI

on:
  push:
    branches: [main]
    paths:
      - 'services/api/app/**'
      - 'services/api/requirements.txt'
      - 'scripts/release_scope_guard.py'
      - '.env.example'
      - '.env.production.example'
      - 'compose.production.yaml'
      - '.github/workflows/nfc-ci.yml'
  pull_request:
    paths:
      - 'services/api/app/**'
      - 'services/api/requirements.txt'
      - 'scripts/release_scope_guard.py'
      - '.env.example'
      - '.env.production.example'
      - 'compose.production.yaml'
      - '.github/workflows/nfc-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nfc-release-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: services/api/requirements.txt

      - name: Install and compile API
        run: |
          pip install -r services/api/requirements.txt
          python -m compileall services/api/app scripts/release_scope_guard.py

      - name: Self-test release scope parser
        run: python scripts/release_scope_guard.py --self-test

      - name: Verify active V1 release boundary
        run: python scripts/release_scope_guard.py
