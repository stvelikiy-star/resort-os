name: Resort Core CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: resort_os
          POSTGRES_USER: resort
          POSTGRES_PASSWORD: resort
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resort -d resort_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://resort:resort@localhost:5432/resort_os?schema=public
      PROPERTY_CODE: THREE_CROWNS
      RATE_PLAN_CODE: DIRECT_2026_27
      PREPAYMENT_PERCENT: 30
      CORE_API_URL: http://127.0.0.1:8000
      BOOTSTRAP_OWNER_USERNAME: ci-owner
      BOOTSTRAP_OWNER_PASSWORD: CI-Only-Strong-Password-2026
      BOOTSTRAP_OWNER_DISPLAY_NAME: CI Owner
      COOKIE_SECURE: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Prisma
        working-directory: packages/database
        run: npm install

      - name: Validate Prisma schema
        working-directory: packages/database
        run: npx prisma validate

      - name: Create database schema
        working-directory: packages/database
        run: npx prisma db push

      - name: Install PMS admin dependencies
        working-directory: apps/admin
        run: npm install

      - name: Typecheck PMS admin
        working-directory: apps/admin
        run: npm run typecheck

      - name: Build PMS admin
        working-directory: apps/admin
        run: npm run build

      - name: Install public site dependencies
        working-directory: apps/web
        run: npm install

      - name: Typecheck public site
        working-directory: apps/web
        run: npm run typecheck

      - name: Build public site
        working-directory: apps/web
        run: npm run build

      - name: Install staff PWA dependencies
        working-directory: apps/staff
        run: npm install

      - name: Typecheck staff PWA
        working-directory: apps/staff
        run: npm run typecheck

      - name: Build staff PWA
        working-directory: apps/staff
        run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API dependencies
        run: pip install -r services/api/requirements.txt

      - name: Compile Python
        run: python -m compileall services/api/app scripts

      - name: Apply critical database constraints
        run: python scripts/apply_core_constraints.py

      - name: Seed evidence-backed Three Crowns inventory and rates
        run: python scripts/seed_from_intake.py

      - name: Bootstrap CI owner account
        run: python scripts/bootstrap_owner.py

      - name: Bootstrap CI line staff accounts
        run: |
          STAFF_USERNAME=ci-maid STAFF_PASSWORD=CI-Maid-Strong-Password-2026 STAFF_DISPLAY_NAME="CI Maid" STAFF_ROLE=MAID python scripts/upsert_staff_user.py
          STAFF_USERNAME=ci-tech STAFF_PASSWORD=CI-Tech-Strong-Password-2026 STAFF_DISPLAY_NAME="CI Technician" STAFF_ROLE=TECHNICIAN python scripts/upsert_staff_user.py

      - name: Start API
        run: |
          python -m uvicorn app.app_entry:app --app-dir services/api --host 127.0.0.1 --port 8000 > /tmp/resort-api.log 2>&1 &
          echo $! > /tmp/resort-api.pid
          sleep 3

      - name: Smoke test public Core API
        run: |
          curl --fail http://127.0.0.1:8000/health
          curl --fail -sS "http://127.0.0.1:8000/api/v1/booking/check-availability?check_in=2026-08-26&check_out=2026-08-28&adults=2&children=0" > /tmp/availability.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/availability.json'))
          sellable=[x for x in d['results'] if x['pricing']['sellable']]
          assert sellable, 'expected at least one sellable room type'
          open('/tmp/room_type_code','w').write(sellable[0]['room_type_code'])
          PY

      - name: Verify unpaid request is request only
        run: |
          RESPONSE=$(curl --fail -sS -X POST http://127.0.0.1:8000/api/v1/booking/requests \
            -H 'Content-Type: application/json' \
            -d '{"guest_name":"CI Test Guest","phone":"+996000000000","check_in":"2026-08-26","check_out":"2026-08-28","adults":2,"children":0,"source":"CI"}')
          echo "$RESPONSE" > /tmp/request.json
          echo "$RESPONSE" | python -c 'import json,sys; d=json.load(sys.stdin); assert d["is_reservation"] is False; assert d["status"] == "NEW"; open("/tmp/request_id","w").write(d["id"])'

      - name: Verify protected APIs reject unauthenticated access
        run: |
          CODE=$(curl -sS -o /tmp/pms-unauth.json -w '%{http_code}' "http://127.0.0.1:8000/api/v1/pms/grid?start=2026-08-25&end=2026-09-01")
          test "$CODE" = "401"
          CODE=$(curl -sS -o /tmp/tasks-unauth.json -w '%{http_code}' "http://127.0.0.1:8000/api/v1/ops/tasks")
          test "$CODE" = "401"

      - name: Login as owner and verify protected PMS
        run: |
          curl --fail -sS -c /tmp/resort-cookies.txt -X POST http://127.0.0.1:8000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci-owner","password":"CI-Only-Strong-Password-2026"}' > /tmp/login.json
          curl --fail -sS -b /tmp/resort-cookies.txt http://127.0.0.1:8000/api/v1/auth/me > /tmp/me.json
          python -c 'import json; d=json.load(open("/tmp/me.json")); assert d["role"] == "OWNER"; assert d["username"] == "ci-owner"'
          curl --fail -sS -b /tmp/resort-cookies.txt "http://127.0.0.1:8000/api/v1/pms/grid?start=2026-08-25&end=2026-09-01" > /tmp/grid-before.json

      - name: Quote request and require 30 percent prepayment
        run: |
          REQUEST_ID=$(cat /tmp/request_id)
          ROOM_TYPE=$(cat /tmp/room_type_code)
          curl --fail -sS -b /tmp/resort-cookies.txt -X POST "http://127.0.0.1:8000/api/v1/admin/booking/requests/$REQUEST_ID/quote" \
            -H 'Content-Type: application/json' \
            -d "{\"room_type_code\":\"$ROOM_TYPE\"}" > /tmp/quote.json
          python - <<'PY'
          import json, math
          d=json.load(open('/tmp/quote.json'))
          assert d['status']=='AWAITING_PREPAYMENT'
          assert d['quoted_total_kgs'] > 0
          assert d['required_prepayment_kgs'] == math.ceil(d['quoted_total_kgs'] * 0.30)
          open('/tmp/prepayment','w').write(str(d['required_prepayment_kgs']))
          PY

      - name: Confirm payment atomically creates reservation
        run: |
          REQUEST_ID=$(cat /tmp/request_id)
          PREPAYMENT=$(cat /tmp/prepayment)
          curl --fail -sS -b /tmp/resort-cookies.txt -X POST "http://127.0.0.1:8000/api/v1/admin/booking/requests/$REQUEST_ID/confirm-payment" \
            -H 'Content-Type: application/json' \
            -d "{\"amount_kgs\":$PREPAYMENT,\"method\":\"CI_MANUAL\",\"provider\":\"CI\",\"external_ref\":\"ci-payment-001\",\"idempotency_key\":\"ci-idempotency-payment-001\"}" > /tmp/reservation.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/reservation.json'))
          assert d['idempotent_replay'] is False
          assert d['reservation_status']=='GUARANTEED'
          assert d['booking_number'].startswith('TC-')
          open('/tmp/reservation_id','w').write(d['reservation_id'])
          open('/tmp/booking_number','w').write(d['booking_number'])
          open('/tmp/room_code','w').write(d['room_code'])
          PY

      - name: Verify payment idempotency
        run: |
          REQUEST_ID=$(cat /tmp/request_id)
          PREPAYMENT=$(cat /tmp/prepayment)
          curl --fail -sS -b /tmp/resort-cookies.txt -X POST "http://127.0.0.1:8000/api/v1/admin/booking/requests/$REQUEST_ID/confirm-payment" \
            -H 'Content-Type: application/json' \
            -d "{\"amount_kgs\":$PREPAYMENT,\"method\":\"CI_MANUAL\",\"provider\":\"CI\",\"external_ref\":\"ci-payment-001\",\"idempotency_key\":\"ci-idempotency-payment-001\"}" > /tmp/replay.json
          python -c 'import json; d=json.load(open("/tmp/replay.json")); assert d["idempotent_replay"] is True'

      - name: Verify reservation appears in PMS grid
        run: |
          curl --fail -sS -b /tmp/resort-cookies.txt "http://127.0.0.1:8000/api/v1/pms/grid?start=2026-08-25&end=2026-09-01" > /tmp/grid-after.json
          python - <<'PY'
          import json
          booking=open('/tmp/booking_number').read().strip()
          d=json.load(open('/tmp/grid-after.json'))
          blocks=[b for r in d['rooms'] for b in r['blocks']]
          assert any(b.get('booking_number')==booking for b in blocks)
          PY

      - name: Verify check-in checkout creates housekeeping task
        run: |
          RID=$(cat /tmp/reservation_id)
          curl --fail -sS -b /tmp/resort-cookies.txt -X POST "http://127.0.0.1:8000/api/v1/admin/stays/reservations/$RID/check-in" > /tmp/checkin.json
          curl --fail -sS -b /tmp/resort-cookies.txt -X POST "http://127.0.0.1:8000/api/v1/admin/stays/reservations/$RID/check-out" > /tmp/checkout.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/checkout.json'))
          assert d['status']=='CHECKED_OUT'
          assert d['room_state']=='DIRTY'
          assert d['housekeeping_task_id']
          open('/tmp/housekeeping_task_id','w').write(d['housekeeping_task_id'])
          PY

      - name: Verify maid claims and submits housekeeping for inspection
        run: |
          curl --fail -sS -c /tmp/maid-cookies.txt -X POST http://127.0.0.1:8000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci-maid","password":"CI-Maid-Strong-Password-2026"}' > /tmp/maid-login.json
          TID=$(cat /tmp/housekeeping_task_id)
          curl --fail -sS -b /tmp/maid-cookies.txt http://127.0.0.1:8000/api/v1/ops/tasks > /tmp/maid-tasks.json
          python - <<'PY'
          import json
          tid=open('/tmp/housekeeping_task_id').read().strip()
          d=json.load(open('/tmp/maid-tasks.json'))
          assert any(x['id']==tid for x in d['items'])
          PY
          curl --fail -sS -b /tmp/maid-cookies.txt -X POST "http://127.0.0.1:8000/api/v1/ops/tasks/$TID/claim" > /tmp/maid-claim.json
          curl --fail -sS -b /tmp/maid-cookies.txt -X PATCH "http://127.0.0.1:8000/api/v1/ops/tasks/$TID/status" \
            -H 'Content-Type: application/json' -d '{"status":"IN_INSPECTION"}' > /tmp/inspection.json
          python -c 'import json; assert json.load(open("/tmp/inspection.json"))["status"] == "IN_INSPECTION"'

      - name: Verify management inspection returns room CLEAN
        run: |
          TID=$(cat /tmp/housekeeping_task_id)
          curl --fail -sS -b /tmp/resort-cookies.txt -X PATCH "http://127.0.0.1:8000/api/v1/ops/tasks/$TID/status" \
            -H 'Content-Type: application/json' -d '{"status":"DONE"}' > /tmp/clean.json
          python -c 'import json; assert json.load(open("/tmp/clean.json"))["status"] == "DONE"'

      - name: Verify technician maintenance lifecycle
        run: |
          ROOM_ID=$(python -c 'import json; print(json.load(open("/tmp/grid-before.json"))["rooms"][0]["id"])')
          RESPONSE=$(curl --fail -sS -b /tmp/resort-cookies.txt -X POST http://127.0.0.1:8000/api/v1/ops/tasks \
            -H 'Content-Type: application/json' \
            -d "{\"type\":\"MAINTENANCE\",\"room_id\":\"$ROOM_ID\",\"priority\":\"HIGH\",\"title\":\"CI maintenance test\",\"source\":\"CI\"}")
          echo "$RESPONSE" | python -c 'import json,sys; d=json.load(sys.stdin); open("/tmp/maintenance_task_id","w").write(d["id"])'
          curl --fail -sS -c /tmp/tech-cookies.txt -X POST http://127.0.0.1:8000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci-tech","password":"CI-Tech-Strong-Password-2026"}' > /tmp/tech-login.json
          TID=$(cat /tmp/maintenance_task_id)
          curl --fail -sS -b /tmp/tech-cookies.txt -X POST "http://127.0.0.1:8000/api/v1/ops/tasks/$TID/claim" > /tmp/tech-claim.json
          curl --fail -sS -b /tmp/tech-cookies.txt -X PATCH "http://127.0.0.1:8000/api/v1/ops/tasks/$TID/status" \
            -H 'Content-Type: application/json' -d '{"status":"DONE"}' > /tmp/tech-done.json
          python -c 'import json; assert json.load(open("/tmp/tech-done.json"))["status"] == "DONE"'

      - name: Start canonical PMS admin
        working-directory: apps/admin
        run: |
          npm run start > /tmp/resort-admin.log 2>&1 &
          echo $! > /tmp/resort-admin.pid
          sleep 3

      - name: Smoke test PMS admin shell
        run: curl --fail http://127.0.0.1:3001/

      - name: Start canonical public site
        working-directory: apps/web
        run: |
          npm run start > /tmp/resort-web.log 2>&1 &
          echo $! > /tmp/resort-web.pid
          sleep 3

      - name: Smoke test public site and Core proxy
        run: |
          curl --fail http://127.0.0.1:3000/
          curl --fail "http://127.0.0.1:3000/core/api/v1/booking/check-availability?check_in=2026-08-26&check_out=2026-08-28&adults=2&children=0"

      - name: Start staff PWA
        working-directory: apps/staff
        run: |
          npm run start > /tmp/resort-staff.log 2>&1 &
          echo $! > /tmp/resort-staff.pid
          sleep 3

      - name: Smoke test staff PWA shell
        run: |
          curl --fail http://127.0.0.1:3002/
          curl --fail http://127.0.0.1:3002/manifest.webmanifest
          curl --fail http://127.0.0.1:3002/sw.js

      - name: Show logs on failure
        if: failure()
        run: |
          cat /tmp/resort-api.log || true
          cat /tmp/resort-admin.log || true
          cat /tmp/resort-web.log || true
          cat /tmp/resort-staff.log || true
