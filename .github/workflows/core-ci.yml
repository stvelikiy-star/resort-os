name: Resort Core CI

on:
  push:
    branches: [main]
    paths:
      - 'services/api/**'
      - 'packages/database/**'
      - 'scripts/**'
      - 'apps/**'
      - '.github/workflows/core-ci.yml'
  pull_request:
    paths:
      - 'services/api/**'
      - 'packages/database/**'
      - 'scripts/**'
      - 'apps/**'
      - '.github/workflows/core-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: resort_os
          POSTGRES_USER: resort
          POSTGRES_PASSWORD: resort
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resort -d resort_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://resort:resort@localhost:5432/resort_os?schema=public
      PROPERTY_CODE: THREE_CROWNS
      RATE_PLAN_CODE: DIRECT_2026_27
      CORE_API_URL: http://127.0.0.1:8000
      BOOTSTRAP_OWNER_USERNAME: ci-owner
      BOOTSTRAP_OWNER_PASSWORD: CI-Only-Strong-Password-2026
      BOOTSTRAP_OWNER_DISPLAY_NAME: CI Owner
      COOKIE_SECURE: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Resolve hotel-local test dates
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          today = datetime.now(ZoneInfo('Asia/Bishkek')).date()
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              for i in range(6):
                  f.write(f'D{i}={(today + timedelta(days=i)).isoformat()}\n')
          PY

      - name: Validate and create development schema
        working-directory: packages/database
        run: |
          npm install --no-audit --no-fund
          npx prisma validate
          npx prisma db push

      - name: Typecheck and build PMS admin
        working-directory: apps/admin
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Typecheck and build public site
        working-directory: apps/web
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Typecheck and build staff PWA
        working-directory: apps/staff
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: services/api/requirements.txt

      - name: Install and compile Core
        run: |
          pip install -r services/api/requirements.txt
          python -m compileall services/api/app scripts

      - name: Apply constraints and seed Three Crowns
        run: |
          python scripts/apply_core_constraints.py
          python scripts/seed_from_intake.py
          python scripts/bootstrap_owner.py

      - name: Start Resort Core
        run: |
          python -m uvicorn app.app_entry:app --app-dir services/api --host 127.0.0.1 --port 8000 > /tmp/resort-api.log 2>&1 &
          echo $! > /tmp/resort-api.pid
          sleep 3
          curl --fail -sS http://127.0.0.1:8000/ready > /tmp/ready.json

      - name: Verify public availability and create request
        run: |
          curl --fail -sS "http://127.0.0.1:8000/api/v1/booking/check-availability?check_in=$D0&check_out=$D2&adults=2&children=0" > /tmp/availability.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/availability.json'))
          sellable=[x for x in d['results'] if x['pricing']['sellable']]
          assert sellable
          open('/tmp/room_type_code','w').write(sellable[0]['room_type_code'])
          PY
          curl --fail -sS -X POST http://127.0.0.1:8000/api/v1/booking/requests \
            -H 'Content-Type: application/json' \
            -d "{\"guest_name\":\"CI Test Guest\",\"phone\":\"+996000000000\",\"check_in\":\"$D0\",\"check_out\":\"$D2\",\"adults\":2,\"children\":0,\"source\":\"CI\"}" > /tmp/request.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/request.json'))
          assert d['is_reservation'] is False
          assert d['status']=='NEW'
          open('/tmp/request_id','w').write(d['id'])
          PY

      - name: Verify protected PMS and login
        run: |
          CODE=$(curl -sS -o /tmp/pms-unauth.json -w '%{http_code}' "http://127.0.0.1:8000/api/v1/pms/grid?start=$D0&end=$D5")
          test "$CODE" = "401"
          curl --fail -sS -c /tmp/resort-cookies.txt -X POST http://127.0.0.1:8000/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci-owner","password":"CI-Only-Strong-Password-2026"}' > /tmp/login.json
          curl --fail -sS -b /tmp/resort-cookies.txt http://127.0.0.1:8000/api/v1/auth/me > /tmp/me.json
          python -c 'import json; d=json.load(open("/tmp/me.json")); assert d["role"]=="OWNER"'

      - name: Verify unified Site CMS CRM PMS contour
        env:
          SMOKE_OWNER_USERNAME: ci-owner
          SMOKE_OWNER_PASSWORD: CI-Only-Strong-Password-2026
        run: python scripts/site_pms_cms_smoke.py

      - name: Quote stay without automatic prepayment rule
        run: |
          REQUEST_ID=$(cat /tmp/request_id)
          ROOM_TYPE=$(cat /tmp/room_type_code)
          curl --fail -sS -b /tmp/resort-cookies.txt -X POST "http://127.0.0.1:8000/api/v1/admin/booking/requests/$REQUEST_ID/quote" \
            -H 'Content-Type: application/json' \
            -d "{\"room_type_code\":\"$ROOM_TYPE\"}" > /tmp/quote.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/quote.json'))
          assert d['status']=='QUOTED'
          assert d['quoted_total_kgs'] > 0
          assert d['required_prepayment_kgs'] is None
          assert d['prepayment_decided_by_manager'] is True
          PY

      - name: Manager-confirmed manual payment creates reservation atomically
        run: |
          REQUEST_ID=$(cat /tmp/request_id)
          MANAGER_AMOUNT=1234
          curl --fail -sS -b /tmp/resort-cookies.txt -X POST "http://127.0.0.1:8000/api/v1/admin/booking/requests/$REQUEST_ID/confirm-payment" \
            -H 'Content-Type: application/json' \
            -d "{\"amount_kgs\":$MANAGER_AMOUNT,\"method\":\"MANAGER_MANUAL\",\"provider\":\"MANAGER_MANUAL\",\"external_ref\":\"ci-manager-payment-001\",\"idempotency_key\":\"ci-manager-payment-idempotency-001\"}" > /tmp/reservation.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/reservation.json'))
          assert d['idempotent_replay'] is False
          assert d['reservation_status']=='GUARANTEED'
          assert d['manager_confirmed_payment_kgs']==1234
          assert d['payment_collection']=='MANAGER_MANUAL'
          open('/tmp/reservation_id','w').write(d['reservation_id'])
          open('/tmp/booking_number','w').write(d['booking_number'])
          PY

      - name: Verify manual payment idempotency
        run: |
          REQUEST_ID=$(cat /tmp/request_id)
          curl --fail -sS -b /tmp/resort-cookies.txt -X POST "http://127.0.0.1:8000/api/v1/admin/booking/requests/$REQUEST_ID/confirm-payment" \
            -H 'Content-Type: application/json' \
            -d '{"amount_kgs":1234,"method":"MANAGER_MANUAL","provider":"MANAGER_MANUAL","external_ref":"ci-manager-payment-001","idempotency_key":"ci-manager-payment-idempotency-001"}' > /tmp/replay.json
          python -c 'import json; assert json.load(open("/tmp/replay.json"))["idempotent_replay"] is True'

      - name: Verify reservation appears in PMS grid
        run: |
          curl --fail -sS -b /tmp/resort-cookies.txt "http://127.0.0.1:8000/api/v1/pms/grid?start=$D0&end=$D5" > /tmp/grid.json
          python - <<'PY'
          import json
          booking=open('/tmp/booking_number').read().strip()
          d=json.load(open('/tmp/grid.json'))
          assert any(b.get('booking_number')==booking for r in d['rooms'] for b in r['blocks'])
          PY

      - name: Verify check-in checkout housekeeping lifecycle
        run: |
          RID=$(cat /tmp/reservation_id)
          python - <<'PY'
          import asyncio, os, uuid
          import asyncpg
          async def main():
              conn = await asyncpg.connect(os.environ['DATABASE_URL'].split('?')[0])
              try:
                  reservation_id = uuid.UUID(open('/tmp/reservation_id').read().strip())
                  await conn.execute(
                      '''UPDATE rooms SET "operationalState"='CLEAN',"updatedAt"=now()
                         WHERE id=(SELECT "roomId" FROM inventory_blocks
                                   WHERE "reservationId"=$1 AND active=true AND "blockType"='RESERVATION'
                                   ORDER BY "startDate" LIMIT 1)''',
                      reservation_id,
                  )
              finally:
                  await conn.close()
          asyncio.run(main())
          PY
          curl --fail -sS -b /tmp/resort-cookies.txt -X POST "http://127.0.0.1:8000/api/v1/admin/stays/reservations/$RID/check-in" > /tmp/checkin.json
          python -c 'import json; assert json.load(open("/tmp/checkin.json"))["status"]=="CHECKED_IN"'
          python - <<'PY'
          import asyncio, os, uuid
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          import asyncpg
          async def main():
              conn = await asyncpg.connect(os.environ['DATABASE_URL'].split('?')[0])
              try:
                  reservation_id = uuid.UUID(open('/tmp/reservation_id').read().strip())
                  lived_from = datetime.now(ZoneInfo('Asia/Bishkek')).date() - timedelta(days=1)
                  await conn.execute('UPDATE reservations SET "checkIn"=$1,"updatedAt"=now() WHERE id=$2', lived_from, reservation_id)
                  await conn.execute(
                      '''UPDATE inventory_blocks SET "startDate"=$1,"updatedAt"=now()
                         WHERE id=(SELECT id FROM inventory_blocks
                                   WHERE "reservationId"=$2 AND active=true AND "blockType"='RESERVATION'
                                   ORDER BY "startDate" LIMIT 1)''',
                      lived_from, reservation_id,
                  )
              finally:
                  await conn.close()
          asyncio.run(main())
          PY
          curl --fail -sS -b /tmp/resort-cookies.txt -X POST "http://127.0.0.1:8000/api/v1/admin/stays/reservations/$RID/check-out" > /tmp/checkout.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/checkout.json'))
          assert d['status']=='CHECKED_OUT'
          assert d['room_state']=='DIRTY'
          assert d['housekeeping_task_id']
          PY

      - name: Show Core logs on failure
        if: failure()
        run: cat /tmp/resort-api.log || true
