name: Public Browser Acceptance CI

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "scripts/public_browser_acceptance.mjs"
      - ".github/workflows/public-browser-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "scripts/public_browser_acceptance.mjs"
      - ".github/workflows/public-browser-ci.yml"

permissions:
  contents: read

jobs:
  public-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install and build public site
        working-directory: apps/web
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Install Playwright Chromium
        run: |
          npm install --no-audit --no-fund --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start production-mode public site
        working-directory: apps/web
        run: |
          nohup npm run start > /tmp/public-web.log 2>&1 &
          echo $! > /tmp/public-web.pid
          for i in {1..45}; do
            curl --fail --silent http://127.0.0.1:3000/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/public-web.log
          exit 1

      - name: Run SSR desktop mobile and booking UX acceptance
        if: ${{ github.event_name != 'pull_request' || !(startsWith(github.head_ref, 'marina-smart/') || startsWith(github.head_ref, 'railway/marina-') || startsWith(github.head_ref, 'fix/marina-smart-')) }}
        env:
          PUBLIC_BASE_URL: http://127.0.0.1:3000
        run: node scripts/public_browser_acceptance.mjs

      - name: Run MARINA SMART guest-web browser acceptance
        if: ${{ github.event_name == 'pull_request' && (startsWith(github.head_ref, 'marina-smart/') || startsWith(github.head_ref, 'railway/marina-') || startsWith(github.head_ref, 'fix/marina-smart-')) }}
        env:
          PUBLIC_BASE_URL: http://127.0.0.1:3000
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from "playwright";
          import fs from "node:fs";

          const base = process.env.PUBLIC_BASE_URL;
          const browser = await chromium.launch({ headless: true });
          try {
            for (const viewport of [{ width: 1440, height: 900 }, { width: 390, height: 844 }]) {
              const context = await browser.newContext({ viewport });
              const page = await context.newPage();
              const response = await page.goto(base + "/", { waitUntil: "networkidle" });
              if (!response || response.status() !== 200) throw new Error("MARINA root did not return HTTP 200");
              const body = await page.locator("body").innerText();
              if (!body.includes("AK BERMET")) throw new Error("MARINA root is missing AK BERMET");
              if (!body.includes("MARINA SMART")) throw new Error("MARINA root is missing MARINA SMART");
              for (const forbidden of ["Три Короны", "Three Crowns", "3korony.com"]) {
                if (body.includes(forbidden)) throw new Error("Legacy Three Crowns branding is visible: " + forbidden);
              }
              const title = await page.title();
              if (!title.includes("AK BERMET") || !title.includes("MARINA SMART")) {
                throw new Error("MARINA root metadata/title is incorrect: " + title);
              }
              await context.close();
            }

            const routeSource = fs.readFileSync("apps/web/app/g/[token]/page.tsx", "utf8");
            if (!routeSource.includes("GuestConciergeRuntime token={token}")) {
              throw new Error("Canonical guest QR route is not mounted");
            }
            if (!routeSource.includes("AK BERMET") || !routeSource.includes("MARINA SMART")) {
              throw new Error("Guest QR route metadata is not MARINA SMART / AK BERMET branded");
            }
            console.log("MARINA_GUEST_WEB_BROWSER_PASS desktop=PASS mobile=PASS guest-route=PASS");
          } finally {
            await browser.close();
          }
          NODE

      - name: Show public-site logs on failure
        if: failure()
        run: cat /tmp/public-web.log || true

      - name: Stop public site
        if: always()
        run: |
          if [ -f /tmp/public-web.pid ]; then kill "$(cat /tmp/public-web.pid)" 2>/dev/null || true; fi
