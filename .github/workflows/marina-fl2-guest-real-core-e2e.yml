name: MARINA FL2 Guest Real Core PostgreSQL E2E
on:
  pull_request:
    paths:
      - '.github/workflows/marina-fl2-guest-real-core-e2e.yml'
      - 'scripts/verify_guest_os_access.py'
      - 'scripts/verify_guest_os_requests.py'
      - 'services/api/app/guest_os.py'
      - 'services/api/app/guest_requests.py'
      - 'apps/web/components/GuestConciergeRuntime.tsx'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: marina-fl2-guest-db-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  guest-core-postgresql:
    name: Guest real Core and PostgreSQL — ${{ matrix.scenario }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        scenario: [access, requests]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: resort_os
          POSTGRES_USER: resort
          POSTGRES_PASSWORD: resort
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resort -d resort_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://resort:resort@localhost:5432/resort_os?schema=public
      PROPERTY_CODE: THREE_CROWNS
      RATE_PLAN_CODE: DIRECT_2026_27
      COOKIE_SECURE: 'false'
      GUEST_OS_PUBLIC_BASE_URL: http://127.0.0.1:3000
      CORE_API_URL: http://127.0.0.1:8000
      RESORT_CORE_TEST_URL: http://127.0.0.1:8000
      BOOTSTRAP_OWNER_USERNAME: guest-integration-ci-owner
      BOOTSTRAP_OWNER_DISPLAY_NAME: Guest Integration CI Owner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/database/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - name: Create short-lived synthetic credentials (never use production secrets)
        shell: bash
        run: |
          python - <<'PY'
          import os,secrets
          with open(os.environ['GITHUB_ENV'],'a') as env:
              env.write('BOOTSTRAP_OWNER_PASSWORD=CI-' + secrets.token_urlsafe(24) + '-A9\n')
          PY
      - name: Apply existing Prisma migrations to isolated PostgreSQL
        working-directory: packages/database
        run: |
          npm ci --no-audit --no-fund
          npx prisma validate
          npx prisma migrate deploy
          npx prisma migrate status
      - name: Install Core Python dependencies
        run: |
          pip install -r services/api/requirements.txt
          python -m compileall -q services/api/app scripts/verify_guest_os_access.py scripts/verify_guest_os_requests.py
      - name: Seed only the canonical synthetic CI hotel and owner
        run: |
          python scripts/seed_from_intake.py
          python scripts/bootstrap_owner.py
      - name: Start real Resort Core against temporary PostgreSQL
        shell: bash
        run: |
          python -m uvicorn app.app_entry:app --app-dir services/api --host 127.0.0.1 --port 8000 >/tmp/marina-fl2-guest-real-core.log 2>&1 &
          echo $! >/tmp/marina-fl2-guest-real-core.pid
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8000/health/ready >/dev/null 2>&1; then
              echo "PASS: isolated real Core ready"
              exit 0
            fi
            sleep 1
          done
          tail -100 /tmp/marina-fl2-guest-real-core.log
          exit 1
      - name: Verify actual QR/PIN, PostgreSQL state and privacy
        if: matrix.scenario == 'access'
        run: python scripts/verify_guest_os_access.py
      - name: Verify actual Guest requests, Staff routing and DB consistency
        if: matrix.scenario == 'requests'
        run: python scripts/verify_guest_os_requests.py
      - name: Preserve safe evidence markers (no guest tokens or credentials)
        if: success()
        run: |
          echo "GUEST_REAL_CORE_POSTGRESQL_E2E_PASS scenario=${{ matrix.scenario }}"
          echo "Synthetic CI database, no production or hotel network access"
      - name: Inspect Core errors if verification fails
        if: failure()
        shell: bash
        run: |
          tail -100 /tmp/marina-fl2-guest-real-core.log 2>/dev/null || true
      - name: Stop isolated Core
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/marina-fl2-guest-real-core.pid ]; then
            kill "$(cat /tmp/marina-fl2-guest-real-core.pid)" 2>/dev/null || true
          fi
