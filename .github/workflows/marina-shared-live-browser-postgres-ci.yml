name: MARINA Shared Live Browser PostgreSQL CI

on:
  pull_request:
    paths:
      - 'release/marina-smart-current-candidate.json'
      - 'apps/admin/**'
      - 'services/api/**'
      - 'packages/database/**'
      - 'scripts/marina_shared_live_browser.mjs'
      - 'scripts/marina_shared_live_browser_db.py'
      - 'scripts/marina_shared_release_restore_ci.py'
      - 'scripts/prisma_migration_ledger.py'
      - 'scripts/test_marina_shared_restore_guard.py'
      - 'scripts/marina_shared_role_auth_ci.py'
      - '.github/workflows/marina-shared-live-browser-postgres-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-http-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: marina_shared_browser_ci
          POSTGRES_USER: marina_ci
          POSTGRES_PASSWORD: synthetic-ci-database-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U marina_ci -d marina_shared_browser_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://marina_ci:synthetic-ci-database-only@127.0.0.1:5432/marina_shared_browser_ci?schema=public
      APP_ENV: staging
      PROPERTY_CODE: MARINA_BROWSER_CI
      RATE_PLAN_CODE: MARINA_BROWSER_CI
      MARINA_TENANT_CONTEXT_ENABLED: 'true'
      MARINA_SHARED_AUTH_PREVIEW_ENABLED: 'true'
      MARINA_SHARED_BROWSER_CI_CONFIRM: DISPOSABLE_TWO_HOTEL_BROWSER_CI
      MARINA_SHARED_BROWSER_CI_PASSWORD: synthetic-ci-only-browser-two-hotels-2026
      MARINA_SHARED_BROWSER_URL: http://127.0.0.1:13001
      # HTTP cookie is permitted only on disposable localhost; production uses secure HTTPS cookies.
      COOKIE_SECURE: 'false'
      AUTH_TRUST_PROXY_HEADERS: 'false'
      ENABLE_PAYMENT_OPERATIONS: 'false'
      ENABLE_MKASSA: 'false'
      ENABLE_SERVICE_POINT_QR: 'false'
      CORE_API_URL: http://127.0.0.1:18000
      NEXT_TELEMETRY_DISABLED: '1'
      OPENAI_API_KEY: ''
      MARINA_AI_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply committed migrations to isolated empty PostgreSQL
        working-directory: packages/database
        run: |
          npm ci --no-audit --no-fund
          npx prisma validate
          npx prisma migrate deploy
      - name: Install API requirements and seed two independent properties
        run: |
          python -m pip install -r services/api/requirements.txt
          python scripts/marina_shared_live_browser_db.py seed
      - name: Typecheck and build shared Admin
        working-directory: apps/admin
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Launch canonical API and real Next Admin through localhost
        shell: bash
        run: |
          set -euo pipefail
          python -m uvicorn app.app_entry:app --app-dir services/api --host 127.0.0.1 --port 18000 > /tmp/marina-live-api.log 2>&1 &
          echo "$!" > /tmp/marina-live-api.pid
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:18000/health/ready >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18000/health/ready
          (cd apps/admin && npx next start -p 13001 > /tmp/marina-live-admin.log 2>&1) &
          echo "$!" > /tmp/marina-live-admin.pid
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:13001/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:13001/ > /dev/null
      - name: Install headless Chromium in isolated CI runner
        run: |
          npm install --prefix scripts --no-save --no-package-lock playwright@1.56.1
          ./scripts/node_modules/.bin/playwright install --with-deps chromium
      - name: Real browser > Next rewrite > ASGI > PostgreSQL acceptance
        run: node scripts/marina_shared_live_browser.mjs
      - name: Verify every server role across both hotel identities in canonical FastAPI + PostgreSQL
        run: python scripts/marina_shared_role_auth_ci.py
      - name: Verify both browser receipts against real PostgreSQL facts
        run: python scripts/marina_shared_live_browser_db.py verify
      - name: Pin PostgreSQL 16 dump/restore clients to the synthetic PostgreSQL 16 server
        shell: bash
        run: |
          set -euo pipefail
          if ! test -x /usr/lib/postgresql/16/bin/pg_dump; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client-16
          fi
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
          /usr/lib/postgresql/16/bin/pg_dump --version | grep -E ' 16\.'
          /usr/lib/postgresql/16/bin/pg_restore --version | grep -E ' 16\.'
      - name: Prove shared restore target URLs fail closed before touching PostgreSQL
        run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s scripts -p 'test_marina_shared_restore_guard.py' -v
      - name: Create a NEW empty database solely for full shared-runtime restore
        env:
          PGPASSWORD: synthetic-ci-database-only
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -p 5432 -U marina_ci -d postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE marina_shared_browser_restore_ci;'
      - name: pg_dump and pg_restore FULL two-hotel SHARED DB, compare all rows and schema, then call restored canonical ASGI
        env:
          RESTORE_DATABASE_URL: postgresql://marina_ci:synthetic-ci-database-only@127.0.0.1:5432/marina_shared_browser_restore_ci?schema=public
          MARINA_SHARED_RESTORE_CI_CONFIRM: ISOLATED_SHARED_TWO_HOTEL_RESTORE_ONLY
        run: PYTHONDONTWRITEBYTECODE=1 python scripts/marina_shared_release_restore_ci.py
      - name: Print sanitized diagnostics only on failure
        if: failure()
        run: |
          for name in api admin; do
            echo "=== $name ==="
            tail -100 "/tmp/marina-live-$name.log" 2>/dev/null || true
          done
      - name: Stop disposable app processes
        if: always()
        run: |
          for name in api admin; do
            if [ -f "/tmp/marina-live-$name.pid" ]; then
              kill "$(cat "/tmp/marina-live-$name.pid")" 2>/dev/null || true
            fi
          done
