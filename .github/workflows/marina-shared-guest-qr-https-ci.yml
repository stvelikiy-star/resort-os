name: MARINA Two-Hotel Guest QR HTTPS CI

on:
  pull_request:
    paths:
      - 'scripts/marina_shared_guest_qr_ci_app.py'
      - 'scripts/marina_shared_guest_qr_https_ci.py'
      - 'services/api/app/guest_os.py'
      - 'services/api/app/guest_requests.py'
      - '.github/workflows/marina-shared-guest-qr-https-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guest-qr-two-hotels:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_DB: marina_shared_browser_ci
          POSTGRES_USER: marina_ci
          POSTGRES_PASSWORD: synthetic-ci-database-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U marina_ci -d marina_shared_browser_ci"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql://marina_ci:synthetic-ci-database-only@127.0.0.1:5432/marina_shared_browser_ci?schema=public
      PYTHONPATH: services/api:scripts
      APP_ENV: staging
      PROPERTY_CODE: MARINA_BROWSER_CI
      RATE_PLAN_CODE: MARINA_BROWSER_CI
      MARINA_TENANT_CONTEXT_ENABLED: 'true'
      MARINA_SHARED_AUTH_PREVIEW_ENABLED: 'true'
      MARINA_SHARED_BROWSER_CI_CONFIRM: DISPOSABLE_TWO_HOTEL_BROWSER_CI
      MARINA_GUEST_QR_CI_CONFIRM: ISOLATED_TWO_HOTEL_GUEST_QR_CI_ONLY
      COOKIE_SECURE: 'true'
      COOKIE_DOMAIN: ''
      AUTH_TRUST_PROXY_HEADERS: 'false'
      GUEST_OS_PUBLIC_BASE_URL: https://localhost:18443
      MARINA_GUEST_QR_CI_CERT: /tmp/marina-guest-qr-ci/cert.pem
      ENABLE_PAYMENT_OPERATIONS: 'false'
      ENABLE_MKASSA: 'false'
      ENABLE_SERVICE_POINT_QR: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate isolated two-hotel fixture credentials
        shell: bash
        run: |
          set -euo pipefail
          secret="synthetic-ci-only-$(openssl rand -hex 24)"
          echo "::add-mask::$secret"
          echo "MARINA_SHARED_BROWSER_CI_PASSWORD=$secret" >> "$GITHUB_ENV"
      - name: Apply existing immutable Prisma migrations to empty CI DB
        working-directory: packages/database
        run: |
          npm ci --no-audit --no-fund
          npx prisma migrate deploy
      - name: Install canonical Resort Core test dependencies
        run: python -m pip install -r services/api/requirements.txt
      - name: Seed two independent owners, rooms and rates in disposable PostgreSQL
        run: python scripts/marina_shared_live_browser_db.py seed
      - name: Produce localhost-only TLS certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/marina-guest-qr-ci
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -subj '/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost' \
            -keyout /tmp/marina-guest-qr-ci/key.pem \
            -out /tmp/marina-guest-qr-ci/cert.pem 2>/dev/null
      - name: Start limited-router canonical Guest OS on localhost HTTPS
        shell: bash
        run: |
          set -euo pipefail
          (python -m uvicorn marina_shared_guest_qr_ci_app:app \
            --app-dir scripts --host 127.0.0.1 --port 18443 \
            --no-proxy-headers \
            --ssl-keyfile /tmp/marina-guest-qr-ci/key.pem \
            --ssl-certfile /tmp/marina-guest-qr-ci/cert.pem \
            > /tmp/marina-guest-qr-ci/api.log 2>&1 &
           echo $! > /tmp/marina-guest-qr-ci/api.pid)
          curl --fail --silent --show-error --cacert /tmp/marina-guest-qr-ci/cert.pem \
            --retry 20 --retry-connrefused --retry-delay 1 \
            https://localhost:18443/api/v1/auth/mode > /dev/null
      - name: Verify two-hotel QR, real PIN, cross-cookie denial and checkout over HTTPS
        run: python scripts/marina_shared_guest_qr_https_ci.py
      - name: Print server logs on failure
        if: failure()
        run: tail -n 150 /tmp/marina-guest-qr-ci/api.log || true
      - name: Stop local acceptance server
        if: always()
        run: |
          if [ -f /tmp/marina-guest-qr-ci/api.pid ]; then
            kill "$(cat /tmp/marina-guest-qr-ci/api.pid)" 2>/dev/null || true
          fi
