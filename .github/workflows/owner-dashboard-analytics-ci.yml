name: Owner Dashboard Analytics CI

on:
  pull_request:
    paths:
      - 'services/api/app/owner_operations_analytics.py'
      - 'services/api/app/manager_dashboard.py'
      - 'services/api/app/hotel_finance.py'
      - 'services/api/app/app_entry.py'
      - 'apps/admin/components/DashboardBoard.tsx'
      - 'apps/admin/components/OwnerExecutivePack.tsx'
      - 'apps/admin/components/OwnerOperationsPerformance.tsx'
      - 'scripts/verify_owner_dashboard_analytics.py'
      - 'scripts/upsert_staff_user.py'
      - 'packages/database/prisma/schema.prisma'
      - 'packages/database/prisma/migrations/**'
      - '.github/workflows/owner-dashboard-analytics-ci.yml'
  push:
    branches: [main]
    paths:
      - 'services/api/app/owner_operations_analytics.py'
      - 'services/api/app/manager_dashboard.py'
      - 'services/api/app/hotel_finance.py'
      - 'services/api/app/app_entry.py'
      - 'apps/admin/components/DashboardBoard.tsx'
      - 'apps/admin/components/OwnerExecutivePack.tsx'
      - 'apps/admin/components/OwnerOperationsPerformance.tsx'
      - 'scripts/verify_owner_dashboard_analytics.py'
      - 'scripts/upsert_staff_user.py'
      - 'packages/database/prisma/schema.prisma'
      - 'packages/database/prisma/migrations/**'
      - '.github/workflows/owner-dashboard-analytics-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owner-dashboard-analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: resort_os
          POSTGRES_USER: resort
          POSTGRES_PASSWORD: resort
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resort -d resort_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://resort:resort@localhost:5432/resort_os?schema=public
      PROPERTY_CODE: THREE_CROWNS
      RATE_PLAN_CODE: DIRECT_2026_27
      RESORT_CORE_TEST_URL: http://127.0.0.1:8000
      COOKIE_SECURE: false
      BOOTSTRAP_OWNER_USERNAME: owner-analytics-ci
      BOOTSTRAP_OWNER_PASSWORD: Owner-Analytics-CI-2026
      BOOTSTRAP_OWNER_DISPLAY_NAME: Owner Analytics CI
      OWNER_ANALYTICS_RECEPTION_USERNAME: owner-analytics-reception
      OWNER_ANALYTICS_RECEPTION_PASSWORD: Owner-Analytics-Reception-2026
      OWNER_ANALYTICS_MAID_USERNAME: owner-analytics-maid
      OWNER_ANALYTICS_MAID_PASSWORD: Owner-Analytics-Maid-2026
      OWNER_ANALYTICS_TECH_USERNAME: owner-analytics-tech
      OWNER_ANALYTICS_TECH_PASSWORD: Owner-Analytics-Tech-2026

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Prisma schema and migrations
        working-directory: packages/database
        run: |
          npm install --no-audit --no-fund
          npx prisma validate
          npx prisma migrate deploy

      - name: Typecheck and build owner dashboard
        working-directory: apps/admin
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: services/api/requirements.txt

      - name: Install and compile Resort Core and verifier
        run: |
          pip install -r services/api/requirements.txt
          python -m compileall services/api/app scripts/verify_owner_dashboard_analytics.py scripts/upsert_staff_user.py

      - name: Seed property and owner analytics roles
        run: |
          python scripts/seed_from_intake.py
          python scripts/bootstrap_owner.py
          STAFF_USERNAME="$OWNER_ANALYTICS_RECEPTION_USERNAME" STAFF_PASSWORD="$OWNER_ANALYTICS_RECEPTION_PASSWORD" STAFF_DISPLAY_NAME='Owner Analytics Reception' STAFF_ROLE=RECEPTION python scripts/upsert_staff_user.py
          STAFF_USERNAME="$OWNER_ANALYTICS_MAID_USERNAME" STAFF_PASSWORD="$OWNER_ANALYTICS_MAID_PASSWORD" STAFF_DISPLAY_NAME='Owner Analytics Maid' STAFF_ROLE=MAID python scripts/upsert_staff_user.py
          STAFF_USERNAME="$OWNER_ANALYTICS_TECH_USERNAME" STAFF_PASSWORD="$OWNER_ANALYTICS_TECH_PASSWORD" STAFF_DISPLAY_NAME='Owner Analytics Technician' STAFF_ROLE=TECHNICIAN python scripts/upsert_staff_user.py

      - name: Start Resort Core
        run: |
          python -m uvicorn app.app_entry:app --app-dir services/api --host 127.0.0.1 --port 8000 > /tmp/owner-dashboard-analytics-api.log 2>&1 &
          echo $! > /tmp/owner-dashboard-analytics-api.pid
          for i in {1..30}; do
            if curl --fail -sS http://127.0.0.1:8000/health/ready >/tmp/owner-dashboard-ready.json 2>/dev/null; then break; fi
            if [ "$i" = "30" ]; then cat /tmp/owner-dashboard-analytics-api.log; exit 1; fi
            sleep 1
          done

      - name: Reconcile owner dashboard analytics against known Core facts
        run: python scripts/verify_owner_dashboard_analytics.py

      - name: Show Resort Core logs on failure
        if: failure()
        run: cat /tmp/owner-dashboard-analytics-api.log || true

      - name: Stop Resort Core
        if: always()
        run: |
          if [ -f /tmp/owner-dashboard-analytics-api.pid ]; then kill "$(cat /tmp/owner-dashboard-analytics-api.pid)" || true; fi
