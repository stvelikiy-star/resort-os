name: MARINA Property-Specific Guest Site Isolation CI

on:
  pull_request:
    paths:
      - 'services/api/app/site_content.py'
      - 'services/api/app/customer_site_contract.py'
      - 'services/api/app/customer_site_page.py'
      - 'deploy/marina/customer-unpublished.Caddyfile'
      - 'apps/web/app/guest/page.tsx'
      - 'apps/web/components/GuestLanding.tsx'
      - 'scripts/marina_guest_i18n_guard.py'
      - 'scripts/test_marina_property_site_isolation.py'
      - '.github/workflows/marina-property-site-isolation-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  property-site-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - name: Install isolated API contract dependencies
        run: pip install -r services/api/requirements.txt
      - name: Verify no cross-property defaults and explicit publication
        run: python scripts/test_marina_property_site_isolation.py
      - name: Verify Guest OS RU/KG/KZ/EN and neutral landing
        run: python scripts/marina_guest_i18n_guard.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Typecheck Guest Web without touching runtime
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
