name: Payment Idempotency CI

on:
  push:
    branches: [main]
    paths:
      - 'services/api/app/booking_admin.py'
      - 'services/api/app/reservation_payments.py'
      - 'services/api/app/payment_idempotency.py'
      - 'services/api/app/app_entry.py'
      - 'services/api/requirements.txt'
      - 'packages/database/**'
      - 'data-intake/**'
      - 'scripts/apply_core_constraints.py'
      - 'scripts/seed_from_intake.py'
      - 'scripts/bootstrap_owner.py'
      - 'scripts/payment_idempotency_contract_test.py'
      - 'scripts/payment_idempotency_helper_test.py'
      - '.github/workflows/payment-idempotency-ci.yml'
  pull_request:
    paths:
      - 'services/api/app/booking_admin.py'
      - 'services/api/app/reservation_payments.py'
      - 'services/api/app/payment_idempotency.py'
      - 'services/api/app/app_entry.py'
      - 'services/api/requirements.txt'
      - 'packages/database/**'
      - 'data-intake/**'
      - 'scripts/apply_core_constraints.py'
      - 'scripts/seed_from_intake.py'
      - 'scripts/bootstrap_owner.py'
      - 'scripts/payment_idempotency_contract_test.py'
      - 'scripts/payment_idempotency_helper_test.py'
      - '.github/workflows/payment-idempotency-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  payment-idempotency:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: resort_os
          POSTGRES_USER: resort
          POSTGRES_PASSWORD: resort
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resort -d resort_os"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://resort:resort@localhost:5432/resort_os?schema=public
      PROPERTY_CODE: THREE_CROWNS
      RATE_PLAN_CODE: DIRECT_2026_27
      CORE_API_URL: http://127.0.0.1:8000
      BOOTSTRAP_OWNER_USERNAME: ci-owner
      BOOTSTRAP_OWNER_PASSWORD: CI-Only-Strong-Password-2026
      BOOTSTRAP_OWNER_DISPLAY_NAME: CI Owner
      COOKIE_SECURE: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Validate and create database schema
        working-directory: packages/database
        run: |
          npm install --no-audit --no-fund
          npx prisma validate
          npx prisma db push

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: services/api/requirements.txt

      - name: Install and compile finance contract
        run: |
          pip install -r services/api/requirements.txt
          python -m compileall services/api/app scripts/payment_idempotency_contract_test.py scripts/payment_idempotency_helper_test.py

      - name: Verify payment normalization contract
        env:
          PYTHONPATH: services/api
        run: python scripts/payment_idempotency_helper_test.py

      - name: Apply constraints and seed hotel
        run: |
          python scripts/apply_core_constraints.py
          python scripts/seed_from_intake.py
          python scripts/bootstrap_owner.py

      - name: Start Resort Core
        run: |
          python -m uvicorn app.app_entry:app --app-dir services/api --host 127.0.0.1 --port 8000 > /tmp/payment-idempotency-api.log 2>&1 &
          echo $! > /tmp/payment-idempotency-api.pid
          sleep 3
          curl --fail -sS http://127.0.0.1:8000/health/ready > /tmp/payment-idempotency-ready.json

      - name: Verify payload-bound payment idempotency and races
        run: python scripts/payment_idempotency_contract_test.py

      - name: Show API log on failure
        if: failure()
        run: cat /tmp/payment-idempotency-api.log || true
